    let focusSel = null, ss = null, se = null;
    if (act && $('#main') && $('#main').contains(act)) {
      focusSel = act.id ? '#' + act.id : (act.dataset && act.dataset.form ? '[data-form="' + act.dataset.form + '"][data-k="' + act.dataset.k + '"]' : null);
      try { ss = act.selectionStart; se = act.selectionEnd; } catch (e) { /* not a text field */ }
    }
    renderInner();
    if (focusSel) { const n = $(focusSel); if (n && !n.disabled) { try { n.focus({ preventScroll: true }); if (ss != null) n.setSelectionRange(ss, se); } catch (e) { /* ignore */ } } }
  }
  function renderInner() {
    const tab = App.prefs.tab || 'flight';
    const L = App.state;
    const s = App.sector;
    const top = $('#top');
    const chip = s && s.brief ? '<strong>' + h(s.ref) + '</strong> · ' + h(s.brief.from.icao) + ' → ' + h(s.brief.to.icao) : (L && L.next ? 'Next <strong>' + h(L.next.ref) + '</strong> · ' + h(L.next.from || '') + ' → ' + h(L.next.to || '') : '');
    const live = flightRunning();
    top.innerHTML = '<div class="top-in"><div class="mark">' + FEATHER_SVG + '<b>FEATHER NET</b><span class="tail">N511GW</span></div><div class="sectorchip">' + chip + '</div><div class="grow"></div>' + simChip() +
      '<nav class="tabs" role="tablist" aria-label="Sections">' +
      [['flight', 'Flight'], ['pdf', 'Crew PDF'], ['ledger', 'Ledger'], ['dispatch', 'Dispatch']].map(([id, label]) => '<button class="tab" role="tab" data-act="tab" data-id="' + id + '" aria-selected="' + (tab === id) + '">' + label + (id === 'flight' && live && tab !== 'flight' ? '<span class="dot" aria-label="flight running"></span>' : '') + '</button>').join('') +
      '</nav></div>';
    const main = $('#main');
    const stage = $('#pdfstage');
    if (!App.stateLoaded) { main.className = 'no-key'; main.innerHTML = '<div class="empty"><h2>Connecting to the ops desk</h2><p class="muted">Loading the campaign ledger.</p></div>'; stage.hidden = true; renderKey(); return; }
    let html = '';
    if (tab === 'flight') html = renderFlight();
    else if (tab === 'pdf') html = renderPdf();
    else if (tab === 'ledger') html = renderLedger();
    else html = renderDispatch();
    const showStage = tab === 'pdf' && !!(Frame.target() && Frame.target().brief);
    main.className = showStage ? 'pdf' : (tab === 'flight' && s && s.flight && s.status !== 'flown' ? '' : 'no-key');
    main.innerHTML = html + renderModal();
    stage.hidden = !showStage;
    if (showStage) { Frame.ensure($('#pdfwrap')); Frame.push(); }
    renderKey();
    updateLive();
    if (tab === 'flight') MapView.draw();
  }

  function renderModal() {
    const m = App.ui.modal; if (!m) return '';
    if (m.kind === 'text') return '<div class="modal" data-act="modal-bg"><div class="card" role="dialog" aria-modal="true" aria-label="' + h(m.title) + '"><header><h2>' + h(m.title) + '</h2></header><p class="note">Select all and copy.</p><textarea class="input mono" id="modal-text" rows="12" readonly>' + h(m.text) + '</textarea><div class="row" style="margin-top:12px"><button class="btn primary" data-act="modal-close">Done</button></div></div></div>';
    if (m.kind === 'aog') return '<div class="modal"><div class="card" role="dialog" aria-modal="true" aria-label="Aircraft grounded"><header><h2>N511GW is grounded</h2></header><p class="note">' + m.items.map(i => 'TL ' + h(i.no) + ' ' + h(i.title || i.defect) + '. ' + h(i.limit || '')).join('<br>') + '</p><p class="note" style="margin-top:10px">The brief has no maintenance entry clearing it. Close it on the Ledger tab with Wes’s inspection, or release anyway.</p><div class="row" style="margin-top:14px"><button class="btn" data-act="modal-close">Go back</button><button class="btn danger" data-act="release-anyway">Release anyway</button></div></div></div>';
    if (m.kind === 'confirm') return '<div class="modal"><div class="card" role="dialog" aria-modal="true" aria-label="' + h(m.title) + '"><header><h2>' + h(m.title) + '</h2></header><p class="note">' + h(m.text) + '</p><div class="row" style="margin-top:14px"><button class="btn" data-act="modal-close">Cancel</button><button class="btn ' + (m.danger ? 'danger' : 'primary') + '" data-act="confirm-yes">' + h(m.yes || 'Confirm') + '</button></div></div></div>';
    return '';
  }

  // ── Flight tab ─────────────────────────
  function showTouchdown(s, now, tl) {
    const f = s.flight; if (!f || !f.clock) return false;
    const cf = cfOf(f);
    if (cf.taxi == null) return false;
    if (cf.blocks != null) return !f.touchdown && !f.tdSkip;
    return now >= tl.ldg - 5 * MIN || !!f.touchdown;
  }
  function viewSig(s, now, tl) { return stageOf(s, now, tl) + '|' + (showTouchdown(s, now, tl) ? 1 : 0); }

  function renderFlight() {
    const L = App.state, s = App.sector;
    if (!L || !L.aircraft || (!L.active && !(L.log || []).length && !L.next)) return emptyCampaign();
    if (!s || !s.brief) {
      if (L.active) return '<div class="empty"><h2>Loading ' + h(L.active) + '</h2></div>';
      const nx = L.next;
      return '<div class="empty"><h2>No sector released</h2><p>' + (nx ? h(nx.ref) + ' ' + h(nx.from || '') + ' → ' + h(nx.to || '') + ' is next. Prepare it on the Dispatch tab.' : 'Load a brief on the Dispatch tab to start.') + '</p><button class="btn primary" data-act="tab" data-id="dispatch">Open Dispatch</button></div>';
    }
    if (s.status === 'flown') return '<div class="empty"><h2>' + h(s.ref) + ' is closed</h2><p>Prepare the next sector on the Dispatch tab.</p><button class="btn primary" data-act="tab" data-id="dispatch">Open Dispatch</button></div>';
    const b = s.brief, f = s.flight;
    const left = [], right = [];
    left.push(renderStrip(s));
    if (!f) {
      left.push(renderSetup(s));
    } else {
      const tl = timeline(s), now = simNow(f), cf = cfOf(f);
      App.ui.sig = viewSig(s, now, tl);
      left.push(renderStatus(s));
      if (showTouchdown(s, now, tl)) left.push(renderTouchdown(s));
      if (cf.blocks != null) { left.push(renderRating(s)); left.push(renderDebrief(s)); }
      left.push(renderComposer(s));
      left.push(renderFeed(s));
    }
    right.push(renderMap(s));
    right.push(renderParty(s));
    right.push(renderDaySheet(s));
    if (b.sticky && b.sticky.text) right.push('<div class="sticky" role="note">' + h(b.sticky.text) + '<small>— ' + h(b.sticky.from || '') + '</small></div>');
    right.push(renderMiniLedger());
    right.push(renderSoundCard());
    return '<div class="flight"><div class="stack">' + left.join('') + '</div><aside class="stack">' + right.join('') + '</aside></div>';
  }

  function renderStrip(s) {
    const b = s.brief, f = s.flight;
    const T = briefTimes(b);
    const tl = timeline(s);
    const now = f && f.clock ? simNow(f) : null;
    const si = f && f.clock ? STAGE_IDX[stageOf(s, now, tl)] : -1;
    const chips = STAGES.map((p, i) => '<div class="ph' + (i < si ? ' done' : '') + (i === si ? ' now' : '') + '" title="' + h(p.label) + '">' + p.short + '</div>').join('');
    const sameTz = T.fo === T.too;
    let clocks = '';
    if (f && f.clock) {
      const paused = !f.clock.running;
      clocks = '<div class="clocks"><div class="clock"><span class="label">' + (sameTz ? h(tzLabel(b.from)) + ' local' : h(b.from.icao) + ' ' + h(tzLabel(b.from))) + '</span><span class="t' + (paused ? ' paused' : '') + '" id="clk-dep">--:--</span><span class="z" id="clk-z">----Z</span></div>' +
        (sameTz ? '' : '<div class="clock"><span class="label">' + h(b.to.icao) + ' ' + h(tzLabel(b.to)) + '</span><span class="t' + (paused ? ' paused' : '') + '" id="clk-arr">--:--</span><span class="z">&nbsp;</span></div>') + '</div>';
    }
    const ctl = f && f.clock && s.status !== 'flown' ? renderControls(s, tl, now) : '';
    const setRow = App.ui.clockSet ? '<div class="row"><label class="field" style="max-width:180px"><span>Match the sim clock</span><input class="input mono" id="clock-set-input" placeholder="HH:MM" inputmode="numeric" value="' + h(App.ui.clockSetVal || '') + '"></label><button class="btn primary" data-act="clock-set-go">Set</button><button class="btn ghost" data-act="clock-set-cancel">Cancel</button></div>' : '';
    return '<section class="strip" aria-label="Sector"><div class="strip-top"><div class="route"><span class="nick">' + h(b.ref) + (b.nickname ? ' · “' + h(upper(b.nickname)) + '”' : '') + (b.rev && b.rev !== 'A' ? ' · REV ' + h(b.rev) : '') + '</span><h1>' + h(b.from.icao) + '<span class="arrow">→</span>' + h(b.to.icao) + '</h1><p>' + h(b.from.name || '') + ' to ' + h(b.to.name || '') + (T.off != null ? ' · ' + dowDate(T.off, T.fo) + ' · off ' + hhmm(T.off, T.fo) + ' · on ' + hhmm(T.on, T.too) + ' · block ' + hm(T.blockMin) : '') + '</p></div>' + clocks + '</div>' +
      '<div class="phases" aria-label="Where the flight is">' + chips + '</div>' + (T.off != null ? renderTimes(s, tl, now) : '') + simReadouts(s) + ctl + setRow + '</section>';
  }

  function renderTimes(s, tl, now) {
    const f = s.flight || {}, cf = cfOf(f), T = tl.T;
    const done = t => cf.taxi != null && now != null && t <= now;
    const val = (t, tz, est) => t == null ? '<b class="nil">--:--</b>' : '<b' + (est ? ' class="est"' : '') + '>' + (est ? '~' : '') + hhmm(t, tz) + '</b>';
    const cell = (k, html) => '<span class="tm"><span class="label">' + k + '</span>' + html + '</span>';
    return '<div class="times" aria-label="Times, local. A tilde marks an estimate.">' + [
      cell('APU', val(cf.apu, T.fo)),
      cell('ENG', val(cf.start, T.fo)),
      cell('OFF', cf.taxi != null ? val(cf.taxi, T.fo) : val(tl.offPlan, T.fo, true)),
      cell('T/O', val(tl.to, T.fo, !done(tl.to))),
      cell('TOD', val(tl.tod, T.too, !done(tl.tod))),
      cell('LDG', val(tl.ldg, T.too, !done(tl.ldg))),
      cell('ON', cf.blocks != null ? val(cf.blocks, T.too) : val(tl.onEst, T.too, true))
    ].join('') + '</div>';
  }

  function renderControls(s, tl, now) {
    const f = s.flight, cf = cfOf(f);
    const following = Link.liveFor(s) && Link.clockOff == null;
    const clock = following ? '<div class="ctl-group" role="group" aria-label="Sim clock"><span class="follow"><i></i>Following X-Plane</span><button class="btn" data-act="sim-off">Fly without the sim link</button></div>' :
      (f.simOn === false && Link.state === 'live' ? '<div class="ctl-group"><button class="btn" data-act="sim-on">Follow X-Plane again</button></div>' : '') + '<div class="ctl-group" role="group" aria-label="Sim clock">' + (f.clock.running ? '<button class="btn" data-act="clock" data-cmd="pause">Pause</button>' : '<button class="btn primary" data-act="clock" data-cmd="run">Resume</button>') +
      '<button class="btn" data-act="clock" data-cmd="nudge" data-arg="-5" aria-label="Back five minutes">−5</button><button class="btn" data-act="clock" data-cmd="nudge" data-arg="-1" aria-label="Back one minute">−1</button><button class="btn" data-act="clock" data-cmd="nudge" data-arg="1" aria-label="Forward one minute">+1</button><button class="btn" data-act="clock" data-cmd="nudge" data-arg="5" aria-label="Forward five minutes">+5</button><button class="btn" data-act="clock-set">Set</button></div>';
    const seg = segNow(s, now, tl);
    const what = seg === 'dep' ? 'Hold departure' : 'Running late';
    const delay = seg ? '<div class="ctl-group" role="group" aria-label="' + what + '"><span class="label">' + what + '</span>' + [5, 10, 15].map(m => '<button class="btn" data-act="delay" data-min="' + m + '" aria-label="' + what + ', ' + m + ' minutes">+' + m + '</button>').join('') + '</div>' : '';
    const flight = '<div class="ctl-group end" role="group" aria-label="Flight"><button class="btn ghost" data-act="restart">Restart</button>' + (cf.blocks == null ? '<button class="btn ghost danger" data-act="end-flight">End flight</button>' : '') + '</div>';
    return '<div class="ctl-row">' + clock + delay + flight + '</div>';
  }

  function renderSetup(s) {
    const b = s.brief, sim = b.sim || {};
    const T = briefTimes(b), fp = fuelPlan(b);
    const sp = sim.setPiece;
    const st = s.story;
    const cells = [
      ['Start', b.from.icao + ' ' + (b.from.name || ''), sim.start || b.from.parking || ''],
      ['State', sim.state || 'Cold and dark', ''],
      ['Set clock', T.clockT != null ? hhmm(T.clockT, T.fo) + ' ' + tzLabel(b.from) : '—', T.off != null ? dowDate(T.off, T.fo) + ' ' + new Date(T.off).getUTCFullYear() : ''],
      ['Weather', sp && sp.title ? 'Set-piece' : (sim.weather || 'Real weather'), sp && sp.title ? sp.title : ''],
      ['Ramp fuel', fmt(fp.ramp) + ' lb', 'Payload ' + fmt(num(b.payloadLb)) + ' lb'],
      ['Cruise', (b.flight && b.flight.cruise) || '—', 'Time warp ' + (sim.timeWarp || 'none')]
    ];
    const apu = cueOf(s, 'apu'), start = cueOf(s, 'start'), taxi = cueOf(s, 'taxi');
    const first = x => (person(x.from) || {}).first || x.from;
    return '<section class="card setup" aria-label="Sim setup"><header><h2>Set up X-Plane, then start the clock</h2><span class="label">Sim setup</span></header>' +
      '<div class="setup-grid">' + cells.map(c => '<div><span class="label">' + h(c[0]) + '</span><b>' + h(c[1]) + '</b>' + (c[2] ? '<small>' + h(c[2]) + '</small>' : '') + '</div>').join('') + '</div>' +
      (st && (st.opsReason || st.detail) ? '<div class="story">' + (st.opsReason ? '<p><span class="label">Why we’re flying</span>' + h(st.opsReason) + '</p>' : '') + (st.detail ? '<p><span class="label">Today</span>' + h(st.detail) + '</p>' : '') + '</div>' : '') +
      (b.revNote ? '<div class="banner">Rev ' + h(b.rev || 'B') + ': ' + h(b.revNote) + '</div>' : '') +
      '<div class="howto"><span class="label">How the sector runs</span><ol>' +
      '<li>The crew calls each step: ' + h(first(apu)) + ' for APU start, ' + h(first(start)) + ' for engine start, ' + h(first(taxi)) + ' for taxi. Do it in the sim, then confirm on the big button. The sector waits at each call until you do.</li>' +
      '<li>From the taxi call it runs on the clock: takeoff, climb, descent and landing follow the plan. Holding or running late? Use the delay buttons.</li>' +
      '<li>Priya calls the stand. Confirm on blocks, log the touchdown rate, and the crew rate the sector.</li></ol></div>' + renderLinkCard(s) +
      '<div class="row"><button class="btn primary" data-act="start">Start the clock at ' + (T.clockT != null ? hhmm(T.clockT, T.fo) : 'now') + '</button><label class="field" style="max-width:150px"><span>Or start at</span><input class="input mono" id="start-at" placeholder="HH:MM" inputmode="numeric"></label><button class="btn" data-act="start-at">Start</button></div>' +
      '<p class="note">FEATHER NET keeps its own clock at sim speed. If you pause X-Plane, pause it here too.</p></section>';
  }

  function renderStatus(s) {
    const f = s.flight, b = s.brief;
    const her = principalAboard(b);
    const rows = dayRows(s);
    const now = simNow(f);
    const st = curStatus(s, now);
    const nextRow = rows.find(r => r.t > now);
    return '<section class="status" aria-label="Status"><div><span class="label">ESPRESSO</span><span class="big esp' + (her || st !== 'not-aboard' ? '' : ' off') + '"><i></i><span id="esp-status">' + h(STATUS[st] || upper(st || '')) + '</span></span></div>' +
      '<div><span class="label">Next on the day sheet</span><span class="big" id="next-row">' + (nextRow ? h(nextRow.label) : 'Nothing left today') + '</span><span class="muted mono" id="next-row-t">' + (nextRow ? hhmm(nextRow.t, nextRow.off) + ' · ' + untilText(nextRow.t - now) : '') + '</span></div></section>';
  }

  function renderTouchdown(s) {
    const f = s.flight;
    const done = f.touchdown;
    return '<section class="card td" aria-label="Touchdown"><header><h2>' + (done ? 'Touchdown logged' : 'Touchdown rate') + '</h2><span class="label">' + (done ? h(done.fpm) + ' fpm · ' + h(done.band) : 'From the sim or your landing app') + '</span></header>' +
      '<div class="td-input"><input class="input" id="td-fpm" inputmode="numeric" placeholder="fpm" value="' + h(done ? done.fpm : '') + '" aria-label="Touchdown rate in feet per minute"><button class="btn primary" data-act="td">' + (done ? 'Update' : 'Log it') + '</button>' + (done || cfOf(f).blocks == null ? '' : '<button class="btn ghost" data-act="td-skip">Skip</button>') + '</div>' +
      '<div class="td-quick">' + [80, 120, 160, 220, 300, 420, 650].map(v => '<button class="btn" data-act="td-quick" data-v="' + v + '">' + v + '</button>').join('') + '</div>' +
      '<p class="note">Under 150 smooth · 150 to 300 normal · 300 to 600 firm · 600 and over is a hard landing and a tech log entry.</p></section>';
  }

  function starsHtml(v, reveal, i, big) {
    return '<span class="stars' + (big ? ' big' : '') + (reveal ? ' reveal' : '') + '" role="img" aria-label="' + v + ' out of 5" style="--v:' + v + (reveal ? ';--d:' + (i * 160) + 'ms' : '') + '"><i></i></span>';
  }
  function ratingWord(v) { return v >= 4.75 ? 'A perfect sector' : v >= 4.25 ? 'A very good sector' : v >= 3.5 ? 'A decent sector' : v >= 2.5 ? 'A rough one' : 'One to forget'; }
  function renderRating(s) {
    const f = s.flight, r = f.rating;
    if (!r) {
      if (f.touchdown || f.tdSkip) return '';
      return '<section class="card rating" aria-label="Crew rating"><header><h2>Crew rating</h2><span class="label">' + h(s.ref) + '</span></header><p class="note">Log the touchdown rate above, or skip it, and the crew will rate the sector.</p></section>';
    }
    const reveal = App.ui.reveal === r.at && App.ui.revealed !== r.at;
    if (reveal) App.ui.revealed = r.at;
    const rows = r.raters.map((x, i) => {
      const line = r.lines ? r.lines[x.id] : null;
      return '<div class="rt-row"><div class="rt-who"><b>' + h(x.name) + '</b>' + (x.id === 'espresso' ? '<small>via ' + h(r.via) + '</small>' : '') + '</div>' + starsHtml(x.stars, reveal, i + 1) + '<p class="rt-line">' + (line ? h(line) : '<span class="thinking">Writing…</span>') + '</p></div>';
    }).join('');
    const facts = (r.facts || []).filter(x => x.t).map(x => '<li class="' + (x.v > 0 ? 'up' : x.v < 0 ? 'down' : '') + '">' + h(x.t) + '</li>').join('');
    return '<section class="card rating" aria-label="Crew rating"><header><h2>Crew rating</h2><span class="label">' + h(s.ref) + '</span></header>' +
      '<div class="rt-top"><span class="rt-score">' + r.overall.toFixed(1) + '</span>' + starsHtml(Math.round(r.overall * 2) / 2, reveal, 0, true) + '<span class="rt-word">' + ratingWord(r.overall) + '</span></div>' +
      '<div class="rt-list">' + rows + '</div>' + (facts ? '<div class="rt-facts"><span class="label">What counted</span><ul>' + facts + '</ul></div>' : '') + '</section>';
  }

  function renderComposer(s) {
    if (!AI.ok) return '';
    const ab = aboardList(s.brief);
    const who = ['CAB', 'SIC', '9', '3', '2', 'OPS'].filter(id => id === 'CAB' || id === 'SIC' || id === 'OPS' || ab.includes(Number(id)));
    if (!who.includes(App.ui.composer.to)) App.ui.composer.to = 'CAB';
    const p = personById(App.ui.composer.to);
    const ch = channelFor(p, stageOf(s), s.brief);
    const busy = App.ui.composer.busy;
    return '<section class="card" aria-label="Talk to the crew"><div class="composer"><select class="input" id="cmp-to" aria-label="Who">' + who.map(id => { const x = personById(id); return '<option value="' + id + '"' + (id === App.ui.composer.to ? ' selected' : '') + '>' + h(x.first) + ' · ' + h(x.call) + '</option>'; }).join('') + '</select>' +
      '<input class="input" id="cmp-text" placeholder="Say something on the ' + CH_NAME[ch].toLowerCase() + '" value="' + h(App.ui.composer.text) + '"' + (busy ? ' disabled' : '') + ' maxlength="300"><button class="btn primary" data-act="send"' + (busy ? ' disabled' : '') + '>' + (busy ? '…' : 'Send') + '</button></div>' +
      (busy ? '<p class="thinking" style="margin-top:8px">' + h(p.first) + ' is answering…</p>' : '') + '</section>';
  }

  function renderFeed(s) {
    const f = s.flight;
    const T = briefTimes(s.brief);
    const tl = timeline(s);
    const cf = cfOf(f);
    const feed = f.feed || [];
    if (!feed.length) return '<section class="feed" aria-label="Messages"><div class="empty"><h2>Quiet on the net</h2><p class="muted">Messages arrive here as the day unfolds. The first ones usually come in the first few minutes.</p></div></section>';
    const evs = Object.fromEntries(((s.companion && s.companion.events) || []).map(e => [e.id, e]));
    const nx = nextStep(f);
    return '<section class="feed" aria-label="Messages" aria-live="polite">' + feed.map((e, i) => {
      const p = person(e.from);
      const air = e.sim != null && cf.taxi != null && e.sim >= tl.to;
      const t = e.sim != null ? hhmm(e.sim, air ? T.too : T.fo) : '';
      const ch = e.ch || 'SYS';
      const cls = ['msg', 'c-' + ch]; if (i === 0) cls.push('first'); if (e.kind === 'pilot') cls.push('pilot'); if (e.kind === 'event') cls.push('event'); if (e.kind === 'cue') cls.push('cue');
      const fromLabel = e.kind === 'pilot' ? 'FEATHER 1' : (p ? (ch === 'NET' || ch === 'OPS' ? p.call : p.first) : e.from);
      const sub = e.kind === 'pilot' ? 'You' : e.relay ? 'for ' + e.relay : (p && p.id !== 'OPS' ? (ch === 'NET' || ch === 'OPS' ? p.first : p.call) : '');
      let tag = '', extra = '';
      if (e.kind === 'event' && evs[e.eventId]) {
        const ev = evs[e.eventId];
        const d = (f.decisions || {})[ev.id];
        tag = '<span class="event-title">' + h(ev.title) + '</span>';
        extra = d ? '<p class="outcome">LOGGED · ' + h(d.outcome || d.label) + '</p>' : (ev.hold ? '<p class="holdchip">Holding for your answer</p>' : '') + '<div class="opts">' + ev.options.map(o => '<button class="btn" data-act="choose" data-ev="' + h(ev.id) + '" data-opt="' + h(o.id) + '">' + h(o.label) + '</button>').join('') + '</div>' + (AI.ok ? '<p class="note">Or answer in your own words with the box above.</p>' : '');
      } else if (e.kind === 'cue' && e.step && STEP_IDX[e.step] != null) {
        const st = STEPS[STEP_IDX[e.step]];
        tag = '<span class="event-title">Ready · ' + h(st.label) + '</span>';
        extra = cf[e.step] != null ? '<p class="outcome ok">CONFIRMED ' + hhmm(cf[e.step], e.step === 'blocks' ? T.too : T.fo) + '</p>' : (nx && nx.id === e.step ? '<div class="opts"><button class="btn primary" data-act="confirm" data-id="' + h(e.step) + '">' + h(st.btn) + '</button></div>' : '');
      } else if (e.kind === 'check') {
        extra = '<p class="outcome ' + (e.pass ? 'ok' : 'bad') + '">' + (e.pass ? 'MADE IT' : 'MISSED IT') + '</p>';
      }
      if (e.src === 'sim') tag = '<span class="event-title simtag">From X-Plane</span>';
      return '<article class="' + cls.join(' ') + '"><header><span class="ch">' + h(ch) + '</span><span class="from">' + h(fromLabel) + (sub ? '<small>' + h(sub) + '</small>' : '') + '</span><time>' + h(t) + '</time></header>' + tag + '<p class="txt">' + h(e.text) + '</p>' + extra + '</article>';
    }).join('') + '</section>';
  }

  function renderDaySheet(s) {
    const c = s.companion || {};
    const rows = dayRows(s);
    const now = s.flight && s.flight.clock ? simNow(s.flight) : null;
    const nextI = now != null ? rows.findIndex(r => r.t > now) : -1;
    return '<section class="card" aria-label="Day sheet"><header><h2>' + h((c.daySheet && c.daySheet.title) || 'Day sheet') + '</h2><span class="label">' + h((c.daySheet && c.daySheet.date) || '') + '</span></header><div class="daysheet">' +
      (rows.length ? rows.map((r, i) => '<div class="ds-row' + (now != null && r.t <= now ? ' past' : '') + (i === nextI ? ' next' : '') + (r.flight ? ' flight' : '') + '"><span class="t">' + hhmm(r.t, r.off) + '</span><span class="l">' + h(r.label) + (r.revised ? '<span class="rev">REVISED</span>' : '') + (r.actual ? '<span class="rev" style="color:var(--ok)">ACTUAL</span>' : '') + '<span class="w">' + h(r.who || '') + '</span></span></div>').join('') : '<p class="muted">No day sheet for this sector.</p>') + '</div></section>';
  }

  function renderAboard(s) {
    const b = s.brief;
    const ab = aboardList(b);
    const rows = [personById('PIC'), personById('SIC'), personById('CAB')].map(p => ({ s: p.id, n: p.first === 'Captain' ? 'Capt Ferraro (you)' : p.name, c: p.call, vip: false }))
      .concat(ab.map(n => personById(n)).filter(Boolean).map(p => ({ s: p.id, n: p.id === '1' ? 'The Principal' : p.name, c: p.call, vip: p.id === '1' })))
      .concat((Array.isArray(b.extraPax) ? b.extraPax : []).map(x => ({ s: '+', n: x.name || 'Guest', c: x.role || '', vip: false })))
      .concat(b.dog !== false ? [{ s: 'K9', n: 'Goodwin', c: 'MANCHILD', vip: false }] : []);
    return '<section class="card" aria-label="Who’s aboard"><header><h2>Aboard</h2><span class="label">' + (rows.length - (b.dog !== false ? 1 : 0)) + ' POB' + (b.dog !== false ? ' + K9' : '') + '</span></header><div class="aboard">' + rows.map(r => '<div class="ab-row' + (r.vip ? ' vip' : '') + '"><span class="s">' + h(r.s) + '</span><span class="n">' + h(r.n) + '</span><span class="c">' + h(r.c) + '</span></div>').join('') + '</div></section>';
  }

  function renderMiniLedger() {
    const L = App.state; if (!L) return '';
    const oi = openItems(L), ot = openThreads(L), orq = openRequests(L);
    if (!oi.length && !ot.length && !orq.length) return '';

      oi.map(i => '<div class="row" style="gap:8px;align-items:baseline"><span class="chip st-' + (i.aog ? 'AOG' : i.status) + '">' + (i.aog ? 'AOG' : h(i.status)) + '</span><span class="mono" style="font-size:12px">' + h(i.no) + '</span><span style="font-size:13px;min-width:0">' + h(i.title || shortTitle(i.defect)) + (i.limit ? ' <span class="muted">· ' + h(i.limit) + '</span>' : '') + '</span></div>').join('') +
      ot.map(t => '<div class="row" style="gap:8px;align-items:baseline"><span class="chip st-' + h(t.status) + '">' + h(t.status) + '</span><span class="mono" style="font-size:12px">' + h(t.ref) + '</span><span style="font-size:13px;min-width:0">' + h(t.title || shortTitle(t.text)) + '</span></div>').join('') +
      orq.map(r => '<div class="row" style="gap:8px;align-items:baseline"><span class="chip st-OPEN">ASK</span><span style="font-size:13px;min-width:0">' + h(r.from) + ': ' + h(r.text) + '</span></div>').join('') + '</div></section>';
  }

  function renderSoundCard() {
    const p = App.prefs;
    const voiceOk = 'speechSynthesis' in window;
    return '<section class="card" aria-label="Sound"><header><h2>Sound</h2></header><div class="stack" style="gap:10px">' +
      '<label class="toggle"><input type="checkbox" data-act="pref" data-k="sound"' + (p.sound ? ' checked' : '') + '> Radio and interphone tones</label>' +
      (voiceOk ? '<label class="toggle"><input type="checkbox" data-act="pref" data-k="voice"' + (p.voice ? ' checked' : '') + '> Read messages aloud</label><label class="toggle"><input type="checkbox" data-act="pref" data-k="readOps"' + (p.readOps ? ' checked' : '') + '> Read datalink aloud too</label>' : '<p class="note">This browser can’t read messages aloud.</p>') +
      '<button class="btn small" data-act="test-sound">Test</button></div></section>';
  }

  function renderDebrief(s) {
    const b = s.brief, f = s.flight || {};
    const T = briefTimes(b), fp = fuelPlan(b);
    const cf = cfOf(f), tl = timeline(s);
    const v = App.ui.forms.debrief || (App.ui.forms.debrief = {
      offLocal: cf.taxi != null ? hhmm(cf.taxi, T.fo) : '',
      onLocal: cf.blocks != null ? hhmm(cf.blocks, T.too) : '',
      flightMin: cf.taxi != null ? String(Math.max(0, Math.round((Math.min(tl.ldg, cf.blocks != null ? cf.blocks : tl.ldg) - tl.to) / MIN))) : String(T.airMin),
      fpm: f.touchdown ? String(f.touchdown.fpm) : '', fob: String(f.simFuel != null ? f.simFuel : Math.max(0, fp.landing - 120)), snags: '', notes: ''
    });
    if (!v.fpm && f.touchdown) v.fpm = String(f.touchdown.fpm);
    return '<section class="card" aria-label="Debrief"><header><h2>Debrief ' + h(b.ref) + '</h2><span class="label">Closes the sector into the ledger</span></header><div class="stack" style="gap:12px">' +
      '<div class="grid4">' + field('debrief', 'offLocal', 'Off blocks ' + tzLabel(b.from), v.offLocal, 'HH:MM') + field('debrief', 'onLocal', 'On blocks ' + tzLabel(b.to), v.onLocal, 'HH:MM') + field('debrief', 'flightMin', 'Flight time (min)', v.flightMin, '48') + field('debrief', 'fpm', 'Touchdown (fpm)', v.fpm, '140') + '</div>' +
      '<div class="grid2">' + field('debrief', 'fob', 'Fuel at shutdown (lb)', v.fob, '2,900') + '<div class="note" style="align-self:end">Read it off the fuel page. Planned landing fuel was ' + fmt(fp.landing) + ' lb. It becomes fuel on board for the next sector.</div></div>' +
      area('debrief', 'snags', 'Anything to write up? One per line', v.snags, 'e.g. PACK 2 OVHT flickered passing FL200') +
      area('debrief', 'notes', 'Notes for the next brief', v.notes, 'Anything that happened that the next brief should know about') +
      '<div class="row"><button class="btn primary" data-act="close-sector">Close ' + h(b.ref) + '</button><span class="note">Hours, cycles, fuel, landings, decisions, the crew rating and write-ups go into the ledger.</span></div></div></section>';
  }
  function field(form, k, label, val, ph) { return '<label class="field"><span>' + h(label) + '</span><input class="input mono" data-form="' + form + '" data-k="' + k + '" value="' + h(val) + '" placeholder="' + h(ph || '') + '"></label>'; }
  function area(form, k, label, val, ph) { return '<label class="field"><span>' + h(label) + '</span><textarea class="input" data-form="' + form + '" data-k="' + k + '" placeholder="' + h(ph || '') + '">' + h(val) + '</textarea></label>'; }

  function emptyCampaign() {
    return '<div class="empty"><h2>No campaign on file yet</h2><p>FEATHER NET starts from a brief. Load the latest sector’s JSON on the Dispatch tab, or import a campaign file.</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="tab" data-id="dispatch">Open Dispatch</button></div></div>';
  }

  // ── the key: the crew's next call, and the captain's confirmation ──
  function keyWho(s, id) { const c = cueOf(s, id); return (person(c.from) || {}).first || c.from; }
  function idleText(s, sc) {
    const nx = sc.nx, T = sc.tl.T;
    if (sc.holdBy) return 'Waiting on your answer: ' + sc.holdBy.title + '.';
    const due = cueDue(s, sc.tl, nx.id);
    if (!isFinite(due)) return keyWho(s, nx.id) + ' calls the stand once X-Plane has you on the ground. Parked sooner? Tap twice.';
    if (nx.id === 'blocks') return keyWho(s, nx.id) + ' calls the stand about ' + hhmm(due, T.too) + ' · ' + untilText(due - sc.now) + '. Parked sooner? Tap twice.';
    return keyWho(s, nx.id) + ' calls it about ' + hhmm(due, T.fo) + ' · ' + untilText(due - sc.now) + '. Tap twice to go now.';
  }
  function earlyArmed(id) { return !!(App.ui.early && App.ui.early.id === id && Date.now() - App.ui.early.at < 5000); }
  function renderKey() {
    let bar = $('#keybar');
    const s = App.sector;
    const show = (App.prefs.tab || 'flight') === 'flight' && s && s.flight && s.flight.clock && s.status !== 'flown';
    if (!show) { if (bar) bar.hidden = true; return; }
    if (!bar) { bar = document.createElement('div'); bar.id = 'keybar'; bar.className = 'keybar'; document.body.appendChild(bar); }
    bar.hidden = false;
    const f = s.flight;
    const sc = scan(s);
    const nx = sc.nx;
    App.ui.heldN = sc.held;
    const undo = App.undo && Date.now() - App.undo.at < 20000;
    let key;
    if (!nx) {
      key = '<button class="key" data-act="scroll-debrief"><span class="k1">DONE</span><span class="kmain"><span class="k2">Close the sector</span><span class="k3">Crew rating, fuel and anything to write up</span></span><span class="chev" aria-hidden="true">▾</span></button>';
    } else if ((f.delivered || []).includes('q:' + nx.id)) {
      const cue = cueOf(s, nx.id);
      key = '<button class="key cued" data-act="confirm" data-id="' + nx.id + '"><span class="k1">CONFIRM</span><span class="kmain"><span class="k2">' + h(nx.label) + '</span><span class="k3">' + h(keyWho(s, nx.id)) + ': ' + h(cue.text) + '</span></span><span class="chev" aria-hidden="true">✓</span></button>';
    } else {
      const armed = earlyArmed(nx.id);
      key = '<button class="key idle' + (armed ? ' armed' : '') + '" data-act="confirm-early" data-id="' + nx.id + '"><span class="k1">NEXT</span><span class="kmain"><span class="k2">' + h(nx.label) + '</span><span class="k3" id="key-when">' + h(armed ? 'Tap again to confirm now, ahead of the call.' : idleText(s, sc)) + '</span></span></button>';
    }
    const side = (sc.held ? '<span class="waiting" id="key-held" title="Calls waiting for you">' + sc.held + ' waiting</span>' : '') + (undo ? '<button class="btn" data-act="undo">Undo</button>' : '');
    bar.innerHTML = '<div class="keybar-in">' + key + (side ? '<div class="keyside">' + side + '</div>' : '') + '</div>';
  }

  // live bits without a full render
  function updateLive() {
    const s = App.sector;
    if (!s || !s.flight || !s.flight.clock) return;
    const f = s.flight, b = s.brief;
    const T = briefTimes(b);
    const now = simNow(f);
    const dep = $('#clk-dep'), arr = $('#clk-arr'), z = $('#clk-z');
    if (dep) dep.textContent = hhmm(now, T.fo);
    if (arr) arr.textContent = hhmm(now, T.too);
    if (z) z.textContent = zulu(now) + (f.clock.running ? '' : ' · PAUSED');
    const nr = $('#next-row-t');
    if (nr) {
      const rows = dayRows(s); const n = rows.find(r => r.t > now);
      const label = $('#next-row');
      if (n) { nr.textContent = hhmm(n.t, n.off) + ' · ' + untilText(n.t - now); if (label && label.textContent !== n.label) label.textContent = n.label; }
      else { nr.textContent = ''; if (label) label.textContent = 'Nothing left today'; }
    }
    const es = $('#esp-status');
    if (es) { const t = STATUS[curStatus(s, now)] || ''; if (t && es.textContent !== t) es.textContent = t; }
    if ((App.prefs.tab || 'flight') !== 'flight' || s.status === 'flown') return;
    const tl = timeline(s);
    // the stage moves on by itself after taxi; redraw when it does
    const sig = viewSig(s, now, tl);
    if (App.ui.sig != null && sig !== App.ui.sig) { App.ui.sig = sig; scheduleRender(); return; }
    const sc = scan(s);
    if (sc.held !== App.ui.heldN) { renderKey(); return; }
    const kw = $('#key-when');
    if (kw && sc.nx && !earlyArmed(sc.nx.id)) { const t = idleText(s, sc); if (kw.textContent !== t) kw.textContent = t; }
    if (!App.lastDsRender || Date.now() - App.lastDsRender > 30000) {
      App.lastDsRender = Date.now();
      if (!typing()) {
        const ds = $('section[aria-label="Day sheet"]');
        if (ds) ds.outerHTML = renderDaySheet(s);
      }
    }
  }

  // ── Crew PDF tab ──────────────────────
  function renderPdf() {
    const s = Frame.target();
    if (!s || !s.brief) return '<div class="empty"><h2>No brief loaded</h2><p>Release a sector or load a brief JSON on the Dispatch tab.</p><button class="btn primary" data-act="tab" data-id="dispatch">Open Dispatch</button></div>';
    const b = s.brief;
    const opts = (App.ui.pdfList || []).map(x => '<option value="' + h(x.ref) + '"' + (x.ref === s.ref ? ' selected' : '') + '>' + h(x.ref) + ' · ' + h(x.route) + '</option>').join('');
    return '<div class="pdfbar"><h2>' + h(b.ref) + ' · ' + h(b.from.icao) + ' → ' + h(b.to.icao) + ' · REV ' + h(b.rev || 'A') + '</h2>' + (s.status === 'draft' ? '<span class="chip st-OPEN">DRAFT</span>' : '') +
      '<div class="grow"></div>' + (opts ? '<select class="input" id="pdf-pick" style="width:auto" aria-label="Brief">' + opts + '</select>' : '<button class="btn small ghost" data-act="pdf-list">Earlier briefs</button>') +
      '<button class="btn small" data-act="dl-brief">Download for print</button><button class="btn small" data-act="copy-json">Copy JSON</button></div>';
  }

  // ── Ledger tab ────────────────────────
  function renderLedger() {
    const L = App.state;
    if (!L || !L.aircraft || (!L.aircraft.at && !(L.items || []).length)) return emptyCampaign();
    const A = L.aircraft;
    const toGo = num(A.nextDueHours) - num(A.hours);
    const pct = A.nextDueHours ? Math.max(0, Math.min(100, (num(A.hours) / num(A.nextDueHours)) * 100)) : 0;
    const items = (L.items || []).slice();
    const open = items.filter(i => i.status !== 'CLOSED').sort((a, b) => (b.aog ? 1 : 0) - (a.aog ? 1 : 0) || String(a.no).localeCompare(String(b.no)));
    const closed = items.filter(i => i.status === 'CLOSED').reverse();
    const edit = App.ui.edit || {};
    const itemHtml = i => {
      const form = edit.kind === 'item' && edit.id === i.no ? maintForm(i) : '';
      return '<div class="item"><div class="item-head"><span class="chip st-' + (i.aog ? 'AOG' : i.status) + '">' + (i.aog ? 'AOG' : h(i.status)) + '</span><span class="no">' + h(i.no) + '</span><span class="ti">' + h(i.title || shortTitle(i.defect)) + '</span><span class="meta">' + h([i.cat, i.mel ? 'MEL ' + i.mel : '', i.due ? 'due ' + i.due : ''].filter(Boolean).join(' · ')) + '</span></div>' +
        (squash(i.defect) !== squash(i.title || shortTitle(i.defect)) ? '<p class="note">' + h(i.defect) + '</p>' : '') + (i.limit && i.status !== 'CLOSED' ? '<p class="lim">' + h(i.limit) + '</p>' : '') +
        ((i.history || []).length ? '<div class="hist">' + i.history.map(x => '<div><span>' + h([x.ref, x.date, x.status].filter(Boolean).join(' ')) + '</span>' + h(x.text) + '</div>').join('') + '</div>' : '') +
        (i.status !== 'CLOSED' && !form ? '<div class="row"><button class="btn small" data-act="edit" data-kind="item" data-id="' + h(i.no) + '">Maintenance entry</button></div>' : '') + form + '</div>';
    };
    const threads = (L.threads || []);
    const reqs = (L.requests || []);
    const html = [];
    html.push('<section class="card wide" aria-label="Aircraft"><div class="ac"><div class="kv where"><span class="label">N511GW is at</span><b>' + h(A.at || '—') + '</b><small>' + h([A.atName, A.parked].filter(Boolean).join(' · ')) + '</small></div>' +
      '<div class="kv"><span class="label">Fuel on board</span><b>' + fmt(A.fobLb) + '</b><small>lb</small></div><div class="kv"><span class="label">Airframe</span><b>' + fmtHours(A.hours) + '</b><small>hours</small></div><div class="kv"><span class="label">Cycles</span><b>' + fmt(A.cycles) + '</b><small>' + h(A.lastInsp || '') + '</small></div>' +
      '<div class="kv"><span class="label">Next inspection</span><b>' + (A.nextDueHours ? fmtHours(toGo) : '—') + '</b><small>hrs to ' + h(A.nextDue || '') + '</small><div class="meter" aria-hidden="true"><i style="width:' + pct.toFixed(1) + '%"></i></div></div></div>' +
      '<div class="row" style="margin-top:12px"><button class="btn small ghost" data-act="edit" data-kind="aircraft">Correct these numbers</button><button class="btn small ghost" data-act="edit" data-kind="new-item">Write up a new item</button></div>' + (edit.kind === 'aircraft' ? aircraftForm(A) : '') + (edit.kind === 'new-item' ? newItemForm() : '') + '</section>');
    html.push('<section class="card wide" aria-label="Tech log"><header><h2>Tech log</h2><span class="label">' + open.length + ' open · ' + closed.length + ' closed</span></header>' + (open.length ? open.map(itemHtml).join('') : '<p class="muted">Nothing open. The aeroplane is clean.</p>') +
      (closed.length ? '<details class="closed"><summary>Closed items (' + closed.length + ')</summary>' + closed.map(itemHtml).join('') + '</details>' : '') + '</section>');
    html.push('<section class="card" aria-label="Threads"><header><h2>Ops threads</h2><span class="label">' + openThreads(L).length + ' open</span></header>' + (threads.length ? threads.slice().reverse().map(t => '<div class="item"><div class="item-head"><span class="chip st-' + h(t.status) + '">' + h(t.status) + '</span><span class="no">' + h(t.ref) + '</span><span class="ti">' + h(t.title || '') + '</span><span class="meta">' + h(t.owner || '') + '</span></div><p class="note">' + h(t.text) + '</p>' + ((t.history || []).length ? '<div class="hist">' + t.history.map(x => '<div><span>' + h([x.ref, x.status].filter(Boolean).join(' ')) + '</span>' + h(x.text) + '</div>').join('') + '</div>' : '') + (t.status !== 'CLOSED' ? (edit.kind === 'thread' && edit.id === t.ref ? threadForm(t) : '<div class="row"><button class="btn small" data-act="edit" data-kind="thread" data-id="' + h(t.ref) + '">Update</button></div>') : '') + '</div>').join('') : '<p class="muted">No ops threads.</p>') + '</section>');
    html.push('<section class="card" aria-label="Requests"><header><h2>Crew requests</h2><span class="label">' + openRequests(L).length + ' open</span></header>' + (reqs.length ? reqs.slice().reverse().map(r => '<div class="item"><div class="item-head"><span class="chip st-' + (r.status === 'DONE' ? 'DONE' : 'OPEN') + '">' + h(r.status) + '</span><span class="ti">' + h(r.from || '') + '</span><span class="meta">' + h(r.opened || '') + (r.closed ? ' → ' + h(r.closed) : '') + '</span></div><p class="note">' + h(r.text) + '</p>' + (r.status !== 'DONE' ? '<div class="row"><button class="btn small" data-act="req-done" data-id="' + h(r.id) + '">Mark done</button></div>' : '') + '</div>').join('') : '<p class="muted">Nobody has asked for anything. Yet.</p>') + '</section>');
    html.push('<section class="card" aria-label="Landing trend"><header><h2>Landing trend</h2><span class="label">fpm at touchdown</span></header>' + landingChart(L.landings || []) + '</section>');
    html.push('<section class="card" aria-label="Sectors flown"><header><h2>Sectors</h2><span class="label">' + (L.log || []).length + ' flown</span></header><div class="hist-list">' + ((L.log || []).slice().reverse().map(x => '<div class="hl"><span class="r">' + h(x.ref) + '</span><span>' + h(x.from) + ' → ' + h(x.to) + (x.nickname ? ' <span class="muted">“' + h(x.nickname) + '”</span>' : '') + (x.events && x.events.length ? '<br><span class="muted" style="font-size:12px">' + h(x.events.join(' · ')) + '</span>' : '') + (x.note ? '<br><span class="muted" style="font-size:12px">' + h(x.note) + '</span>' : '') + '</span><span class="d">' + h([x.date, x.fpm != null ? x.fpm + ' fpm' : ''].filter(Boolean).join(' · ')) + '</span></div>').join('') || '<p class="muted">Nothing logged yet.</p>') + '</div></section>');
    return '<div class="ledger">' + html.join('') + '</div>';
  }
  function maintForm(i) {
    const v = App.ui.forms.maint || (App.ui.forms.maint = { action: '', status: 'CLOSED', stn: (App.state.aircraft || {}).at || '', sign: 'W.O.' });
    return '<div class="form-inline">' + area('maint', 'action', 'What was done', v.action, 'e.g. Lamp and connector replaced. Ops check good.') +
      '<div class="grid3"><label class="field"><span>New status</span><select class="input" data-form="maint" data-k="status">' + ['CLOSED', 'MONITOR', 'DEFERRED', 'OPEN'].map(x => '<option' + (v.status === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></label>' + field('maint', 'stn', 'Station', v.stn, 'ICAO') + field('maint', 'sign', 'Signed', v.sign, 'W.O.') + '</div>' +
      '<div class="row"><button class="btn primary small" data-act="save-maint" data-id="' + h(i.no) + '">Enter in the tech log</button><button class="btn small ghost" data-act="edit-cancel">Cancel</button></div></div>';
  }
  function threadForm(t) {
    const v = App.ui.forms.thread || (App.ui.forms.thread = { text: '', status: t.status });
    return '<div class="form-inline">' + area('thread', 'text', 'Where it stands now', v.text, '') + '<label class="field"><span>Status</span><select class="input" data-form="thread" data-k="status">' + ['OPEN', 'MONITOR', 'CLOSED'].map(x => '<option' + (v.status === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></label><div class="row"><button class="btn primary small" data-act="save-thread" data-id="' + h(t.ref) + '">Save</button><button class="btn small ghost" data-act="edit-cancel">Cancel</button></div></div>';
  }
  function aircraftForm(A) {
    const v = App.ui.forms.aircraft || (App.ui.forms.aircraft = { at: A.at || '', fobLb: String(A.fobLb || ''), hours: String(A.hours || ''), cycles: String(A.cycles || ''), lastInsp: A.lastInsp || '' });
    return '<div class="form-inline"><div class="grid3">' + field('aircraft', 'at', 'At (ICAO)', v.at) + field('aircraft', 'fobLb', 'Fuel on board (lb)', v.fobLb) + field('aircraft', 'hours', 'Airframe hours', v.hours) + field('aircraft', 'cycles', 'Cycles', v.cycles) + field('aircraft', 'lastInsp', 'Last inspection', v.lastInsp) + '</div><div class="row"><button class="btn primary small" data-act="save-aircraft">Save</button><button class="btn small ghost" data-act="edit-cancel">Cancel</button></div></div>';

  function newItemForm() {
    const v = App.ui.forms.newitem || (App.ui.forms.newitem = { defect: '', cat: 'AIRFRAME', status: 'OPEN', mel: '', due: '', limit: '' });
    return '<div class="form-inline">' + area('newitem', 'defect', 'Defect', v.defect, 'What is wrong, in one line') + '<div class="grid3"><label class="field"><span>Category</span><select class="input" data-form="newitem" data-k="cat">' + ['AIRFRAME', 'CABIN', 'GALLEY', 'ENGINE', 'AVIONICS'].map(x => '<option' + (v.cat === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></label><label class="field"><span>Status</span><select class="input" data-form="newitem" data-k="status">' + ['OPEN', 'MONITOR', 'DEFERRED'].map(x => '<option' + (v.status === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></label>' + field('newitem', 'mel', 'MEL ref', v.mel, '25-11') + field('newitem', 'due', 'Due', v.due, '18MAY27') + field('newitem', 'limit', 'Limitation', v.limit, 'Cold service only') + '</div><div class="row"><button class="btn primary small" data-act="save-newitem">Write it up</button><button class="btn small ghost" data-act="edit-cancel">Cancel</button></div></div>';
  }
  function landingChart(list) {
    const pts = list.filter(l => l.fpm != null).slice(0, 12).reverse();
    if (!pts.length) return '<p class="muted">No touchdown rates logged yet. They appear here after each debrief.</p>';
    const W = 560, H = 190, padL = 34, padB = 26, padT = 10, maxV = Math.max(700, ...pts.map(p => p.fpm));
    const bw = Math.min(36, (W - padL - 10) / pts.length - 8);
    const y = v => padT + (H - padT - padB) * (1 - v / maxV);
    const col = v => v >= 600 ? 'var(--warn)' : v >= 300 ? 'var(--caution)' : v >= 150 ? 'var(--ops)' : 'var(--ok)';
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Touchdown rates by sector">';
    [150, 300, 600].forEach(v => { svg += '<line x1="' + padL + '" x2="' + (W - 4) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-dasharray="3 4"/><text x="' + (padL - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v + '</text>'; });
    pts.forEach((p, i) => {
      const x = padL + 10 + i * ((W - padL - 14) / pts.length);
      svg += '<rect x="' + x + '" y="' + y(p.fpm) + '" width="' + bw + '" height="' + (H - padB - y(p.fpm)) + '" rx="2" fill="' + col(p.fpm) + '"/><text class="lbl" x="' + (x + bw / 2) + '" y="' + (y(p.fpm) - 4) + '" text-anchor="middle">' + p.fpm + '</text><text x="' + (x + bw / 2) + '" y="' + (H - 9) + '" text-anchor="middle">' + h(p.ref) + '</text>';
    });
    svg += '<line x1="' + padL + '" x2="' + (W - 4) + '" y1="' + (H - padB) + '" y2="' + (H - padB) + '" stroke="var(--line-2)"/></svg>';
    return '<div class="chart">' + svg + '</div><p class="note" style="margin-top:6px">Green smooth · blue normal · amber firm · red hard.</p>';
  }

  // ── Dispatch tab ──────────────────────
  function renderDispatch() {
    const L = App.state || emptyLedger();
    const s = App.sector;
    const d = App.draft;
    const g = App.ui.gen;
    const left = [], right = [];
    const active = s && s.brief && s.status !== 'flown' ? s : null;
    if (g) left.push(renderGen(g));
    else if (d) left.push(renderReview(d));
    else if (active) {
      left.push('<section class="card" aria-label="Current sector"><header><h2>' + h(active.ref) + ' is ' + (active.status === 'flying' ? 'in progress' : 'released') + '</h2><span class="label">' + h(active.brief.from.icao) + ' → ' + h(active.brief.to.icao) + '</span></header><p class="note">Close it before preparing the next sector. Fly it on the Flight tab, or log it here if you flew it without FEATHER NET.</p><div class="row" style="margin-top:12px"><button class="btn primary" data-act="tab" data-id="flight">Go to Flight</button><button class="btn" data-act="quick-log">Log as flown</button></div>' + (App.ui.quick ? quickLogForm(active) : '') + '</section>');
    } else {
      left.push(renderNextCard(L));
    }
    if (!d && !g) left.push(renderPasteCard());
    right.push(renderStoryDesk(L));
    right.push(renderChatCard(L));
    right.push(renderDataCard());
    return '<div class="dispatch"><div class="stack">' + left.join('') + '</div><aside class="stack">' + right.join('') + '</aside></div>';
  }

  function renderNextCard(L) {
    const nx = L.next;
    if (!nx || !nx.ref) return '<section class="card"><header><h2>Next sector</h2></header><p class="note">No next sector on file. Paste a brief JSON below to start the campaign.</p></section>';
    const stepsOk = AI.ok;
    return '<section class="card" aria-label="Next sector"><div class="next-head"><span class="label">Next sector</span><h2>' + h(nx.ref) + ' · ' + h(nx.from || '') + ' → ' + h(nx.to || '') + '</h2></div>' +
      '<p style="margin-top:6px">' + h(nx.names || '') + '</p><p class="note">' + h(nx.when || '') + '</p>' + (nx.summary ? '<p class="note" style="margin-top:6px">' + h(nx.summary) + '</p>' : '') +
      '<div class="hr"></div>' +
      '<label class="field"><span>Sector notes for Claude (optional)</span><textarea class="input" id="extra" placeholder="Paste the Rev 12 line for this sector, or anything the brief should know: a show time, a change you want, a set-piece">' + h(App.ui.extra || '') + '</textarea></label>' +
      '<div class="row" style="margin-top:12px">' + (stepsOk ? '<button class="btn primary" data-act="generate">Prepare ' + h(nx.ref) + ' with Claude</button>' : '') + '<span class="note">' + (stepsOk ? 'Writes the brief from the ledger, then briefs the crew. Takes a couple of minutes.' : (AI.state === 'pending' ? 'Checking Claude…' : 'Add your Claude API key in Settings (Ctrl+,) to write briefs here. Or make the brief in chat with the prompt on the right, then paste it below.')) + '</span></div></section>';
  }

  function renderGen(g) {
    const st = g.stage;
    const order = ['brief', 'companion', 'done'];
    const line = (id, label) => {
      let cls = '';
      if (st === 'error') cls = id === g.failedAt ? 'err' : (order.indexOf(id) < order.indexOf(g.failedAt || 'brief') ? 'done' : '');
      else cls = st === id ? 'run' : (order.indexOf(st) > order.indexOf(id) ? 'done' : '');
      return '<div class="stepline ' + cls + '"><i></i><span>' + label + '</span><span class="mono muted" id="gen-' + id + '">' + (st === id && g.chars ? fmt(g.chars) + ' chars' : '') + '</span></div>';
    };
    return '<section class="card" aria-label="Preparing"><header><h2>Preparing ' + h(g.ref || '') + '</h2><span class="label">Story desk</span></header><div class="steps">' + line('brief', 'Writing the brief from the ledger') + line('companion', 'Briefing the crew: day sheet, calls, anything sealed') + '</div>' +
      (st !== 'error' ? '<div class="teleprinter" id="gen-tail" style="margin-top:12px">' + h(g.tail || 'Waiting for Claude…') + '</div><div class="row" style="margin-top:12px"><button class="btn" data-act="gen-stop">Stop</button><span class="note">Claude thinks before it writes, so the first characters can take a minute.</span></div>' :
        '<div class="banner warn" style="margin-top:12px">' + h(g.error || 'Something went wrong.') + '</div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="generate">Try again</button><button class="btn" data-act="gen-cancel">Cancel</button></div>') + '</section>';
  }
  function updateGen() {
    const g = App.ui.gen; if (!g) return;
    const t = $('#gen-tail'); if (t) t.textContent = g.tail || '';
    const c = $('#gen-' + g.stage); if (c) c.textContent = g.chars ? fmt(g.chars) + ' chars' : '';
  }

  function renderReview(d) {
    const b = d.brief;
    const T = briefTimes(b);
    const fixes = d.fixes || [], notes = d.updateNotes || [];
    const comp = d.companion;
    return '<section class="card" aria-label="Review"><header><h2>' + h(d.ref) + ' is ready for release</h2><span class="label">' + (d.source === 'claude' ? 'Written by Claude' : 'Loaded from JSON') + '</span></header>' +
      '<div class="next-head"><h2>' + h(b.from.icao) + ' → ' + h(b.to.icao) + '</h2><span class="note">' + (T.off != null ? dowDate(T.off, T.fo) + ' · off ' + hhmm(T.off, T.fo) + ' ' + h(tzLabel(b.from)) + ' · rev ' + h(b.rev || 'A') : '') + (b.nickname ? ' · “' + h(b.nickname) + '”' : '') + '</span></div>' +
      (b.revNote ? '<div class="banner" style="margin-top:10px">' + h(b.revNote) + '</div>' : '') +
      (d.story && (d.story.opsReason || d.story.detail) ? '<div class="story" style="margin-top:12px">' + (d.story.opsReason ? '<p><span class="label">Operational reason</span>' + h(d.story.opsReason) + '</p>' : '') + (d.story.detail ? '<p><span class="label">Story detail</span>' + h(d.story.detail) + '</p>' : '') + '</div>' : '') +
      '<div class="hr"></div><span class="label">On the ground before this sector</span>' + (notes.length ? '<ul class="review-list" style="margin-top:6px">' + notes.map(n => '<li' + (n.warn ? ' class="warn"' : '') + '>' + h(n.t) + '</li>').join('') + '</ul>' : '<p class="note" style="margin-top:6px">No maintenance or thread changes.</p>') +
      '<div class="hr"></div><span class="label">Continuity checks</span>' + (fixes.length ? '<ul class="review-list" style="margin-top:6px">' + fixes.map(n => '<li' + (n.warn ? ' class="warn"' : '') + '>' + h(n.t) + '</li>').join('') + '</ul>' : '<p class="note" style="margin-top:6px">The brief already matched the ledger.</p>') +
      '<div class="hr"></div><span class="label">Crew</span><p class="note" style="margin-top:6px">' + (comp ? 'Day sheet with ' + comp.daySheet.rows.length + ' rows and ' + comp.beats.length + ' scripted calls are ready. Anything unplanned stays sealed until it happens.' : 'No crew briefing yet.' + (AI.ok ? ' Claude can write one, or use a basic script.' : ' A basic script will be used.')) + '</p>' +
      '<div class="row" style="margin-top:14px"><button class="btn primary" data-act="release">Release for flight</button><button class="btn" data-act="pdf-draft">Read the brief</button>' + (!comp && AI.ok ? '<button class="btn" data-act="brief-crew">Brief the crew with Claude</button>' : '') + (comp && AI.ok ? '<button class="btn ghost" data-act="brief-crew">Rewrite crew calls</button>' : '') + '<button class="btn ghost danger" data-act="discard">Discard</button></div></section>';
  }

    const b = s.brief; const T = briefTimes(b); const fp = fuelPlan(b);
    const v = App.ui.forms.quick || (App.ui.forms.quick = { offLocal: T.off != null ? hhmm(T.off, T.fo) : '', onLocal: T.on != null ? hhmm(T.on, T.too) : '', flightMin: String(T.airMin), fpm: '', fob: String(Math.max(0, fp.landing - 120)), snags: '', notes: '' });
    return '<div class="form-inline" style="margin-top:12px"><div class="grid4">' + field('quick', 'offLocal', 'Off blocks', v.offLocal, 'HH:MM') + field('quick', 'onLocal', 'On blocks', v.onLocal, 'HH:MM') + field('quick', 'flightMin', 'Flight time (min)', v.flightMin) + field('quick', 'fpm', 'Touchdown (fpm)', v.fpm, 'if you know it') + '</div>' + field('quick', 'fob', 'Fuel at shutdown (lb)', v.fob) + area('quick', 'snags', 'Anything to write up? One per line', v.snags, '') + area('quick', 'notes', 'Notes for the next brief', v.notes, '') + '<div class="row"><button class="btn primary small" data-act="quick-close">Close ' + h(b.ref) + '</button><button class="btn small ghost" data-act="quick-cancel">Cancel</button></div></div>';
  }

    return '<section class="card" aria-label="Load a brief"><header><h2>Load a brief JSON</h2><span class="label">From chat or the template</span></header>' +

      '<div class="row" style="margin-top:12px"><button class="btn" data-act="load-json">Check it against the ledger</button><span class="note">FEATHER NET fixes hours, cycles, open items and fuel, then shows you what changed.</span></div></section>';

    return '<section class="card" aria-label="Story desk"><header><h2>Story desk</h2><span class="label">Campaign</span></header><div class="stack" style="gap:12px">' +
      '<div class="field"><span>Complications</span>' + seg('surprises', [['off', 'Off'], ['rare', 'Rare'], ['normal', 'Normal'], ['often', 'Often']]) + '</div>' +
      '<label class="toggle"><input type="checkbox" data-act="setting-bool" data-k="principalFeatures"' + (st.principalFeatures !== false ? ' checked' : '') + '> Principal-specific moments on some sectors</label>' +
      '<div class="field"><span>Brief writer</span><div class="seg" role="group"><button data-act="tier" data-v="default" aria-pressed="' + (App.prefs.tier !== 'complex') + '">Standard</button><button data-act="tier" data-v="complex" aria-pressed="' + (App.prefs.tier === 'complex') + '">Best, slower</button></div></div>' +
      '<p class="note">Every sector gets one operational reason and one story detail. Most fly as planned. When something does happen, it’s sealed until it fires. Generating uses your Claude API credit.</p></div></section>';

  function renderChatCard(L) {
    return '<section class="card" aria-label="Generate in chat"><header><h2>Prefer chat?</h2></header><p class="note">Copy the v2 generator prompt with the live ledger and the next sector filled in. Paste Claude’s JSON back into Load a brief.</p><div class="row" style="margin-top:12px"><button class="btn" data-act="copy-chat">Copy prompt + ledger</button><button class="btn ghost" data-act="show-packet">Show ledger</button></div>' + (App.ui.showPacket ? '<pre class="packet" style="margin-top:12px">' + h(ledgerPacket(L)) + '</pre>' : '') + '</section>';
  }

  function renderDataCard() {
    return '<section class="card" aria-label="Campaign data"><header><h2>Campaign file</h2><span class="label">' + (Store.mode === 'db' ? 'Saved on this PC' : 'Saved in this window') + '</span></header><p class="note">' + (Store.mode === 'db' ? 'The ledger and every sector are saved on this PC (File › Open data folder). Export a copy to back it up or move it to another computer.' : 'Shared storage isn’t available here, so the campaign lives in this browser only. Export it to keep a copy.') + '</p>' +
      '<div class="row" style="margin-top:12px"><button class="btn small" data-act="export">Export</button><label class="btn small" for="import-file">Import</label><input type="file" id="import-file" accept=".json,application/json" hidden></div></section>';
  }

  // ════════════════════════════════════════════════════════════════
  // Events
  // ════════════════════════════════════════════════════════════════
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset && t.dataset.form) { const f = App.ui.forms[t.dataset.form] || (App.ui.forms[t.dataset.form] = {}); f[t.dataset.k] = t.value; return; }
    if (t.id === 'extra') App.ui.extra = t.value;
    else if (t.id === 'paste') App.ui.paste = t.value;
    else if (t.id === 'cmp-text') App.ui.composer.text = t.value;
    else if (t.id === 'clock-set-input') App.ui.clockSetVal = t.value;
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset && t.dataset.form) { const f = App.ui.forms[t.dataset.form] || (App.ui.forms[t.dataset.form] = {}); f[t.dataset.k] = t.value; return; }
    if (t.id === 'cmp-to') { App.ui.composer.to = t.value; render(); }
    else if (t.id === 'pdf-pick') pickPdf(t.value);
    else if (t.dataset.act === 'pref') { App.prefs[t.dataset.k] = t.checked; savePrefs(); if (!t.checked && t.dataset.k === 'voice') Voice.stop(); }
    else if (t.dataset.act === 'setting-bool') saveState(L => { L.settings = L.settings || {}; L.settings[t.dataset.k] = t.checked; });
    else if (t.id === 'import-file' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => { App.ui.modal = { kind: 'confirm', title: 'Replace the campaign?', text: 'Importing replaces the ledger and sectors on file with the ones in this file.', yes: 'Import', danger: true, run: () => importCampaign(String(r.result)) }; render(); }; r.readAsText(t.files[0]); t.value = ''; }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'cmp-text') { e.preventDefault(); sendChat(); }
    if (e.key === 'Enter' && e.target.id === 'td-fpm') { e.preventDefault(); submitTouchdown(e.target.value); }
    if (e.key === 'Escape' && App.ui.modal) { App.ui.modal = null; render(); }
  });

  async function pickPdf(ref) {
    if (!ref) return;
    const cur = App.sector || App.lastFlown;
    if (cur && cur.ref === ref) App.ui.pdfSector = null;
    else { const s = await Store.get('sectors/' + ref).catch(() => null); if (s) App.ui.pdfSector = s; }
    App.ui.pdfDraft = false; Frame.shown = null; render();
  }

  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (el.tagName === 'INPUT' && el.type === 'checkbox') return;
    switch (act) {
      case 'tab': App.prefs.tab = el.dataset.id; savePrefs(); if (el.dataset.id !== 'pdf') { App.ui.pdfDraft = false; App.ui.pdfSector = null; App.ui.pdfList = null; Frame.shown = null; } App.ui.modal = null; render(); window.scrollTo(0, 0); break;
      case 'start': startFlight(); break;
      case 'start-at': { const v = ($('#start-at') || {}).value; if (!/^\d{1,2}:\d{2}$/.test(v || '')) { toast('Enter the start time as HH:MM.'); break; } startFlight(v); break; }
      case 'confirm': confirmStep(el.dataset.id); break;
      case 'confirm-early': {
        const id = el.dataset.id;
        if (earlyArmed(id)) { confirmStep(id); break; }
        App.ui.early = { id, at: Date.now() };
        renderKey();
        setTimeout(() => { if (App.ui.early && App.ui.early.id === id && Date.now() - App.ui.early.at >= 4900) { App.ui.early = null; renderKey(); } }, 5000);
        break;
      }
      case 'undo': undoStep(); break;
      case 'delay': requestDelay(num(el.dataset.min)); break;
      case 'restart': { const s = App.sector; if (!s) break; App.ui.modal = { kind: 'confirm', title: 'Restart ' + s.ref + '?', text: 'The clock, the crew calls, any decisions and the touchdown are wiped, and the sector goes back to sim setup. The ledger isn’t touched.', yes: 'Restart ' + s.ref, danger: true, run: restartFlight }; render(); break; }
      case 'end-flight': endFlight(); break;
      case 'link-connect': Link.server = null; Link.connect(); break;
      case 'link-manage': { const p = Link.perms; if (p) { try { await p.manage(); } catch (err) { toast('Open Settings (Ctrl+,) and check the X-Plane address.'); } Link.server = null; Link.connect(); } else toast('Open Settings (Ctrl+,) and check the X-Plane address.'); break; }
      case 'sim-off': saveSector(x => { if (x.flight) x.flight.simOn = false; }); toast('Flying on FEATHER NET’s own clock. Confirm the crew’s calls yourself.'); break;
      case 'sim-on': saveSector(x => { if (x.flight) x.flight.simOn = true; }); break;
      case 'map-view': MapView.view = el.dataset.v; render(); break;
      case 'scroll-debrief': { const d = $('section[aria-label="Crew rating"]') || $('section[aria-label="Debrief"]'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
      case 'clock': clockCmd(el.dataset.cmd, el.dataset.arg); break;
      case 'clock-set': App.ui.clockSet = true; App.ui.clockSetVal = ''; render(); setTimeout(() => { const i = $('#clock-set-input'); if (i) i.focus(); }, 0); break;
      case 'clock-set-go': { const v = App.ui.clockSetVal || ''; if (!/^\d{1,2}:\d{2}$/.test(v)) { toast('Enter the sim time as HH:MM.'); break; } App.ui.clockSet = false; clockCmd('set', v); break; }
      case 'clock-set-cancel': App.ui.clockSet = false; render(); break;
      case 'choose': choose(el.dataset.ev, el.dataset.opt); break;
      case 'send': sendChat(); break;
      case 'td': submitTouchdown(($('#td-fpm') || {}).value); break;
      case 'td-quick': submitTouchdown(el.dataset.v); break;
      case 'td-skip': skipTouchdown(); break;
      case 'test-sound': Sound.ensure(); Sound.play('ICS'); setTimeout(() => Voice.say('Cabin to flight deck. Coffees on the way, Cap.', personById('CAB'), 'ICS'), 1100); break;
      case 'close-sector': closeSector(App.ui.forms.debrief || {}); break;
      case 'quick-log': App.ui.quick = true; render(); break;
      case 'quick-cancel': App.ui.quick = false; App.ui.forms.quick = null; render(); break;
      case 'quick-close': { const v = App.ui.forms.quick || {}; App.ui.quick = false; closeSector(v); App.ui.forms.quick = null; break; }
      case 'generate': generate(); break;
      case 'gen-stop': if (App.ui.gen && App.ui.gen.ctl) App.ui.gen.ctl.abort(); break;
      case 'gen-cancel': App.ui.gen = null; render(); break;
      case 'load-json': {
        const obj = parseLoose(App.ui.paste || '');
        if (!obj) { toast('Couldn’t find a JSON object. Paste the whole thing, starting with {'); break; }
        const d = await acceptBrief(obj, { source: 'paste', dice: null });
        if (d) { App.ui.paste = ''; render(); }
        break;
      }
      case 'brief-crew': {
        const d = App.draft; if (!d) break;
        const ctl = new AbortController();
        App.ui.gen = { stage: 'companion', chars: 0, tail: '', ctl, ref: d.ref };
        render();
        try { await writeCompanion(d, d.dice || rollDice(App.state || emptyLedger(), ''), ctl.signal); }
        catch (err) { toast(AI.err(err)); }
        App.ui.gen = null; render();
        break;
      }
      case 'release': release(); break;
      case 'release-anyway': App.ui.modal = null; App.ui.aogOk = true; release(); break;
      case 'discard': App.ui.modal = { kind: 'confirm', title: 'Discard ' + (App.draft ? App.draft.ref : 'this draft') + '?', text: 'The draft brief and crew calls are thrown away. The ledger isn’t touched.', yes: 'Discard', danger: true, run: async () => { App.draft = null; App.ui.pdfDraft = false; try { await Store.del('drafts/current'); } catch (err) { /* ignore */ } render(); } }; render(); break;
      case 'pdf-draft': App.ui.pdfDraft = true; App.ui.pdfSector = null; App.prefs.tab = 'pdf'; Frame.shown = null; render(); window.scrollTo(0, 0); break;
      case 'pdf-list': {
        const all = await Store.list('sectors').catch(() => []);
        App.ui.pdfList = all.filter(x => x && x.brief && x.brief.from).map(x => ({ ref: x.ref, route: x.brief.from.icao + '–' + x.brief.to.icao + (x.status === 'draft' ? ' (draft)' : '') })).sort((a, b) => num(String(b.ref).replace(/\D/g, '')) - num(String(a.ref).replace(/\D/g, '')));
        if (!App.ui.pdfList.length) toast('No earlier briefs on file.');
        render();
        break;
      }
      case 'dl-brief': downloadBrief(Frame.target()); break;
      case 'copy-json': { const s = Frame.target(); if (s && s.brief) copyText(JSON.stringify(s.brief, null, 2), s.ref + ' JSON'); break; }
      case 'copy-chat': copyText(chatPromptForCopy(), 'Prompt and ledger'); break;
      case 'show-packet': App.ui.showPacket = !App.ui.showPacket; render(); break;
      case 'export': exportCampaign(); break;
      case 'setting': saveState(L => { L.settings = L.settings || {}; L.settings[el.dataset.k] = el.dataset.v; }); break;
      case 'tier': App.prefs.tier = el.dataset.v; savePrefs(); render(); break;
      case 'edit': App.ui.edit = { kind: el.dataset.kind, id: el.dataset.id }; App.ui.forms.maint = null; App.ui.forms.thread = null; App.ui.forms.aircraft = null; App.ui.forms.newitem = null; render(); break;
      case 'edit-cancel': App.ui.edit = null; render(); break;
      case 'save-maint': {
        const v = App.ui.forms.maint || {}; if (!String(v.action || '').trim()) { toast('Say what was done. Nothing changes status without a maintenance action.'); break; }
        const L0 = App.state; const last = (L0.log || []).slice(-1)[0];
        const ref = (L0.active || (L0.next && L0.next.ref) || (last && last.ref) || 'LEDGER');
        const date = ddmmmyy(Date.now(), 0);
        saveState(L => { const r = applyUpdates(L, [{ type: 'maintenance', no: el.dataset.id, status: v.status || 'CLOSED', action: String(v.action).trim(), stn: v.stn, sign: v.sign || 'W.O.', date }], { ref: 'GND ' + ref, date, stn: v.stn, year: campaignYear() }); Object.assign(L, r.L); });
        App.ui.edit = null; App.ui.forms.maint = null; toast('Entered in the tech log.');
        break;
      }
      case 'save-thread': {
        const v = App.ui.forms.thread || {};
        saveState(L => { const r = applyUpdates(L, [{ type: 'thread', ref: el.dataset.id, status: v.status, text: String(v.text || '').trim() }], { ref: 'GND', date: '', stn: '', year: campaignYear() }); Object.assign(L, r.L); });
        App.ui.edit = null; App.ui.forms.thread = null;
        break;
      }
      case 'save-aircraft': {
        const v = App.ui.forms.aircraft || {};
        saveState(L => { const A = L.aircraft = L.aircraft || {}; if (v.at) A.at = upper(v.at); if (v.fobLb !== '') A.fobLb = Math.round(num(v.fobLb, A.fobLb)); if (v.hours !== '') A.hours = Math.round(num(v.hours, A.hours) * 10) / 10; if (v.cycles !== '') A.cycles = Math.round(num(v.cycles, A.cycles)); if (v.lastInsp != null) A.lastInsp = v.lastInsp; });
        App.ui.edit = null; App.ui.forms.aircraft = null; toast('Aircraft numbers saved.');
        break;
      }
      case 'save-newitem': {
        const v = App.ui.forms.newitem || {}; if (!String(v.defect || '').trim()) { toast('Describe the defect first.'); break; }
        const A = (App.state || {}).aircraft || {};
        saveState(L => { const r = applyUpdates(L, [{ type: 'new', cat: v.cat, defect: String(v.defect).trim(), status: v.status, mel: v.mel, due: v.due, limit: v.limit, stn: A.at, sign: 'H.F.', date: '' }], { ref: 'GND', date: '', stn: A.at, year: campaignYear() }); Object.assign(L, r.L); });
        App.ui.edit = null; App.ui.forms.newitem = null; toast('Written up.');
        break;
      }
      case 'req-done': saveState(L => { const r = (L.requests || []).find(x => x.id === el.dataset.id); if (r) { r.status = 'DONE'; r.closed = 'GND'; } }); break;
      case 'modal-close': App.ui.modal = null; render(); break;
      case 'modal-bg': if (e.target === el) { App.ui.modal = null; render(); } break;
      case 'confirm-yes': { const m = App.ui.modal; App.ui.modal = null; if (m && m.run) await m.run(); render(); break; }
      default: break;
    }
  });

  // ════════════════════════════════════════════════════════════════
  // Boot
  // ════════════════════════════════════════════════════════════════
  async function boot() {
    if (window.__FEATHER_TEST) window.__feather = { App, scan, timeline, stageOf, Link, MapView, groundPlan, whereIs };
    Voice.init();
    render();
    await Store.init();
    AI.init().then(() => render());
    Link.init();
    Store.get('drafts/current').then(d => { if (d && d.brief && !App.draft) { Writer.accept('drafts/current', d); App.draft = withCompanion(d); scheduleRender(); } }).catch(() => {});
    App.unsub.state = Store.watch('campaign/state', data => {
      if (!Writer.accept('campaign/state', data)) return;
      App.state = data && data.aircraft ? data : null;
      App.stateLoaded = true;
      if (App.draft && App.state && (App.state.log || []).some(x => x.ref === App.draft.ref)) { App.draft = null; Store.del('drafts/current').catch(() => {}); }
      watchSector(App.state && App.state.active ? App.state.active : null);
      if (!App.state || !App.state.active) {
        // keep showing the last flown sector until the next one is released
        const last = App.state && (App.state.log || []).slice(-1)[0];
        if (last && !App.lastFlown) Store.get('sectors/' + last.ref).then(s => { if (s) { App.lastFlown = s; } }).catch(() => {});
      }
      scheduleRender();
    }, () => { App.stateLoaded = true; toast('Couldn’t reach the campaign store. Working from this browser.'); render(); });
    if (!App.state && App.prefs.tab === 'flight') { /* first frame decides */ }
  }
  boot();
})();

</script>
