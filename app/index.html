  const STATUS_ORDER = ['hotel', 'mobile', 'planeside', 'aboard', 'airborne', 'landed', 'hotel-arr', 'mobile-venue', 'venue'];
  const CH_NAME = { NET: 'Security net', ICS: 'Interphone', OPS: 'Datalink', DECK: 'Flight deck', SYS: 'FEATHER NET' };
  const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

  // ════════════════════════════════════════════════════════════════
  // Small helpers
  // ════════════════════════════════════════════════════════════════
  const $ = (s, el = document) => el.querySelector(s);
  const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
  const pad = n => String(n).padStart(2, '0');
  const num = (v, d = 0) => { const n = Number(String(v == null ? '' : v).replace(/,/g, '').trim()); return v === '' || v == null || !isFinite(n) ? d : n; };
  const fmt = n => Math.round(Number(n) || 0).toLocaleString('en-US');
  const fmtHours = n => (Math.round((Number(n) || 0) * 10) / 10).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const squash = s => norm(s).replace(/[^a-z0-9]/g, '');
  const ceil10 = n => Math.ceil(n / 10) * 10;
  const upper = s => String(s || '').toUpperCase().trim();
  function parseZ(v) { if (!v) return null; const t = Date.parse(String(v).trim()); return isNaN(t) ? null : t; }
  function hhmm(t, off) { const d = new Date(t + (off || 0) * 3600000); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); }
  function zulu(t) { const d = new Date(t); return pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + 'Z'; }
  function ddmmmyy(t, off) { const d = new Date(t + (off || 0) * 3600000); return pad(d.getUTCDate()) + MON[d.getUTCMonth()] + String(d.getUTCFullYear()).slice(2); }
  function dowDate(t, off) { const d = new Date(t + (off || 0) * 3600000); return DOW[d.getUTCDay()] + ' ' + pad(d.getUTCDate()) + ' ' + MON[d.getUTCMonth()]; }
  function localMidnight(t, off) { const d = new Date(t + off * 3600000); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - off * 3600000; }
  function hm(min) { min = Math.max(0, Math.round(min)); return Math.floor(min / 60) + ':' + pad(min % 60); }
  function untilText(ms) { const m = Math.round(ms / 60000); if (m === 0) return 'now'; return m > 0 ? 'in ' + hm(m) : hm(-m) + ' ago'; }
  function tzLabel(a) { const o = num(a && a.utcOffset); return (a && a.tz ? a.tz : 'UTC' + (o < 0 ? '−' : '+') + Math.abs(o)); }
  function shortTitle(s) { const t = String(s || '').replace(/\.$/, ''); const m = t.split(/[,.;:]| during | on | at /)[0]; return m.length > 54 ? m.slice(0, 52) + '…' : m; }
  function normStatus(s) { const u = upper(s); return ['OPEN', 'MONITOR', 'DEFERRED', 'CLOSED'].includes(u) ? u : ''; }
  function yy(t) { return t != null ? String(new Date(t).getUTCFullYear()).slice(2) : '27'; }
  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  function person(from) {
    const f = norm(from);
    if (!f) return null;
    return PEOPLE.find(p => norm(p.call) === f || norm(p.first) === f || norm(p.name) === f || norm(p.id) === f || f.startsWith(norm(p.first) + ' ') || f === norm(p.name.split(' ')[0])) || null;
  }
  function personById(id) { return PEOPLE.find(p => p.id === String(id)) || null; }
  function isPrincipalLine(from) { const f = norm(from); return f === 'espresso' || f.includes('principal') || f.includes('sabrina'); }

  // ════════════════════════════════════════════════════════════════
  // Brief maths (mirrors the brief template)
  // ════════════════════════════════════════════════════════════════
  function briefTimes(b) {
    const fl = (b && b.flight) || {}, from = (b && b.from) || {}, to = (b && b.to) || {};
    const off = parseZ(fl.offBlocksZ), on = parseZ(fl.onBlocksZ);
    const fo = num(from.utcOffset), too = num(to.utcOffset);
    const blockMin = off != null && on != null ? Math.round((on - off) / 60000) : num(fl.blockMin);
    const airMin = num(fl.airborneMin) || Math.max(0, blockMin - 25);
    let clockT = null;
    if (off != null) {
      const sim = (b && b.sim) || {};
      if (sim.clockLocal) {
        const p = String(sim.clockLocal).split(':').map(Number);
        const d = new Date(off + fo * 3600000);
        clockT = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), p[0] || 0, p[1] || 0) - fo * 3600000;
        if (clockT > off) clockT -= 86400000;
      } else clockT = off - 45 * 60000;
    }
    return { off, on: on != null ? on : (off != null ? off + blockMin * 60000 : null), fo, too, blockMin, airMin, clockT };
  }
  function fuelPlan(b) {
    const from = b.from || {}, to = b.to || {}, alt = b.alternate || {}, fu = b.fuel || {};
    const T = briefTimes(b);
    const intl = b.international != null ? !!b.international : String(from.icao || '').charAt(0) !== String(to.icao || '').charAt(0);
    const taxi = num(fu.taxiLb) || (intl ? STD.taxiIntl : STD.taxiDom);
    const trip = num(fu.tripLb) || ceil10(T.airMin / 60 * STD.burn);
    const cont = Math.max(ceil10(trip * STD.contPct), STD.contFloor);
    const altF = num(alt.fuelLb) || (alt.timeMin ? ceil10(num(alt.timeMin) / 60 * STD.burn) : 0);
    const fin = num(fu.finalReserveLb) || STD.finalReserve;
    const extra = num(fu.extraLb);
    const ramp = taxi + trip + cont + altF + fin + extra;
    return { taxi, trip, cont, altF, fin, extra, ramp, intl, landing: ramp - taxi - trip };
  }
  const aboardList = b => (Array.isArray(b && b.pax) ? b.pax.map(Number) : [1, 2, 3, 4, 5, 6, 7, 8, 9]);
  const principalAboard = b => aboardList(b).includes(1);

  // ════════════════════════════════════════════════════════════════
  // Storage: the app's files on this PC (host-shim.js), this window's storage otherwise
  // ════════════════════════════════════════════════════════════════
  const Store = {
    mode: 'pending', db: null, listeners: new Map(), mem: new Map(),
    async init() {
      let db = null;
      try { db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null; } catch (e) { db = null; }
      this.db = db;
      this.mode = db ? 'db' : 'local';
    },
    lsGet(path) { try { const raw = localStorage.getItem('feathernet:' + path); return raw ? JSON.parse(raw) : null; } catch (e) { return this.mem.has(path) ? clone(this.mem.get(path)) : null; } },
    lsSet(path, data) { this.mem.set(path, clone(data)); try { localStorage.setItem('feathernet:' + path, JSON.stringify(data)); } catch (e) { /* memory only */ } },
    watch(path, cb, onErr) {
      if (this.mode === 'db') {
        return this.db.doc(path).onSnapshot(snap => cb(snap.exists ? snap.data() : null), e => onErr && onErr(e));
      }
      const set = this.listeners.get(path) || new Set();
      set.add(cb); this.listeners.set(path, set);
      setTimeout(() => cb(this.lsGet(path)), 0);
      return () => set.delete(cb);
    },
    async get(path) {
      if (this.mode === 'db') { const s = await this.db.doc(path).get(); return s.exists ? clone(s.data()) : null; }
      return this.lsGet(path);
    },
    async set(path, data) {
      if (this.mode === 'db') { await this.db.doc(path).set(data); return; }
      this.lsSet(path, data);
      const set = this.listeners.get(path);
      if (set) set.forEach(cb => { try { cb(clone(data)); } catch (e) { console.error(e); } });
    },
    async del(path) {
      if (this.mode === 'db') { await this.db.doc(path).delete(); return; }
      this.mem.delete(path);
      try { localStorage.removeItem('feathernet:' + path); } catch (e) { /* ignore */ }
    },
    async list(col) {
      if (this.mode === 'db') { const q = await this.db.collection(col).get(); return q.docs.map(d => Object.assign({ _id: d.id }, clone(d.data()))); }
      const out = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith('feathernet:' + col + '/')) { const v = JSON.parse(localStorage.getItem(k)); out.push(Object.assign({ _id: k.split('/').pop() }, v)); }
        }
      } catch (e) {
        this.mem.forEach((v, k) => { if (k.startsWith(col + '/')) out.push(Object.assign({ _id: k.split('/').pop() }, clone(v))); });
      }
      return out;
    }
  };

  // One write at a time per document, newest data wins.
  const Writer = {
    pending: new Map(), busy: new Set(), revs: new Map(),
    put(path, data) {
      const rev = (this.revs.get(path) || 0) + 1;
      this.revs.set(path, rev);
      const body = Object.assign({}, data, { _rev: rev, _by: DEVICE, _at: Date.now() });
      this.pending.set(path, body);
      this.flush(path);
      return body;
    },
    async flush(path) {
      if (this.busy.has(path) || !this.pending.has(path)) return;
      const body = this.pending.get(path);
      this.pending.delete(path);
      this.busy.add(path);
      try { await Store.set(path, body); }
      catch (e) {
        console.error('write failed', path, e);
        if (e && e.code === 'unavailable') { await wait(600 + Math.random() * 600); if (!this.pending.has(path)) this.pending.set(path, body); }
        else toast(e && e.code === 'invalid_argument' ? 'This copy is read-only, so changes are not being saved.' : 'Could not save just now (' + ((e && e.code) || 'error') + ').');
      }
      finally { this.busy.delete(path); if (this.pending.has(path)) this.flush(path); }
    },
    accept(path, snap) {
      if (!snap) return true;
      const mine = this.revs.get(path) || 0;
      if (snap._by === DEVICE && num(snap._rev) < mine) return false;
      if (num(snap._rev) > mine) this.revs.set(path, num(snap._rev));
      return true;
    }
  };

  // ════════════════════════════════════════════════════════════════
  // Ledger
  // ════════════════════════════════════════════════════════════════
  function emptyLedger() {
    return {
      v: 1,
      aircraft: { reg: STD.reg, type: STD.type, msn: STD.msn, at: '', atName: '', parked: '', fobLb: 0, hours: 0, cycles: 0, lastInsp: '', nextDue: 'PHASE 3 @ 5,000 HRS', nextDueHours: 5000 },
      seq: { tl: 0, ops: 0 },
      items: [], threads: [], requests: [], landings: [], log: [],
      active: null, next: null,
      dice: { routineStreak: 0, lastComplicationRef: null },
      settings: { surprises: 'normal', principalFeatures: true }
    };
  }
  const openItems = L => (L.items || []).filter(i => i.status !== 'CLOSED');
  const openThreads = L => (L.threads || []).filter(t => t.status !== 'CLOSED');
  const openRequests = L => (L.requests || []).filter(r => r.status !== 'DONE');
  function seqFromNo(no) { const m = String(no || '').match(/(\d+)\s*$/); return m ? Number(m[1]) : 0; }
  function nextTlNo(L, year) { return year + '-' + String((num(L.seq && L.seq.tl) || 0) + 1).padStart(3, '0'); }
  function nextOpsRef(L, year) { return 'OPS ' + year + '-' + String((num(L.seq && L.seq.ops) || 0) + 1).padStart(3, '0'); }
  function bumpSeq(L, kind, no) { L.seq = L.seq || { tl: 0, ops: 0 }; L.seq[kind] = Math.max(num(L.seq[kind]), seqFromNo(no)); }

  function ledgerPacket(L, opts = {}) {
    const A = L.aircraft || {};
    const year = opts.year || '27';
    const lines = [];
    lines.push('CONTINUITY LEDGER · FEATHER NET');
    lines.push('  AIRCRAFT   ' + [A.reg || STD.reg, A.at ? 'at ' + A.at + (A.parked ? ' (' + A.parked + ')' : '') : 'location not set', 'FOB ' + fmt(A.fobLb) + ' lb', fmtHours(A.hours) + ' airframe hours', fmt(A.cycles) + ' cycles', 'MSN ' + (A.msn || STD.msn)].join(' · '));
    lines.push('  LAST INSP  ' + (A.lastInsp || '—') + ' · NEXT DUE ' + (A.nextDue || '—') + (A.nextDueHours ? ' (' + fmtHours(A.nextDueHours - num(A.hours)) + ' hrs to go)' : ''));
    lines.push('  NEXT TL NO ' + nextTlNo(L, year) + ' · NEXT OPS NO ' + nextOpsRef(L, year));
    const oi = openItems(L);
    lines.push('  TECH LOG, NOT CLOSED' + (oi.length ? '' : '  (none)'));
    oi.forEach(i => lines.push('    ' + i.no + ' ' + i.status + (i.aog ? ' AOG' : '') + (i.mel ? ' · MEL ' + i.mel + (i.melCat ? ' ' + i.melCat : '') : '') + (i.due ? ' · due ' + i.due : '') + ' · ' + (i.cat || '') + ' · ' + i.defect + (i.limit ? ' Limit: ' + i.limit : '') + (i.action ? ' Last action: ' + i.action : '')));
    const ot = openThreads(L);
    lines.push('  OPS THREADS' + (ot.length ? '' : '  (none)'));
    ot.forEach(t => lines.push('    ' + t.ref + ' ' + t.status + (t.owner ? ' · ' + t.owner : '') + ' · ' + (t.title ? t.title + '. ' : '') + t.text));
    const orq = openRequests(L);
    lines.push('  CREW REQUESTS' + (orq.length ? '' : '  (none)'));
    orq.forEach(r => lines.push('    ' + (r.from || 'Crew') + ': ' + r.text + (r.opened ? ' (since ' + r.opened + ')' : '')));
    const rc = (L.items || []).filter(i => i.status === 'CLOSED' && i.closed).slice(-4);
    if (rc.length) { lines.push('  RECENTLY CLOSED'); rc.forEach(i => lines.push('    ' + i.no + ' closed ' + i.closed + ' · ' + (i.title || i.defect) + '. ' + (i.action || ''))); }
    const ld = (L.landings || []).slice(0, 6);
    if (ld.length) lines.push('  LANDINGS   ' + ld.map(l => l.ref + ' ' + l.icao + ' ' + (l.fpm != null ? l.fpm + ' fpm' : 'not recorded') + (l.note ? ' (' + l.note + ')' : '')).join(' · '));
    return lines.join('\n');
  }

  function lastLogText(L, sector) {
    if (!sector || !sector.debrief) {
      const last = (L.log || []).slice(-1)[0];
      return last ? 'LAST SECTOR LOG\n  ' + last.ref + ' ' + last.from + ' → ' + last.to + ' · flown' + (last.note ? ' · ' + last.note : '') + (last.rating != null ? ' · crew rating ' + last.rating + ' of 5' : '') : 'LAST SECTOR LOG\n  (first sector in FEATHER NET)';
    }
    const b = sector.brief, d = sector.debrief, f = sector.flight || {};
    const T = briefTimes(b);
    const out = ['LAST SECTOR LOG'];
    out.push('  ' + b.ref + ' ' + b.from.icao + ' → ' + b.to.icao + ' · ' + (b.nickname || '') + ' · flown ' + (T.off != null ? dowDate(T.off, T.fo) : ''));
    out.push('  Planned off/on blocks ' + (T.off != null ? hhmm(T.off, T.fo) : '?') + ' / ' + (T.on != null ? hhmm(T.on, T.too) : '?') + ' local. Actual ' + (d.offLocal || '?') + ' / ' + (d.onLocal || '?') + ' local. Flight time ' + hm(d.flightMin || T.airMin) + '.');
    out.push('  Touchdown ' + (d.fpm != null ? d.fpm + ' fpm (' + band(d.fpm) + ')' : 'not recorded') + '. Fuel at shutdown ' + fmt(d.fobLb) + ' lb.');
    const decs = Object.values(f.decisions || {});
    if (decs.length) out.push('  Decisions: ' + decs.map(x => x.title + ': ' + x.label + '. ' + (x.outcome || '')).join(' | '));
    const checks = (f.feed || []).filter(e => e.kind === 'check');
    if (checks.length) out.push('  Results: ' + checks.map(c => c.text).join(' | '));
    const dl = d.delays || [];
    if (dl.length) out.push('  Delays: ' + dl.map(x => (x.min > 0 ? '+' : '') + x.min + ' min ' + (x.by === 'event' ? '(' + (x.why || 'the party') + ')' : '(asked for by the captain)')).join(', ') + '.');
    const r = f.rating;
    if (r) out.push('  Crew rating ' + r.overall.toFixed(1) + ' of 5: ' + r.raters.map(x => x.name + ' ' + x.stars).join(', ') + '.' + (r.lines && r.lines.espresso ? ' ' + r.via + ', for ESPRESSO: ' + r.lines.espresso : '') + (r.lines && r.lines.neil ? ' Neil: ' + r.lines.neil : ''));
    if (d.snags && d.snags.length) out.push('  Written up after the flight: ' + d.snags.join(' | '));
    if (d.notes) out.push('  Captain’s notes: ' + d.notes);
    if (sector.story) out.push('  That sector’s story: ' + [sector.story.opsReason, sector.story.detail].filter(Boolean).join(' '));
    return out.join('\n');
  }

  function applyUpdates(L0, ups, ctx) {
    const L = clone(L0);
    const notes = [], renumber = {};
    L.items = L.items || []; L.threads = L.threads || []; L.requests = L.requests || [];
    (Array.isArray(ups) ? ups : []).forEach(u => {
      if (!u || typeof u !== 'object') return;
      const type = norm(u.type);
      if (type === 'maintenance') {
        const it = L.items.find(i => i.no === String(u.no).replace(/^TL\s*/i, ''));
        if (!it) { notes.push({ t: 'Maintenance entry for ' + u.no + ' ignored: no such item.', warn: true }); return; }
        if (!u.action) { notes.push({ t: 'Status change on ' + it.no + ' ignored: no maintenance action was given.', warn: true }); return; }
        const st = normStatus(u.status) || it.status;
        it.history = it.history || [];
        it.history.push({ ref: ctx.ref, date: u.date || ctx.date, status: st, text: String(u.action), stn: u.stn || ctx.stn, sign: u.sign || 'W.O.' });
        it.status = st; it.action = String(u.action); it.sign = u.sign || it.sign || 'W.O.';
        ['mel', 'due', 'limit'].forEach(k => { if (u[k] != null && u[k] !== '') it[k] = String(u[k]); });
        if (st === 'CLOSED') { it.closed = ctx.ref; it.aog = false; }
        notes.push({ t: 'TL ' + it.no + ' ' + (it.title || shortTitle(it.defect)) + ' → ' + st + '. ' + u.action });
      } else if (type === 'new') {
        let no = String(u.no || '').replace(/^TL\s*/i, '');
        if (!no || L.items.some(i => i.no === no)) { const n2 = nextTlNo(L, ctx.year); if (no) renumber[no] = n2; no = n2; }
        bumpSeq(L, 'tl', no);
        const st = normStatus(u.status) || 'OPEN';
        L.items.push({ no, cat: upper(u.cat) || 'AIRFRAME', title: shortTitle(u.defect), defect: String(u.defect || ''), date: u.date || ctx.date, stn: u.stn || ctx.stn, status: st, mel: String(u.mel || ''), due: String(u.due || ''), limit: String(u.limit || ''), action: String(u.action || ''), sign: u.sign || 'W.O.', opened: ctx.ref, history: [{ ref: ctx.ref, date: u.date || ctx.date, status: st, text: String(u.action || 'Written up.'), stn: u.stn || ctx.stn, sign: u.sign || 'W.O.' }] });
        notes.push({ t: 'New TL ' + no + ' ' + shortTitle(u.defect) + ' (' + st + ').' });
      } else if (type === 'thread') {
        const ref = String(u.ref || '').trim();
        if (!ref || norm(ref) === 'new') {
          const r = nextOpsRef(L, ctx.year); bumpSeq(L, 'ops', r);
          L.threads.push({ ref: r, kind: 'OPS', title: String(u.title || ''), text: String(u.text || ''), owner: String(u.owner || ''), status: normStatus(u.status) || 'OPEN', opened: ctx.ref, history: [{ ref: ctx.ref, status: normStatus(u.status) || 'OPEN', text: String(u.text || '') }] });
          notes.push({ t: 'New thread ' + r + ' ' + (u.title || shortTitle(u.text)) + '.' });
        } else {
          const t = L.threads.find(x => squash(x.ref) === squash(ref));
          if (!t) {
            const r = /^ops/i.test(ref) ? ref : nextOpsRef(L, ctx.year); bumpSeq(L, 'ops', r);
            L.threads.push({ ref: r, kind: 'OPS', title: String(u.title || ''), text: String(u.text || ''), owner: String(u.owner || ''), status: normStatus(u.status) || 'OPEN', opened: ctx.ref, history: [] });
            notes.push({ t: 'Thread ' + r + ' opened.' });
            return;
          }
          const st = normStatus(u.status) || t.status;
          t.history = t.history || [];
          t.history.push({ ref: ctx.ref, status: st, text: String(u.text || '') });
          if (u.text) t.text = String(u.text);
          if (u.owner) t.owner = String(u.owner);
          t.status = st;
          if (st === 'CLOSED') t.closed = ctx.ref;
          notes.push({ t: t.ref + ' → ' + st + (u.text ? '. ' + u.text : '') });
        }
      } else if (type === 'request') {
        const st = upper(u.status) === 'DONE' ? 'DONE' : 'OPEN';
        const text = String(u.text || '');
        const match = L.requests.find(r => r.status !== 'DONE' && (squash(r.text) === squash(text) || squash(r.text).includes(squash(text).slice(0, 24)) || squash(text).includes(squash(r.text).slice(0, 24))));
        if (st === 'DONE') {
          if (match) { match.status = 'DONE'; match.closed = ctx.ref; notes.push({ t: 'Request done: ' + match.text }); }
        } else if (!match && text) {
          L.requests.push({ id: 'R' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), from: String(u.from || ''), text, status: 'OPEN', opened: ctx.ref });
          notes.push({ t: 'New request from ' + (u.from || 'the party') + ': ' + text });
        }
      }
    });
    return { L, notes, renumber };
  }

  // A brand-new ledger adopts the first brief's numbers, open items and threads.
  function bootstrapFromBrief(L, b) {
    const A = L.aircraft = L.aircraft || {};
    const tl = b.techLog || {};
    if (!num(A.hours) && tl.hours) A.hours = num(tl.hours);
    if (!num(A.cycles) && tl.cycles) A.cycles = num(tl.cycles);
    if (tl.msn) A.msn = String(tl.msn);
    if (tl.nextDue) { A.nextDue = String(tl.nextDue); const m = String(tl.nextDue).match(/([\d,]+)\s*HRS/i); if (m) A.nextDueHours = num(m[1]); }
    if (!(L.items || []).length) {
      L.items = (Array.isArray(tl.entries) ? tl.entries : []).filter(e => e && e.no).map(e => {
        const st = normStatus(e.status) || 'OPEN';
        const def = (tl.deferred || []).find(d => String(d.ref).replace(/^TL\s*/i, '') === String(e.no));
        return { no: String(e.no), cat: /oven|galley|coffee|espresso|lav|seat|light|cabin|panel/i.test(e.defect || '') ? 'CABIN' : 'AIRFRAME', title: def && def.item ? def.item : shortTitle(e.defect), defect: String(e.defect || ''), date: e.date || '', stn: e.stn || '', status: st, mel: e.mel && e.mel !== '—' ? String(e.mel) : '', due: def ? String(def.due || '') : '', limit: '', action: String(e.action || ''), sign: e.sign || 'W.O.', opened: 'before', closed: st === 'CLOSED' ? 'before' : undefined, history: [] };
      });
      L.items.forEach(i => bumpSeq(L, 'tl', i.no));
    }
    if (!(L.threads || []).length) {
      L.threads = ((b.sinceLast && b.sinceLast.carried) || []).filter(c => /^OPS/i.test(String(c.ref || ''))).map(c => ({ ref: String(c.ref), kind: 'OPS', title: '', text: String(c.text || ''), owner: '', status: normStatus(c.status) || 'OPEN', opened: 'before', history: [] }));
      L.threads.forEach(t => bumpSeq(L, 'ops', t.ref));
    }
  }

  function enforceContinuity(brief, L, ctx) {
    const b = clone(brief);
    const fixes = [];
    const A = L.aircraft || {};
    b.techLog = b.techLog || {};
    const want = { hours: fmtHours(A.hours), cycles: fmt(A.cycles), msn: A.msn || STD.msn };
    if (num(A.hours) > 0) {
      if (String(b.techLog.hours) !== want.hours) fixes.push({ t: 'Airframe hours set from the ledger: ' + want.hours + '.' });
      b.techLog.hours = want.hours;
    }
    if (num(A.cycles) > 0) {
      if (String(b.techLog.cycles) !== want.cycles) fixes.push({ t: 'Cycles set from the ledger: ' + want.cycles + '.' });
      b.techLog.cycles = want.cycles;
    }
    b.techLog.msn = want.msn;
    if (A.nextDue) b.techLog.nextDue = A.nextDue;
    // renumbered items
    const entries = Array.isArray(b.techLog.entries) ? b.techLog.entries : [];
    Object.keys(ctx.renumber || {}).forEach(oldNo => entries.forEach(e => { if (String(e.no) === oldNo) e.no = ctx.renumber[oldNo]; }));
    (L.items || []).filter(i => i.status !== 'CLOSED' || i.closed === ctx.ref).forEach(it => {
      const e = entries.find(x => String(x.no).replace(/^TL\s*/i, '') === it.no);
      if (!e) {
        entries.push({ no: it.no, date: it.date || '', stn: it.stn || '', defect: it.defect, action: it.action || '', mel: it.mel || '—', status: it.status, sign: it.sign || 'W.O.' });
        fixes.push({ t: 'TL ' + it.no + ' ' + (it.title || shortTitle(it.defect)) + ' added to the tech log. It was missing from the brief.' });
      } else if (upper(e.status) !== it.status) {
        fixes.push({ t: 'TL ' + it.no + ' shown as ' + it.status + ' to match the ledger (the brief had ' + (upper(e.status) || 'no status') + ').' });
        e.status = it.status;
        if (it.action) e.action = it.action;
      }
    });
    b.techLog.entries = entries;
    let def = Array.isArray(b.techLog.deferred) ? b.techLog.deferred : [];
    def = def.filter(d => { const it = (L.items || []).find(i => i.no === String(d.ref).replace(/^TL\s*/i, '')); return !it || it.status === 'DEFERRED'; });
    (L.items || []).filter(i => i.status === 'DEFERRED').forEach(it => {
      if (!def.some(d => String(d.ref).replace(/^TL\s*/i, '') === it.no)) {
        def.push({ ref: it.no, item: it.title || shortTitle(it.defect), mel: it.mel ? 'MEL ' + it.mel + (it.melCat ? ' · ' + it.melCat : '') : '', due: it.due || '' });
        fixes.push({ t: 'TL ' + it.no + ' added to the deferred items list.' });
      }
    });
    b.techLog.deferred = def;
    b.sinceLast = b.sinceLast || {};
    const car = Array.isArray(b.sinceLast.carried) ? b.sinceLast.carried : [];
    openItems(L).forEach(it => {
      const ref = 'TL ' + it.no;
      const c = car.find(x => squash(x.ref) === squash(ref));
      if (!c) { car.push({ status: it.status, ref, text: (it.title ? it.title + '. ' : '') + it.defect + (it.limit ? ' ' + it.limit : '') + (it.due ? ' Due ' + it.due + '.' : '') }); fixes.push({ t: ref + ' added to Since last sector. Open items have to be carried.' }); }
      else if (upper(c.status) !== it.status) c.status = it.status;
    });
    openThreads(L).forEach(t => {
      if (!car.some(x => squash(x.ref) === squash(t.ref))) { car.push({ status: t.status, ref: t.ref, text: t.text }); fixes.push({ t: t.ref + ' added to Since last sector.' }); }
    });
    b.sinceLast.carried = car;
    if (A.at && b.from && b.from.icao && b.from.icao !== A.at) fixes.push({ t: 'This brief departs ' + b.from.icao + ' but the ledger has N511GW at ' + A.at + '.', warn: true });
    const fp = fuelPlan(b);
    const fob = Math.max(0, Math.round(num(A.fobLb)));
    if (fob > 0) {
      if (fob >= fp.ramp) {
        const add = fob - fp.ramp;
        b.fuel = b.fuel || {};
        if (add > 0) { b.fuel.extraLb = num(b.fuel.extraLb) + add; b.fuel.extraWhy = [b.fuel.extraWhy, 'Carried from ' + (ctx.prevRef || 'the last sector')].filter(Boolean).join(' · '); }
        delete b.fuelSlip;
        b.techLog.notes = (Array.isArray(b.techLog.notes) ? b.techLog.notes : []).concat(['No fuel uplift at ' + (b.from && b.from.icao) + '. ' + fmt(fob) + ' lb on board covers the ramp figure.']);
        fixes.push({ t: 'No uplift needed: ' + fmt(fob) + ' lb on board covers the ' + fmt(fp.ramp) + ' lb ramp figure, so the fuel slip is removed and the surplus shows as extra.' });
      } else {
        const up = fp.ramp - fob;
        const fs = b.fuelSlip || { vendor: upper((b.from && b.from.parking) || 'FBO'), station: upper((b.from && b.from.name) || ''), ticket: (b.from && b.from.iata ? b.from.iata : 'FBO') + '-' + Math.floor(10000 + Math.random() * 89999), date: '', product: 'JET A + PRIST', truck: 'T-' + pad(1 + Math.floor(Math.random() * 14)), price: 'ON ACCOUNT · CPA', sign: 'P. Raghunathan' };
        const dens = num(fs.density, STD.density) || STD.density;
        const usg = Math.round(up / dens);
        const ms = num(fs.meterStart, 100000 + Math.floor(Math.random() * 800000));
        Object.assign(fs, { usg, density: dens, meterStart: fmt(ms), meterEnd: fmt(ms + usg) });
        b.fuelSlip = fs;
        fixes.push({ t: 'Fuel slip set to ' + fmt(usg) + ' USG: ' + fmt(fob) + ' lb on board up to the ' + fmt(fp.ramp) + ' lb ramp figure.' });
      }
    }
    return { brief: b, fixes };
  }

  // ════════════════════════════════════════════════════════════════
  // Story desk dice. Kept in the page so Claude doesn't decide how often things go wrong.
  // ════════════════════════════════════════════════════════════════
  function rollDice(L, hint) {
    const s = L.settings || {};
    const base = { off: 0, rare: 0.12, normal: 0.24, often: 0.4 }[s.surprises || 'normal'];
    const d = L.dice || {};
    const last = (L.log || []).slice(-1)[0];
    const justHadOne = d.lastComplicationRef && last && d.lastComplicationRef === last.ref;
    const p = justHadOne ? 0 : Math.min(base + num(d.routineStreak) * 0.05, base * 2.2);
    let complication = 'none', visibility = 'none';
    if (Math.random() < p) {
      complication = Math.random() < 0.7 ? 'minor' : 'major';
      visibility = Math.random() < 0.6 ? 'sealed' : 'public';
    }
    const positioning = /position|reposition|ferry|crew and freight|freight only|empty/i.test(hint || '');
    const principalFeature = s.principalFeatures !== false && !positioning && Math.random() < 0.28;
    // a different person's small moment each time, and a cabin and a crowd that change with the day
    const recent = (L.recent || []).slice(-6);
    const pool = ['2', '3', '4', '5', '6', '7', '8', '9'].filter(id => !recent.slice(-4).some(r => r.spotlight === id));
    const spotlight = pool[Math.floor(Math.random() * pool.length)] || '5';
    const pickW = list => { const tot = list.reduce((a, x) => a + x[1], 0); let r = Math.random() * tot; for (const x of list) { r -= x[1]; if (r <= 0) return x[0]; } return list[0][0]; };
    const mood = pickW([['quiet', 3], ['buoyant', 2], ['focused', 2], ['tired', 2], ['celebrating', 1]]);
    const fans = positioning ? 'none' : pickW([['none', 4], ['a few', 4], ['a crowd', 2]]);
    return { complication, visibility, principalFeature, spotlight, mood, fans, recentKinds: recent.filter(r => r.kind).map(r => r.kind + ' (' + r.ref + ')'), at: Date.now() };
  }
  function spotlightName(id) { const p = personById(id); return p ? p.name + ' (' + p.role.toLowerCase() + ')' : ''; }
  function diceNote(dice, forCompanion) {
    if (forCompanion) {
      return ['STORY DESK NOTE', '  sealed event: ' + (dice.complication !== 'none' && dice.visibility === 'sealed' ? dice.complication : 'none'),
        dice.complication !== 'none' && dice.visibility === 'sealed' ? '  Write exactly one event. ' + (dice.complication === 'major' ? 'Make it a real decision with consequences that last beyond this sector.' : 'Keep it small: a schedule nudge, a request or a change at the other end.') : '  Write no events. An empty events array.',
        '  principal feature: ' + (dice.principalFeature ? 'yes (the brief already carries it; echo it in a beat or two)' : 'no'),
        dice.spotlight ? '  spotlight: ' + spotlightName(dice.spotlight) + '. Most of the party board lines are theirs.' : '',
        dice.mood ? '  cabin mood: ' + dice.mood : '', dice.fans ? '  fans at the departure FBO: ' + dice.fans : ''].filter(Boolean).join('\n');
    }
    let c = 'none';
    if (dice.complication !== 'none') c = dice.visibility === 'sealed' ? 'sealed (keep the brief routine and do not hint at anything)' : dice.complication + ', public';
    return ['DISPATCH NOTE (story desk)', '  complication: ' + c, '  principal feature: ' + (dice.principalFeature ? 'yes, if she is aboard' : 'no'),
      dice.spotlight ? '  spotlight: ' + spotlightName(dice.spotlight) : '', dice.mood ? '  cabin mood: ' + dice.mood : '', dice.fans ? '  fans at the departure FBO: ' + dice.fans : '',
      dice.recentKinds && dice.recentKinds.length ? '  recent kinds of story (pick another): ' + dice.recentKinds.join(', ') : ''].filter(Boolean).join('\n');
  }

  // ════════════════════════════════════════════════════════════════
  // Companion: clean what Claude returns, or build a plain one
  // ════════════════════════════════════════════════════════════════
  function chOf(c) { const u = upper(c); return ['NET', 'ICS', 'OPS', 'DECK'].includes(u) ? u : 'ICS'; }
  function band(fpm) { const v = Math.abs(num(fpm)); return v >= 600 ? 'hard' : v >= 300 ? 'firm' : v >= 150 ? 'normal' : 'smooth'; }
  function clampN(v, a, z) { return Math.max(a, Math.min(z, v)); }

  // Every message is timed with an anchor and an offset in minutes: "off-20", "to+6", "tod+1", "on+5".
  const ANCHORS = ['clock', 'off', 'to', 'belt', 'toc', 'tod', 'ldg', 'on'];
  const AT_ALIAS = { start: 'clock', begin: 'clock', cold: 'clock', offblocks: 'off', departure: 'off', taxi: 'off', takeoff: 'to', rotate: 'to', seatbelt: 'belt', belts: 'belt', service: 'belt', topofclimb: 'toc', cruise: 'toc', topofdescent: 'tod', descent: 'tod', landing: 'ldg', touchdown: 'ldg', land: 'ldg', onblocks: 'on', blocks: 'on', arrival: 'on', parked: 'on' };
  function parseAt(s) {
    if (s == null || s === '') return null;
    const t = String(s).toLowerCase().replace(/[−–—]/g, '-').replace(/\s+/g, '');
    const m = t.match(/^([a-z]+)(?:([+-])(\d+(?:\.\d+)?))?(?:mins?|m)?$/);
    if (!m) return null;
    const a = AT_ALIAS[m[1]] || m[1];
    if (!ANCHORS.includes(a)) return null;
    const n = m[3] ? (m[2] === '-' ? -1 : 1) * Number(m[3]) : 0;
    return { a, n: clampN(Math.round(n * 10) / 10, -240, 600) };
  }
  function fmtAt(p) { return p.a + (p.n ? (p.n > 0 ? '+' : '-') + Math.abs(p.n) : ''); }
  function atFromOld(phase, after) {
    const id = norm(phase).replace(/[^a-z]/g, '');
    const alias = { pre: 'preflight', ground: 'preflight', board: 'boarding', tod: 'descent', topofdescent: 'descent', parked: 'blocks', onblocks: 'blocks', shutdown: 'post', postflight: 'post', arrival: 'blocks' };
    const o = OLD_PHASE_AT[alias[id] || id];
    return o ? fmtAt({ a: o[0], n: o[1] + clampN(num(after), 0, 600) }) : null;
  }
  function cleanAt(m, dflt) {
    const p = parseAt(m && m.at);
    if (p) return fmtAt(p);
    return (m && m.phase != null && atFromOld(m.phase, m.afterMin)) || dflt;
  }

  // The four crew calls. Claude can write them; these stand in when it doesn't.
  const CUE_AT = { apu: 'off-20', start: 'off-5', taxi: 'off', blocks: 'on' };
  function cueDefaults(b) {
    const n = aboardList(b).length, dog = !!b && b.dog !== false;
    return {
      apu: { from: 'Priya', ch: 'DECK', at: CUE_AT.apu, text: 'Before-start checklist is done down to the APU, Hunter. Ready for APU start when you are.' },
      start: { from: 'Tomás', ch: 'ICS', at: CUE_AT.start, text: 'Door’s closed. ' + (n ? n + ' aboard' + (dog ? ' plus MANCHILD' : '') + ', cabin secure.' : 'Cabin’s secure.') + ' Ready for start, Cap.' },
      taxi: { from: 'Priya', ch: 'DECK', at: CUE_AT.taxi, text: 'After-start checks are complete and we have the taxi clearance. Ready to taxi.' },
      blocks: { from: 'Priya', ch: 'DECK', at: CUE_AT.blocks, text: 'Marshaller’s got us. Call on blocks when the brake’s set.' }
    };
  }
  function cleanCue(id, x, d) {
    if (!x || typeof x !== 'object' || !String(x.text || '').trim() || isPrincipalLine(x.from)) return Object.assign({}, d);
    const p = parseAt(x.at);
    let at = d.at;
    if (p && id !== 'blocks' && (p.a === 'clock' || (p.a === 'off' && p.n <= 0))) at = fmtAt(p);
    if (p && id === 'blocks' && ((p.a === 'on' && p.n <= 0) || (p.a === 'ldg' && p.n >= 0))) at = fmtAt(p);
    return { from: String(x.from || d.from), ch: chOf(x.ch || d.ch), at, text: String(x.text).trim() };
  }
  function cleanLine(x, aboard) {
    if (!(x && typeof x === 'object' && String(x.text || '').trim() && !isPrincipalLine(x.from))) return null;
    const out = { from: String(x.from || 'Tomás'), ch: chOf(x.ch), text: String(x.text).trim() };
    const p = person(out.from);
    // someone who doesn't talk to the flight deck is passed on by Tomás aboard, or Curtis on the ground
    if (p && !DIRECT.has(p.id)) Object.assign(out, p.id === '4' ? { from: 'SHARPEST TOOL' } : { relay: p.first, from: aboard ? 'Tomás' : 'SHARPEST TOOL', ch: aboard ? 'ICS' : 'NET' });
    return out;
  }
  function cleanCheck(k) {
    if (!k || typeof k !== 'object' || !/^\d{1,2}:\d{2}$/.test(String(k.by || '').trim())) return null;
    let when = norm(k.when);
    if (!when && k.phase) when = ['preflight', 'boarding', 'taxi', 'takeoff'].includes(norm(k.phase)) ? 'off' : 'on';
    when = ['off', 'taxi', 'departure', 'offblocks'].includes(when.replace(/[^a-z]/g, '')) ? 'off' : 'on';
    return { when, by: String(k.by).trim().padStart(5, '0'), where: k.where === 'dep' ? 'dep' : 'arr', day: num(k.day), pass: cleanLine(k.pass), fail: cleanLine(k.fail) };
  }

  function normCompanion(c, b) {
    c = c && typeof c === 'object' ? c : {};
    if (c._n === 2) return c;
    const out = { _n: 2, initialStatus: STATUS[c.initialStatus] ? c.initialStatus : (principalAboard(b) ? 'hotel' : 'not-aboard') };
    const ds = c.daySheet && typeof c.daySheet === 'object' ? c.daySheet : {};
    out.daySheet = {
      title: String(ds.title || 'Day sheet'), date: String(ds.date || ''),
      rows: (Array.isArray(ds.rows) ? ds.rows : []).filter(r => r && (r.link === 'off' || r.link === 'on' || /^\d{1,2}:\d{2}$/.test(String(r.t || '').trim()))).slice(0, 14).map(r => ({
        t: r.link ? '' : String(r.t).trim().padStart(5, '0'), link: r.link === 'off' || r.link === 'on' ? r.link : undefined,
        where: r.where === 'arr' ? 'arr' : 'dep', day: num(r.day), moves: !!r.moves, label: String(r.label || ''), who: String(r.who || '')
      }))
    };
    if (!out.daySheet.rows.some(r => r.link === 'off')) out.daySheet.rows.push({ link: 'off', label: 'Off blocks, ' + ((b.from && b.from.parking) || b.from.icao), who: 'FEATHER', where: 'dep' });
    if (!out.daySheet.rows.some(r => r.link === 'on')) out.daySheet.rows.push({ link: 'on', label: 'On blocks, ' + ((b.to && b.to.parking) || b.to.icao), who: 'FEATHER', where: 'arr' });
    const seen = new Set();
    const cleanMsg = (m, i, pre, dflt) => {
      let id = String(m.id || pre + (i + 1)); while (seen.has(id)) id += 'x'; seen.add(id);
      return routeSpeaker({ id, at: cleanAt(m, dflt), ch: chOf(m.ch), from: String(m.from || 'Tomás'), relay: m.relay ? String(m.relay) : undefined, text: String(m.text || '').trim(), status: STATUS[m.status] ? m.status : undefined });
    };
    out.beats = (Array.isArray(c.beats) ? c.beats : []).filter(m => m && m.text && !isPrincipalLine(m.from)).slice(0, 24).map((m, i) => cleanMsg(m, i, 'b', 'toc+5'));
    const d = cueDefaults(b);
    const cues = c.cues && typeof c.cues === 'object' ? c.cues : {};
    out.cues = {};
    STEPS.forEach(st => { out.cues[st.id] = cleanCue(st.id, cues[st.id], d[st.id]); });
    const td = c.touchdown && typeof c.touchdown === 'object' ? c.touchdown : {};
    const tdDefault = {
      smooth: { from: 'Tomás', ch: 'ICS', text: 'Didn’t feel a thing back here. Lovely.' },
      normal: { from: 'Tomás', ch: 'ICS', text: 'Nice one, Cap. Coffee stayed in the cups.' },
      firm: { from: 'Tomás', ch: 'ICS', text: 'Bit of a thump back here. Everyone’s fine.' },
      hard: { from: 'Tomás', ch: 'ICS', text: 'That one woke the whole cabin. Everyone’s fine, I’m checking the galley.' }
    };
    out.touchdown = {};
    ['smooth', 'normal', 'firm', 'hard'].forEach(k => { const x = cleanLine(td[k], true) || tdDefault[k]; out.touchdown[k] = { from: String(x.from || 'Tomás'), ch: chOf(x.ch), text: String(x.text), relay: x.relay }; });
    out.events = (Array.isArray(c.events) ? c.events : []).filter(e => e && e.text && Array.isArray(e.options) && e.options.length >= 2 && !isPrincipalLine(e.from)).slice(0, 3).map((e, i) => {
      const m = cleanMsg(e, i, 'e', 'toc+8');
      const evDelay = e.delayMin != null ? e.delayMin : e.shiftMin;
      const opts = e.options.slice(0, 3).map((o, j) => ({
        id: String(o.id || 'abc'[j]), label: String(o.label || 'Option ' + (j + 1)).slice(0, 60), reply: String(o.reply || ''), outcome: String(o.outcome || ''),
        delayMin: clampN(Math.round(num(o.delayMin != null ? o.delayMin : (o.shiftMin != null ? o.shiftMin : evDelay))), -90, 120),
        score: clampN(num(o.score), -2, 2),
        ledger: o.ledger && typeof o.ledger === 'object' ? o.ledger : null,
        check: cleanCheck(o.check)
      }));
      const dflt = e.default != null ? e.default : e.def;
      return Object.assign(m, { title: String(e.title || 'Situation'), cat: String(e.cat || e.kind || '').slice(0, 24), hold: e.hold === true, options: opts, def: opts.some(o => o.id === String(dflt)) ? String(dflt) : opts[opts.length - 1].id });
    });
    out.places = cleanPlaces(c.places);
    out.ground = cleanGround(c.ground, b);
    out.doing = cleanDoing(c.doing, b);
    return out;
  }

  // Only these people talk to the flight deck. Everyone else's news comes through Curtis on the ground or Tomás aboard.
  const DIRECT = new Set(['SIC', 'CAB', '9', '3', '2', 'OPS', '1', 'K9', 'PIC']);
  function preBoarding(at) { const p = parseAt(at); return !!p && (p.a === 'clock' || (p.a === 'off' && p.n <= -10)); }
  function routeSpeaker(m) {
    const p = person(m.from);
    if (!p || DIRECT.has(p.id)) return m;
    const ground = preBoarding(m.at) || ((parseAt(m.at) || {}).a === 'on' && (parseAt(m.at) || {}).n >= 3);
    if (p.id === '4') return Object.assign(m, { from: 'SHARPEST TOOL', ch: m.ch === 'OPS' ? 'OPS' : ground ? 'NET' : 'ICS' });
    return Object.assign(m, { relay: m.relay || p.first, from: ground ? 'SHARPEST TOOL' : 'Tomás', ch: ground ? 'NET' : 'ICS' });
  }
  function cleanPoint(x) {
    if (!x || typeof x !== 'object') return null;
    const lat = Number(x.lat), lon = Number(x.lon);
    const ok = x.lat != null && x.lon != null && Math.abs(lat) <= 90 && Math.abs(lon) <= 180 && !(lat === 0 && lon === 0);
    if (!ok && !x.q && !x.name) return null;
    return { name: String(x.name || '').slice(0, 60), q: String(x.q || '').slice(0, 120), lat: ok ? lat : null, lon: ok ? lon : null };
  }
  function cleanPlaces(pl) {
    pl = pl && typeof pl === 'object' ? pl : {};
    const side = (o, ks) => { const r = {}; ks.forEach(k => { const v = cleanPoint(o && o[k]); if (v) r[k] = v; }); return r; };
    const out = { dep: side(pl.dep, ['airport', 'fbo', 'hotel']), arr: side(pl.arr, ['airport', 'fbo', 'hotel', 'venue']) };
    const rt = pl.route && typeof pl.route === 'object' ? pl.route : {};
    const line = a => (Array.isArray(a) ? a.filter(p => Array.isArray(p) && Math.abs(Number(p[0])) <= 90 && Math.abs(Number(p[1])) <= 180).slice(0, 60).map(p => [Number(p[0]), Number(p[1])]) : []);
    const r = { dep: line(rt.dep), arr: line(rt.arr) };
    if (r.dep.length || r.arr.length) out.route = r;
    return out;
  }
  function cleanCars(cars, b) {
    if (!cars || typeof cars !== 'object') return null;
    const ab = aboardList(b).map(String).concat(b && b.dog !== false ? ['K9'] : []);
    const out = {};
    Object.keys(cars).slice(0, 5).forEach(k => {
      const key = /van/i.test(k) ? 'van' : String(k).replace(/[^0-9]/g, '').slice(0, 1) || String(Object.keys(out).length + 1);
      const ids = (Array.isArray(cars[k]) ? cars[k] : []).map(x => (/^k9$|goodwin|manchild/i.test(String(x)) ? 'K9' : String((person(String(x)) || {}).id || x))).filter(x => ab.includes(x));
      if (ids.length) out[key] = Array.from(new Set((out[key] || []).concat(ids)));
    });
    return Object.keys(out).length ? out : null;
  }
  function cleanGround(g, b) {
    g = g && typeof g === 'object' ? g : {};
    const mc = g.motorcade || {}, ar = g.arrival || {};
    let leave = cleanAt({ at: mc.leave }, 'off-45'), arrive = cleanAt({ at: mc.arrive }, 'off-18');
    const pl = parseAt(leave), pa = parseAt(arrive);
    if (!pl || !pa || pl.a !== pa.a || pl.n >= pa.n) { leave = 'off-45'; arrive = 'off-18'; }
    const al = parseAt(cleanAt({ at: ar.leave }, 'on+4'));
    return {
      motorcade: { leave, arrive, cars: cleanCars(mc.cars, b) || defaultCars(b) },
      arrival: { leave: al && al.a === 'on' && al.n >= 0 ? fmtAt(al) : 'on+4', to: ar.to === 'venue' ? 'venue' : 'hotel', cars: cleanCars(ar.cars, b) }
    };
  }
  function cleanDoing(d, b) {
    const out = {};
    if (!d || typeof d !== 'object') return out;
    Object.keys(d).forEach(k => {
      const id = /^k9$|goodwin|manchild/i.test(k) ? 'K9' : String((person(k) || {}).id || k);
      const list = (Array.isArray(d[k]) ? d[k] : []).filter(x => x && x.text && parseAt(x.at)).slice(0, 6).map(x => ({ at: fmtAt(parseAt(x.at)), text: String(x.text).replace(/["“”]/g, '').trim().slice(0, 90) }));
      if (list.length) out[id] = list;
    });
    return out;
  }

  function plainCompanion(b) {
    const from = b.from || {}, to = b.to || {};
    const ab = aboardList(b);
    const her = ab.includes(1);
    const T = briefTimes(b);
    const beats = [
      { id: 'p1', at: 'clock', ch: 'OPS', from: 'OPS VNY', text: (b.ref || '') + ' RELEASED ' + (from.icao || '') + '-' + (to.icao || '') + '. ' + ((b.techLog && (b.techLog.deferred || []).length) ? 'DEFERRED ITEMS ON BOARD, SEE TECH LOG. ' : '') + 'RGDS OKAFOR' }
    ];
    if (her) {
      beats.push({ id: 'p2', at: 'off-28', ch: 'NET', from: 'SHARPEST TOOL', text: 'FEATHER 1, SHARPEST TOOL. ESPRESSO mobile, ten minutes out.', status: 'mobile' });
      beats.push({ id: 'p3', at: 'off-16', ch: 'NET', from: 'SHARPEST TOOL', text: 'Vehicles at the stairs. Boarding now.', status: 'planeside' });
    }
    beats.push({ id: 'p4', at: 'off-10', ch: 'ICS', from: 'Tomás', text: 'Bags are in and everyone’s settling. Door in a few minutes.' });
    if (b.sticky && b.sticky.text) beats.push({ id: 'p5', at: 'to+8', ch: 'ICS', from: b.sticky.from || 'Tomás', text: b.sticky.text });
    beats.push({ id: 'p6', at: 'tod+1', ch: 'ICS', from: 'Tomás', text: 'Starting cabin prep for the descent.' });
    if (her) {
      beats.push({ id: 'p7', at: 'on+1', ch: 'NET', from: 'SHARPEST TOOL', text: 'FEATHER 1, SHARPEST TOOL. Cars at the stairs. ESPRESSO off first.' });
      beats.push({ id: 'p8', at: 'on+5', ch: 'NET', from: 'THUMBS', text: 'ESPRESSO mobile. Thanks, FEATHER.', status: 'hotel-arr' });
    }
    const rows = [{ link: 'off', label: 'Off blocks, ' + (from.parking || from.icao), who: 'FEATHER' }, { link: 'on', label: 'On blocks, ' + (to.parking || to.icao), who: 'FEATHER' }];
    if (T.off != null && her) {
      rows.unshift({ t: hhmm(T.off - 75 * MIN, T.fo), where: 'dep', label: 'Lobby call', who: 'Party' });
      rows.splice(1, 0, { t: hhmm(T.off - 60 * MIN, T.fo), where: 'dep', label: 'Motorcade departs', who: 'SHARPEST TOOL' });
      if (T.on != null) rows.push({ t: hhmm(T.on + 20 * MIN, T.too), where: 'arr', moves: true, label: 'Cars depart the FBO', who: 'SHARPEST TOOL' });
    }
    return normCompanion({ initialStatus: her ? 'hotel' : 'not-aboard', daySheet: { title: 'Day sheet', date: T.off != null ? dowDate(T.off, T.fo) : '', rows }, beats, events: [] }, b);
  }

  // ════════════════════════════════════════════════════════════════
  // Claude
  // ════════════════════════════════════════════════════════════════
  const AI = {
    fn: null, state: 'pending',
    async init() {
      try { this.fn = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('sample') : null; } catch (e) { this.fn = null; }
      this.state = this.fn ? 'ready' : 'absent';
    },
    get ok() { return this.state === 'ready'; },
    async json(prompt, opts) {
      if (!this.fn) throw { code: 'not_granted', message: 'unavailable' };
      try { return await this.fn.json(prompt, opts); }
      catch (e) { if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled' || e.code === 'not_declared' || e.code === 'capability_disabled' || e.code === 'capability_removed')) { this.state = 'denied'; render(); } throw e; }
    },
    err(e) {
      const c = e && e.code;
      return ({
        not_granted: 'Claude isn’t set up yet. Add your Claude API key in Settings (Ctrl+,). You can still load briefs made in chat.',
        sampling_disabled: 'Claude isn’t available on this account, so the story desk is off.',
        rate_limited: 'Claude is busy or you’ve hit a usage limit. Try again in a little while.',
        invalid_json: 'Claude’s answer didn’t come back as clean JSON. Try again.',
        refused: 'Claude declined that request. Change the sector notes and try again.',
        prompt_too_large: 'Too much to send in one go. Shorten the sector notes and try again.',
        session_expired: 'Your Claude API key was rejected. Check it in Settings (Ctrl+,), then retry.',
        cancelled: 'Stopped.',
        empty_completion: 'Claude returned nothing. Try again.'
      })[c] || 'Claude couldn’t finish (' + ((e && e.message) || c || 'error') + '). Try again.';
    }
  };
  let downloadsNs;
  async function downloadsCap() { if (downloadsNs === undefined) { try { downloadsNs = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { downloadsNs = null; } } return downloadsNs; }

  function tx(id) { const el = document.getElementById(id); return el ? el.textContent.replace(/^\n/, '') : ''; }

  function trimBriefForCompanion(b) {
    const pick = (o, ks) => { const r = {}; ks.forEach(k => { if (o && o[k] !== undefined) r[k] = o[k]; }); return r; };
    return {
      ref: b.ref, rev: b.rev, revNote: b.revNote, leg: b.leg, nickname: b.nickname, international: b.international,
      from: pick(b.from, ['icao', 'name', 'city', 'tz', 'utcOffset', 'parking', 'notes']), to: pick(b.to, ['icao', 'name', 'city', 'tz', 'utcOffset', 'parking', 'notes']),
      flight: pick(b.flight, ['offBlocksZ', 'onBlocksZ', 'airborneMin', 'distNm', 'route', 'cruise']), sim: pick(b.sim, ['clockLocal', 'start', 'setPiece']),
      pax: b.pax, extraPax: b.extraPax, dog: b.dog, notes: b.notes, dogNote: b.dogNote, sticky: b.sticky, why: b.why, flags: b.flags,
      showDays: b.showDays, fanAlert: b.fanAlert, story: b.story, sinceLast: b.sinceLast ? { carried: b.sinceLast.carried } : undefined,
      rider: b.rider, milestone: b.milestone, next: b.next
    };
  }

  function briefPrompt(ctx) {
    return [
      tx('tx-base').trim(), '', tx('tx-story').trim(), '', tx('tx-ledger').trim(), '',
      'FOR THIS REQUEST',
      '  FEATHER NET writes the companion separately. Return the brief exactly as specified,',
      '  with "story" and "ledgerUpdates" at the top level, and no "companion" key.',
      '  The dates and times are in 2027 unless the sector says otherwise.', '',
      'SECTOR DATA', '',
      ctx.packet, '', ctx.lastLog, '', ctx.diceNote, '',
      'SECTOR',
      '  ' + [ctx.next.ref, (ctx.next.from || '') + ' → ' + (ctx.next.to || ''), ctx.next.names].filter(Boolean).join(' · '),
      ctx.next.when ? '  ' + ctx.next.when : '', ctx.next.summary ? '  ' + ctx.next.summary : '',
      ctx.extra ? '\n  NOTES FROM THE CAPTAIN AND THE ROUTING (Rev 12)\n' + ctx.extra.split('\n').map(l => '  ' + l).join('\n') : '', '',
      'THE LAST BRIEF, FOR CONTINUITY OF THE TOUR BLOCK, LEG AND STYLE',
      JSON.stringify(ctx.prevBrief || {}, null, 0).slice(0, 14000)
    ].join('\n');
  }

  function companionPrompt(b, L, dice) {
    return [
      'You write the FEATHER NET companion for one sector of a flight simulator campaign: an operationally realistic private-jet tour in X-Plane 12. N511GW is an Embraer Legacy 650 flown by Carpenter Air Management LLC for the Man’s Best Friend World Tour 2027. The pilot flies the sector live while FEATHER NET plays your messages at the right moments.',

  // ════════════════════════════════════════════════════════════════

  const Sound = {
    ctx: null,
    ensure() {

      g.gain.setValueAtTime(0.0001, c.currentTime + start);
      g.gain.exponentialRampToValueAtTime(vol, c.currentTime + start + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
      o.connect(g).connect(c.destination);
      o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
    },
    noise(start, dur, vol = 0.12, f = 1700) {
      const c = this.ctx; if (!c) return;
      const len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

      src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 0.9;
      g.gain.setValueAtTime(vol, c.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
      src.connect(bp).connect(g).connect(c.destination);
      src.start(c.currentTime + start);
    },
    play(ch) {
      if (!App.prefs.sound || !this.ensure()) return;
      if (ch === 'NET') { this.noise(0, 0.16, 0.14); this.tone(1200, 0.02, 0.05, 'square', 0.05); }
      else if (ch === 'ICS') { this.tone(1318, 0, 0.55, 'sine', 0.16); this.tone(988, 0.32, 0.8, 'sine', 0.16); }
      else if (ch === 'OPS') { [0, 0.11, 0.22].forEach(t => this.tone(1560, t, 0.06, 'square', 0.04)); }
      else if (ch === 'ALERT') { this.tone(880, 0, 0.18, 'triangle', 0.16); this.tone(880, 0.24, 0.18, 'triangle', 0.16); }
      else if (ch === 'DECK') { this.tone(660, 0, 0.12, 'sine', 0.08); }
      else if (ch === 'CUE') { this.tone(784, 0, 0.16, 'sine', 0.12); this.tone(1046, 0.17, 0.32, 'sine', 0.12); }
      else if (ch === 'RATE') { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, i * 0.12, 0.5, 'sine', 0.1)); }
    },
    tail(ch) { if (ch === 'NET' && App.prefs.sound && this.ctx) this.noise(0, 0.12, 0.08); }
  };

  const Voice = {
    list: [], queue: [], busy: false,
    init() {
      if (!('speechSynthesis' in window)) return;
      const load = () => { try { this.list = speechSynthesis.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang)); } catch (e) { this.list = []; } };
      load();
      try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
    },
    unlock() { try { if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch (e) { /* ignore */ } },
    pick(p) {
      if (!this.list.length) return null;
      const F = /(samantha|karen|moira|tessa|fiona|victoria|allison|ava|susan|zira|hazel|serena|kate|joanna|salli|kimberly|ivy|emma|amy|nicky|female|catherine|martha|libby|sonia|aria|jenny|michelle|natasha|clara|emily|shelley|sandy|flo|kathy|veena|isha|zoe|nora|evelyn|sara|jessa|ana|heera|google us english$|google uk english female)/i;
      const M = /(daniel|alex|fred|tom|aaron|arthur|gordon|oliver|rishi|lee|ralph|albert|male|david|mark|george|james|guy|ryan|thomas|eddy|reed|rocko|christopher|eric|roger|liam|william|brian|matthew|justin|joey|russell|andrew|brandon|davis|tony|jacob|google uk english male)/i;
      const want = p && p.voice === 'f' ? F : M;
      let pool = this.list.filter(v => want.test(v.name) && !(p && p.voice === 'm' && F.test(v.name)));
      if (p && p.accent === 'GB') { const gb = pool.filter(v => /GB|UK/i.test(v.lang + v.name)); if (gb.length) pool = gb; }
      if (!pool.length) pool = this.list;
      const idx = Math.abs(String(p ? p.id : 'x').split('').reduce((a, c) => a * 31 + c.charCodeAt(0), 7)) % pool.length;
      return pool[idx];
    },
    say(text, p, ch) {
      if (!App.prefs.voice || !('speechSynthesis' in window) || !text) return Promise.resolve();
      if (ch === 'OPS' && !App.prefs.readOps) return Promise.resolve();
      return new Promise(res => {
        this.queue.push({ text, p, ch, res });
        this.run();
      });
    },
    run() {
      if (this.busy || !this.queue.length) return;
      const job = this.queue.shift();
      this.busy = true;
      let done = false;
      const fin = () => { if (done) return; done = true; this.busy = false; Sound.tail(job.ch); job.res(); setTimeout(() => this.run(), 250); };
      try {
        const u = new SpeechSynthesisUtterance(job.text.replace(/\bFBO\b/g, 'F B O').replace(/\bETA\b/g, 'E T A'));
        const v = this.pick(job.p); if (v) { u.voice = v; u.lang = v.lang; }
        u.pitch = job.p && job.p.pitch ? job.p.pitch : 1; u.rate = job.ch === 'NET' ? 1.06 : 1.0; u.volume = 1;
        u.onend = fin; u.onerror = fin;
        speechSynthesis.speak(u);
        setTimeout(fin, 4000 + job.text.length * 90);
      } catch (e) { fin(); }
    },
    stop() { this.queue = []; try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } this.busy = false; }
  };

  let wakeLock = null;

  function campaignYear() {

  // seeded, imported or older sectors may carry a raw companion or a phase-based flight; bring them up to date on the way in
  function withCompanion(s) {
    if (!s || !s.brief) return s;
    let out = s;
    if (s.companion && s.companion._n !== 2) out = Object.assign({}, out, { companion: normCompanion(s.companion, s.brief) });
    if (out.flight && out.flight.v !== 2) out = Object.assign({}, out, { flight: migrateFlight(out.flight) });
    return out;
  }
  function migrateFlight(f0) {
    const f = clone(f0);
    const at = id => { const p = (f.phaseLog || []).find(x => x.id === id); return p ? p.sim : null; };
    const g = Object.assign(f, { v: 2, cf: {}, sentAt: {}, delays: [], clockStart: at('preflight') != null ? at('preflight') : (f.clock ? f.clock.sim : null) });
    const taxi = at('taxi'), blocks = at('blocks');
    if (taxi != null) { g.cf.apu = taxi; g.cf.start = taxi; g.cf.taxi = taxi; }
    else if (at('boarding') != null) g.cf.apu = at('boarding');
    if (blocks != null) g.cf.blocks = blocks;
    if (num(f.shiftMin)) g.delays.push({ min: num(f.shiftMin), seg: 'dep', by: 'event', sim: g.clockStart || 0, why: 'Earlier change' });
    (g.checks || []).forEach(c => { if (!c.when) c.when = ['preflight', 'boarding', 'taxi', 'takeoff'].includes(c.phase) ? 'off' : 'on'; });
    g.queue = (g.queue || []).map(q => q.due != null ? q : Object.assign({}, q, { due: (at(q.phase) != null ? at(q.phase) : g.clockStart || 0) + num(q.afterMin) * MIN }));
    g.delivered = g.delivered || []; g.feed = g.feed || []; g.decisions = g.decisions || {}; g.effects = g.effects || []; g.checks = g.checks || [];
    delete g.phase; delete g.phaseLog; delete g.shiftMin;
    return g;
  }
  function watchSector(ref) {
    if (App.sectorRef === ref) return;
    if (App.unsub.sector) { App.unsub.sector(); App.unsub.sector = null; }
    App.sectorRef = ref; App.sector = null;
