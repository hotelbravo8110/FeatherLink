<!doctype html><html><head><meta charset=utf8><script src="host-shim.js"></script><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FEATHER NET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&family=Caveat:wght@500;600&display=swap">
<style>
:root {
  /* Layout: flight-deck strip on top, message deck left, tour day sheet right, the crew's next call along the bottom */
  color-scheme: dark;
  --bg: #10120f;
  --deck: #161914;
  --panel: #1c2019;
  --raise: #252a21;
  --line: #2f352b;
  --line-2: #434a3c;
  --ink: #ece7da;
  --ink-2: #c8c4b7;
  --muted: #8f9386;
  --brass: #d4bb8c;
  --brass-ink: #17140e;
  --net: #e6a652;
  --ics: #d4bb8c;
  --ops: #8fb5d9;
  --deckc: #b8c4a4;
  --espresso: #ee7299;
  --warn: #f06c58;
  --caution: #e8c24f;
  --ok: #86bf8c;
  --hatch: rgba(236, 231, 218, 0.07);
  --scrim: rgba(8, 9, 7, 0.72);
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
  --f-ui: 'B612', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-data: 'B612 Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --f-hand: 'Caveat', 'Bradley Hand', 'Segoe Print', cursive;
  --r: 6px;
  --tabbar: 0px;
  --keybar: 86px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #e2e4dc;
    --deck: #eaece5;
    --panel: #f6f7f2;
    --raise: #ffffff;
    --line: #cdd1c4;
    --line-2: #aeb4a5;
    --ink: #14161a;
    --ink-2: #30342d;
    --muted: #595e53;
    --brass: #7a5c28;
    --brass-ink: #fffaf0;
    --net: #93530f;
    --ics: #7a5c28;
    --ops: #235887;
    --deckc: #46523a;
    --espresso: #bf2459;
    --warn: #b3261e;
    --caution: #7a5f00;
    --ok: #2b6838;
    --hatch: rgba(20, 22, 26, 0.06);
    --scrim: rgba(30, 32, 28, 0.45);
    --shadow: 0 1px 2px rgba(20, 22, 26, 0.08), 0 10px 26px rgba(20, 22, 26, 0.08);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e2e4dc;
  --deck: #eaece5;
  --panel: #f6f7f2;
  --raise: #ffffff;
  --line: #cdd1c4;
  --line-2: #aeb4a5;
  --ink: #14161a;
  --ink-2: #30342d;
  --muted: #595e53;
  --brass: #7a5c28;
  --brass-ink: #fffaf0;
  --net: #93530f;
  --ics: #7a5c28;
  --ops: #235887;
  --deckc: #46523a;
  --espresso: #bf2459;
  --warn: #b3261e;
  --caution: #7a5f00;
  --ok: #2b6838;
  --hatch: rgba(20, 22, 26, 0.06);
  --scrim: rgba(30, 32, 28, 0.45);
  --shadow: 0 1px 2px rgba(20, 22, 26, 0.08), 0 10px 26px rgba(20, 22, 26, 0.08);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #10120f;
  --deck: #161914;
  --panel: #1c2019;
  --raise: #252a21;
  --line: #2f352b;
  --line-2: #434a3c;
  --ink: #ece7da;
  --ink-2: #c8c4b7;
  --muted: #8f9386;
  --brass: #d4bb8c;
  --brass-ink: #17140e;
  --net: #e6a652;
  --ics: #d4bb8c;
  --ops: #8fb5d9;
  --deckc: #b8c4a4;
  --espresso: #ee7299;
  --warn: #f06c58;
  --caution: #e8c24f;
  --ok: #86bf8c;
  --hatch: rgba(236, 231, 218, 0.07);
  --scrim: rgba(8, 9, 7, 0.72);
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; text-wrap: balance; }
p { margin: 0; }
small { font-size: 12px; }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label {
  font-family: var(--f-data);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── shell ─────────────────────────────── */
#app { min-height: 100%; display: flex; flex-direction: column; }
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--deck);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1320px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.mark { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark svg { width: 22px; height: 22px; flex: none; color: var(--brass); }
.mark b {
  font-family: var(--f-data);
  font-size: 13px;
  letter-spacing: 0.24em;
  font-weight: 700;
  white-space: nowrap;
}
.tail {
  font-family: var(--f-data);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted);
  border: 1px solid var(--line-2);
  border-radius: 3px;
  padding: 2px 6px;
  white-space: nowrap;
}
.sectorchip {
  font-family: var(--f-data);
  font-size: 12px;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.sectorchip strong { color: var(--ink); }
.grow { flex: 1; }
.tabs { display: flex; gap: 2px; }
.tab {
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 8px 12px 7px;
  font-family: var(--f-data);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }
.tab .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--espresso); margin-left: 6px; vertical-align: 2px; }

main {
  flex: 1;
  width: 100%;
  max-width: 1320px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 16px calc(var(--keybar) + var(--tabbar) + 24px);
}
main.no-key { padding-block-end: calc(var(--tabbar) + 32px); }
main.pdf { padding-block-end: 0; flex: 0 0 auto; }
#pdfstage {
  width: 100%;
  max-width: 1320px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 0 calc(var(--tabbar) + 16px);
}

@media (max-width: 760px) {
  :root { --tabbar: 58px; }
  .top .tabs {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    background: var(--deck);
    border-top: 1px solid var(--line);
    padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px));
    justify-content: space-around;
  }
  .tab { flex: 1; border-bottom: 0; border-top: 2px solid transparent; padding: 12px 4px; font-size: 11px; letter-spacing: 0.1em; }
  .tab[aria-selected="true"] { border-top-color: var(--brass); }
  .top .grow { display: none; }
  .sectorchip { flex: 1; text-align: right; }
}

/* ── generic pieces ───────────────────── */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px;
  min-width: 0;
}
.card > header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card > header h2 { font-size: 15px; letter-spacing: 0.01em; }
.card > header .label { margin-left: auto; }
.stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 38px;
  padding: 8px 14px;
  border-radius: 4px;
  border: 1px solid var(--line-2);
  background: var(--raise);
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
}
.btn:hover { border-color: var(--brass); }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 30px; padding: 4px 10px; font-size: 12px; }
.btn.danger { color: var(--warn); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--f-data);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border-radius: 3px;
  padding: 2px 7px;
  border: 1px solid currentColor;
  white-space: nowrap;
  line-height: 1.5;
}
.st-OPEN, .st-DEFERRED { color: var(--caution); }
.st-MONITOR { color: var(--ops); }
.st-CLOSED, .st-DONE { color: var(--ok); }
.st-AOG { color: var(--warn); }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-family: var(--f-data); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.input, select.input, textarea.input {
  width: 100%;
  min-height: 38px;
  padding: 8px 10px;
  border-radius: 4px;
  border: 1px solid var(--line-2);
  background: var(--bg);
  color: var(--ink);
}
textarea.input { min-height: 84px; resize: vertical; line-height: 1.45; }
.input.mono { font-family: var(--f-data); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) {
  .grid3, .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.kv { display: grid; gap: 2px; min-width: 0; }
.kv b { font-family: var(--f-data); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kv small { color: var(--muted); }
.note { font-size: 13px; color: var(--ink-2); }
.hr { height: 1px; background: var(--line); margin: 14px 0; }
.empty {
  border: 1px dashed var(--line-2);
  border-radius: var(--r);
  padding: 28px 20px;
  text-align: center;
  color: var(--ink-2);
  display: grid;
  gap: 10px;
  justify-items: center;
}
.empty h2 { font-size: 17px; color: var(--ink); }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--keybar) + var(--tabbar) + 18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 60;
  background: var(--ink);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 4px;
  font-size: 13px;
  box-shadow: var(--shadow);
  max-width: calc(100vw - 32px);
}
.banner {
  border: 1px solid var(--line-2);
  border-left: 3px solid var(--caution);
  background: var(--raise);
  border-radius: 4px;
  padding: 10px 12px;
  font-size: 13px;
  color: var(--ink-2);
}
.banner.warn { border-left-color: var(--warn); }
.banner.ok { border-left-color: var(--ok); }

/* ── flight tab ───────────────────────── */
.flight { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .flight { grid-template-columns: minmax(0, 1fr); } }

.strip {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px 16px 12px;
  display: grid;
  gap: 12px;
}
.strip-top { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.route { display: grid; gap: 2px; min-width: 0; }
.route h1 {
  font-family: var(--f-data);
  font-size: clamp(22px, 4.2vw, 30px);
  letter-spacing: 0.04em;
  line-height: 1.1;
}
.route h1 .arrow { color: var(--brass); padding: 0 0.15em; }
.route p { font-size: 12.5px; color: var(--muted); }
.route .nick { color: var(--espresso); font-family: var(--f-data); letter-spacing: 0.08em; font-size: 11.5px; }
.clocks { margin-left: auto; display: flex; gap: 18px; align-items: flex-start; }
.clock { display: grid; justify-items: end; gap: 1px; }
.clock .t { font-family: var(--f-data); font-size: clamp(30px, 6vw, 44px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.clock .t.paused { color: var(--muted); }
.clock .z { font-family: var(--f-data); font-size: 11.5px; color: var(--muted); letter-spacing: 0.06em; }
.ctl-row { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; }
.ctl-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ctl-group.end { margin-left: auto; }
.ctl-group .label { margin-right: 2px; }
.ctl-row .btn { min-height: 30px; padding: 3px 9px; font-size: 11.5px; font-family: var(--f-data); }
@media (max-width: 560px) { .ctl-group.end { margin-left: 0; } }

.times { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.tm { background: var(--deck); padding: 5px 6px 6px; display: grid; gap: 1px; justify-items: center; min-width: 0; }
.tm .label { font-size: 9.5px; letter-spacing: 0.12em; }
.tm b { font-family: var(--f-data); font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tm b.est { color: var(--ink-2); font-weight: 400; }
.tm b.nil { color: var(--muted); font-weight: 400; }
@media (max-width: 520px) { .times { grid-template-columns: repeat(4, minmax(0, 1fr)); } .tm:last-child { grid-column: span 2; } .tm b { font-size: 12.5px; } }

.phases { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
.ph {
  position: relative;
  font-family: var(--f-data);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-align: center;
  padding: 6px 0 5px;
  border-radius: 2px;
  color: var(--muted);
  background: var(--raise);
  border: 1px solid var(--line);
  white-space: nowrap;
  overflow: hidden;
}
.ph.done { color: var(--ink-2); background-color: var(--line); }
.ph.now { color: var(--brass-ink); background: var(--brass); border-color: var(--brass); font-weight: 700; }
@media (max-width: 520px) { .ph { font-size: 8.5px; letter-spacing: 0; } }

.status {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
}
@media (max-width: 560px) { .status { grid-template-columns: minmax(0, 1fr); } }
.status > div { background: var(--panel); padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.status .big { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.esp { display: flex; align-items: center; gap: 8px; }
.esp i { width: 9px; height: 9px; border-radius: 50%; background: var(--espresso); box-shadow: 0 0 0 3px var(--raise); box-shadow: 0 0 0 3px color-mix(in srgb, var(--espresso) 25%, transparent); flex: none; }
.esp.off i { background: var(--muted); box-shadow: none; }

/* feed */
.feed { display: grid; gap: 10px; }
.msg {
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 3px solid var(--c, var(--line-2));
  border-radius: var(--r);
  padding: 11px 14px 12px;
  display: grid;
  gap: 6px;
  min-width: 0;
}
.msg.first { padding: 14px 16px 15px; box-shadow: var(--shadow); }
.msg.first .txt { font-size: 18px; line-height: 1.38; }
.msg header { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.ch {
  font-family: var(--f-data);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  font-weight: 700;
  color: var(--c, var(--muted));
}
.from { font-family: var(--f-data); font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; }
.from small { font-family: var(--f-ui); font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.msg time { margin-left: auto; font-family: var(--f-data); font-size: 11.5px; color: var(--muted); }
.txt { font-size: 15px; overflow-wrap: anywhere; }
.c-NET { --c: var(--net); }
.c-ICS { --c: var(--ics); }
.c-OPS { --c: var(--ops); }
.c-DECK { --c: var(--deckc); }
.c-SYS { --c: var(--muted); }
.c-OPS .txt { font-family: var(--f-data); font-size: 13.5px; letter-spacing: 0.02em; }
.msg.first.c-OPS .txt { font-size: 15.5px; }
.msg.pilot { border-left-style: dashed; background: transparent; }
.msg.pilot .from { color: var(--brass); }
.msg.event { border-color: var(--c); border-left-width: 3px; }
.event-title { font-family: var(--f-data); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c); }
.opts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.opts .btn { font-weight: 700; }
.outcome { font-size: 12.5px; color: var(--muted); font-family: var(--f-data); }
.outcome.ok { color: var(--ok); }
.outcome.bad { color: var(--warn); }
.msg.cue { border-left-width: 4px; }
.msg.cue .event-title { color: var(--brass); }
.holdchip { justify-self: start; font-family: var(--f-data); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--caution); border: 1px dashed currentColor; border-radius: 3px; padding: 2px 7px; }
.composer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
@media (max-width: 520px) { .composer { grid-template-columns: minmax(0, 1fr) auto; } .composer select { grid-column: 1 / -1; } }
.thinking { font-family: var(--f-data); font-size: 12px; color: var(--muted); }

/* the key: the crew's next call */
.keybar {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
  z-index: 35;
  background: var(--deck);
  background: color-mix(in srgb, var(--deck) 92%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
}
.keybar-in {
  max-width: 1320px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.key {
  flex: 1;
  min-width: 0;
  min-height: 62px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: 8px 18px;
  border-radius: 5px;
  border: 1px solid var(--brass);
  background: var(--brass);
  color: var(--brass-ink);
  text-align: left;
}
.key:active { transform: translateY(1px); }
.key .k1 { font-family: var(--f-data); font-size: 11px; letter-spacing: 0.16em; opacity: 0.8; }
.kmain { display: grid; gap: 2px; min-width: 0; }
.key .k2 { font-size: 19px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; }
.key .k3 { font-size: 12.5px; opacity: 0.88; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.key .chev { font-family: var(--f-data); font-size: 22px; }
.key.idle { background: transparent; color: var(--ink); border-color: var(--line-2); border-style: dashed; }
.key.idle .k1 { color: var(--muted); opacity: 1; }

FLIGHT BRIEF — GENERATION PROMPT

You are the flight operations desk at CARPENTER AIR MANAGEMENT LLC, Van Nuys,
California. Private flight department of Sabrina Carpenter, Part 91, flying her on the Man's Best Friend
World Tour, season 2027. Produce a single-sector crew brief from the sector
data I paste below.

AIRCRAFT (standing)
  N511GW · Embraer Legacy 650 · E35L/M · all-over dark olive-grey
  MTOW 53,572 lb · MLW 44,092 lb · MZFW 36,156 lb · BOW 31,217 lb
  Max payload 4,939 lb · Max fuel 20,600 lb · Ceiling FL410
  Balanced field 5,614 ft SL ISA · Landing 2,850 ft · Burn 2,000 lb/h
  Planning range 3,400 nm eastbound / 3,000 nm westbound
  Payload-limited before fuel-limited on every show sector.

FUEL POLICY
  Taxi 250 domestic / 300 international · Contingency 5% of trip, floor 300
  Alternate computed · Final reserve 30 min hold 1,500 ft ISA approx 1,150 lb
  Extra at captain's discretion

RADIO CALLSIGNS (security net, fixed): aircraft and crew FEATHER 1/2/3,
  Principal ESPRESSO, Neil HOUSE TOUR, Curtis SHARPEST TOOL, Jonah THUMBS,
  Elle PLEASE PLEASE, Kiko TORNADO, Simone GOOD GRACES, Margot SLIM PICKINS,
  Wes GO GO JUICE, Goodwin MANCHILD. Use them in prose where security talks.

STANDING MANIFEST
  Capt Hunter Ferraro (PIC) · F/O Priya Raghunathan · Cabin Tomás Beltrán
  1 The Principal (SC) · 2 Neil Ashworth, Tour Director
  3 Curtis Vance, Security · 4 Jonah Petrie, Security
  5 Elle Ramírez, Assistant · 6 Kiko Tanaka, Hair
  7 Simone Adebayo, Make-up · 8 Margot Feeney, Wardrobe
  9 Wes Okonkwo, Travelling Engineer
  Goodwin, Cavalier King Charles Spaniel, 8 kg, crate under the aft divan
  Show sector payload 3,000 lb, 3,200 lb with the engineer
  Positioning 400 to 700 lb

SECTIONS, IN THIS ORDER
  1  Masthead. Operator, document ref MBF-WT27/FLT/F##, routing revision.
  2  SIM SETUP. First content on the page. Aircraft, livery, start airport
     and parking, cold and dark, date, clock time to set, departure time,
     weather, ramp fuel, payload, cruise level, time warp, session length.
  3  THE FLIGHT. Route, distance, block, off/on blocks with time zones,

  4  WHO'S ABOARD. Full manifest including the dog.
  5  SINCE LAST SECTOR. What happened on the last flight and at the show.

  6  WHY WE'RE FLYING. Short readable paragraphs. What the sector is for,

  8  ARRIVAL. Same, plus alternate and why that alternate.
  9  ANYTHING ELSE. Three or four short flagged notes.
  10 NEXT UP. The following sector in one block.

  Weather is default or real weather most of the time. Occasionally, where it
  genuinely adds something, suggest a built set-piece instead. Not every brief.
  Never invent a thunderstorm for the sake of it.

  No out-of-roleplay breaks after the masthead. Everything stays in the
  aeroplane. No meta commentary, no notes to the reader, no template talk.

  Readable, not exhaustive. Short paragraphs. Sim-oriented. The reader is
  loading this into X-Plane 12 in ten minutes.

  She is "The Principal (Sabrina Carpenter)" on the manifest

  density altitude, customs hours, noise limits. These are the value.

<script type="text/plain" id="tx-story">
STORY DESK
  Every sector carries one operational reason and one story detail, as a
  top-level "story": { "opsReason", "detail", "kind" }. kind is one of fans,
  show, wardrobe, promo, dog, border, city, weather, airport, aircraft,
  people.
    opsReason   why this aeroplane moves at this time, in one sentence.
                "Position the party to Boston ahead of Friday's TD Garden
                load-in."
    detail      one small, specific human thing about this day, in one
                sentence. "Margot's repaired encore look comes back from the
                tailor at 12:30, which sets the lobby call."
  Both feed WHY WE'RE FLYING. The detail can shape a sticky note, a seat note
  or the rider. Never repeat the same kind of detail two sectors running.

  Most sectors are routine, and that is what makes the occasional problem
  matter. The DISPATCH NOTE under SECTOR DATA says what this sector gets.
  Follow it exactly.
    complication none
        Routine. The detail is texture and nothing goes wrong.
    complication minor, public
        Something known before the brief is issued. Usually the departure
        moves 10 to 40 minutes later or earlier for a reason that comes from
        her schedule or the party: an interview that runs over, a soundcheck
        moved, a wardrobe case that arrives late, the motorcade, catering,
        an early start to beat weather or a curfew. Issue the brief as rev B
        with a revNote ("Off blocks moved from 14:00 to 14:25 local. ..."),
        and make the times, the why and the flags agree with it.
    complication major, public
        A bigger known change, still realistic: a different FBO, a new slot,
        a curfew squeeze, a payload or fuel problem, a customs or paperwork
        hold, a deferred item that bites. Rev B with a revNote.
    complication sealed
        The brief reads exactly as planned. FEATHER NET carries the surprise
        during the flight. Do not hint at it anywhere in the brief.
  principal feature yes
        Give this sector one thing specific to her day, at the level of tour
        logistics: her schedule, a cabin request passed on by Elle, wardrobe,
        Goodwin, a guest of the principal (a fictional person, added with
        extraPax), or a real tour milestone. Let it show in the why, a
        sticky, a seat note or the rider.
  The Principal is never given dialogue anywhere except the optional
  principalNote described above. Nothing about her private life, health or
  relationships. Security stories stay at fans, photographers and crowds.

  TOUR PRESSURES
  What a stadium tour actually runs into, at the level of logistics. Draw the
  detail and any complication from these and from the city itself.
    fans      fans at the FBO fence, a photographer on the perimeter road, a
              hotel lobby filling up, a decoy car, boarding inside a hangar
    show      soundcheck moved, doors, stage time, a curfew, the production
              meeting, a load-in held up by the trucks
    wardrobe  a look that needs a repair, a garment bag over the weight, a
              fitting, quick-change parts flown in, a steamer to find
    promo     a radio or TV slot, a magazine shoot, a meet-and-greet, a
              brand fitting, an interview that runs over
    dog       Goodwin's health certificate and import permit, a walk before
              boarding, a dog-friendly hotel, the crate
    border    eAPIS, CBP at the first US airport, CANPASS, Schengen, a
              GenDec, customs hours at a small field
    city      a marathon or a parade closing roads, a state visit, rush
              hour, a bridge closure, snow on the hotel driveway
    weather   an outdoor stadium's rain plan, de-icing, a crosswind
    airport   a noise curfew, a slot, prior permission, a full FBO ramp
    aircraft  catering short of a rider item, the oven, crew duty limits
              after a long delay
    people    a guest of the principal (a fictional friend), a fictional
              family visit, a birthday in the party, a new hire's first day

  VARIETY
  The DISPATCH NOTE names a spotlight person (this sector's small human
  moment belongs to them), the cabin mood, the fans expected at the FBO, and
  the kinds of story used recently. Use the spotlight person, match the mood
  and the fans, and pick a kind that isn't in the recent list. Each city
  should feel like itself: its FBO, its roads, its weather, its crowd.
</script>
<script type="text/plain" id="tx-ledger">
CONTINUITY LEDGER
  FEATHER NET keeps the aircraft's state from one sector to the next and
  pastes it under SECTOR DATA as CONTINUITY LEDGER. It is authoritative and
  it overrides anything in the example.
  - techLog hours, cycles and msn are exactly the ledger's figures. The daily
    inspection is at today's departure station.
  - The aircraft is where the ledger says it is. If the sector departs from
    somewhere else, say so in a warn flag.
  - Every ledger tech log item that is not CLOSED appears in techLog.entries
    under the same number, in techLog.deferred if it is DEFERRED, and in
    sinceLast.carried as "TL <no>". Every OPEN or MONITOR thread appears in
    sinceLast.carried under its OPS ref. Open crew requests belong in the
    why, a sticky or a seat note until they are done.
  - Nothing fixes itself. An item only changes status through a maintenance
    action in ledgerUpdates: who did it, where, when and what. It has to be
    plausible for the ground time and the station: parts on hand, an FBO
    with a maintenance shop, or what Wes can do from his own kit. Some items
    should wait several sectors for a part.
  - A DEFERRED item carries its MEL limits into the brief (day operations
    only, no known icing, cold service only, and so on) and into the flags.
    An item past its due date must be closed before this sector or the
    aeroplane does not fly. Say so plainly.
  - An item marked AOG (a hard landing, for example) grounds the aeroplane
    until Wes's inspection closes it in ledgerUpdates.
  - Open cabin defects show up in the cabin: the rider, the crew notes, the
    why. If the oven is out, it is cold service until a maintenance entry
    clears it.
  - New tech log items take the NEXT TL NO and count up. New OPS threads take
    the NEXT OPS NO.
  - FOB is the fuel that was left in the tanks at shutdown. The fuel slip
    uplift is ramp fuel minus FOB. FEATHER NET recalculates it, so keep the
    vendor, ticket and meter start realistic.
  - The LAST SECTOR LOG is what actually happened: real off and on blocks,
    the touchdown rate, the captain's decisions and anything written up.
    Write SINCE LAST SECTOR from it. A firm or hard touchdown belongs in the
    landing trend thread.
  - The LAST SECTOR LOG also carries the crew rating out of five, from
    ESPRESSO (passed on by Elle), Neil, Tomás, Priya and Wes. A
    principalNote has to be earned: only when ESPRESSO gave the last sector
    4.5 or better, and only about something that actually happened on it.
    A low rating shows in the next brief instead: a pointed sticky from Neil
    about the timings, Tomás about the galley, a debrief line from Priya.

LEDGER UPDATES
  A top-level "ledgerUpdates" array: what changed on the ground between the
  last sector and this one. An empty array is normal.
    { "type": "maintenance", "no": "27-026", "status": "CLOSED",
      "action": "Lamp and connector replaced at Starlink Aviation. Ops check good.",
      "stn": "CYUL", "date": "12MAY27", "sign": "W.O." }
        status is CLOSED, MONITOR, DEFERRED or OPEN.
    { "type": "new", "no": "27-027", "cat": "CABIN", "defect": "...",
      "status": "OPEN", "mel": "", "due": "", "limit": "", "action": "",
      "stn": "CYUL", "date": "12MAY27", "sign": "W.O." }
        cat is CABIN, AIRFRAME, ENGINE, AVIONICS or GALLEY.
    { "type": "thread", "ref": "OPS 27-006", "status": "OPEN",
      "text": "where it stands now" }
        Use "ref": "new" with a "title", "text", "owner" and "status" to open
        a new OPS thread.
    { "type": "request", "from": "Elle", "text": "...", "status": "OPEN" }
        status DONE closes an open request with the same text.
  Whatever ledgerUpdates says must agree with techLog and sinceLast.carried.
</script>
<script type="text/plain" id="tx-companion">
FEATHER NET COMPANION
  FEATHER NET runs beside the sim on a tablet or a second screen. It plays
  the sector as messages from the people around the flight, timed to the
  sim clock, with a running day sheet and the principal's status. Write it
  as a top-level "companion" object.

  HOW THE SECTOR RUNS
    FEATHER NET keeps its own clock at sim speed. Before departure the crew
    calls three moments and the captain confirms each one once he has done
    it in the sim: APU start, engine start and taxi. Nothing scheduled after
    a call plays until he confirms it, so the sector waits for him. From the
    taxi call it runs on the clock: takeoff, top of climb, top of descent and
    landing are estimated from the taxi time, the brief's airborne time and
    any delays. On arrival the first officer calls the stand and he confirms
    on blocks. He can ask for a delay at any point (a hold, a slow taxi) and
    the times move with it. Calls can happen in any phase; there is no
    sterile period in FEATHER NET.
    When FEATHER LINK connects X-Plane, the moments are real: the crew's
    calls confirm themselves when he does them in the sim, and takeoff, the
    seatbelt sign, top of climb, top of descent and touchdown come from
    X-Plane. Anything timed after one of those waits for the real moment.

  TIMING ("at")
    Every message is timed with "at": an anchor and an offset in minutes.
      clock   when the captain starts the clock, cold and dark
      off     off blocks, the taxi call. Before departure, use a negative
              offset: "off-25" is 25 minutes before the brakes come off.
      to      takeoff
      belt    the seatbelt sign going off after takeoff (about to+8 without
              X-Plane). Cabin service belongs here.
      toc     top of climb
      tod     top of descent
      ldg     touchdown
      on      on blocks. "on-3" is on the taxi in, "on+5" after the brake
              is set.
    Examples: "clock+3", "off-20", "to+6", "toc+4", "tod+1", "ldg-12",
    "on+15". Ground calls before departure use clock or off with a negative
    offset. Spread the beats out; never two at the same minute.

  WHO TALKS TO THE FLIGHT DECK
    Only Priya, Tomás, Wes, Curtis (SHARPEST TOOL), Neil (HOUSE TOUR) and
    Ops VNY. Nobody else calls the pilots. Elle, Kiko, Simone, Margot and
    Jonah reach the flight deck through Tomás aboard ("Cap, Elle's
    asking...") or Curtis on the ground: write those as from Tomás or
    SHARPEST TOOL with "relay": "Elle". Status lives on FEATHER NET's party
    board, not in messages, so don't write "we're in the car" or "I'm
    aboard" lines; the board already shows where everyone is. A real
    sector has few calls, and each one matters.

  CHANNELS
    NET   the security radio, Curtis (SHARPEST TOOL) and sometimes Neil.
          Handhelds only work with the door open: before engine start and
          on blocks.
    ICS   the interphone from the cabin. Tomás (FEATHER 3), or Wes
          (GO GO JUICE) from the jump seat.
    OPS   datalink text from Flight Ops VNY (R. Okafor), Neil, an FBO or the
          promoter's transport desk. Short. Uppercase is fine. Any time.
    DECK  the first officer, Priya (FEATHER 2), across the flight deck. She
          makes most of the crew calls. Use her rarely otherwise.

  THE PRINCIPAL
    She never speaks. No lines, no quotes and no messages from her on any
    channel, and nobody quotes her. She is ESPRESSO on the net and "she" or
    "the principal" in crew speech. Her presence comes through her people,
    her schedule and Goodwin (MANCHILD). Keep anything about her at the level
    of tour logistics. If she is not aboard, there is no ESPRESSO traffic
    except about where she is travelling separately.

  FIELDS
    initialStatus  ESPRESSO's status when the clock starts: hotel, mobile,
                   venue, not-aboard.
    places         real places for the map, each { "name", "q", "lat",
                   "lon" }: "dep": { "airport", "fbo", "hotel" } and "arr":
                   { "airport", "fbo", "hotel", "venue" (show cities) }.
                   Coordinates to 4 decimals. "q" is what a map search would
                   find: the street address for an FBO, the full name and
                   street for a hotel. The party stays at a real five-star
                   hotel near the venue or downtown, the same one for a
                   city's whole stay. Optional "route": { "dep": [[lat,
                   lon], ...], "arr": [...] }, 5 to 12 points along the
                   real roads the cars take (hotel to FBO, FBO to hotel or
                   venue).
    ground         the cars. { "motorcade": { "leave": "off-45", "arrive":
                   "off-15", "cars": { "1": ["1", "3", "5", "K9"], "2":
                   ["2", "6", "7", "8"], "van": ["4"] } }, "arrival": {
                   "leave": "on+12", "to": "hotel" or "venue" } }. Ids are
                   manifest seats; K9 is Goodwin. ESPRESSO rides with Curtis
                   and Elle; Jonah takes the bags ahead in the van. Allow
                   for the real drive and the city's traffic at that hour:
                   FEATHER NET drives the cars along the real roads.
    doing          short lines for the party board, by seat id: { "8": [ {
                   "at": "clock", "text": "Steaming Look 6 in her room" }, {
                   "at": "belt+4", "text": "Seat 8, tacking the seam" } ] }.
                   6 to 10 lines in all, most of them for the spotlight
                   person in the dispatch note. Under 60 characters each.
                   The principal's lines stay plain ("In her suite", "On the
                   divan"): nothing private.
    daySheet       the tour day sheet for this sector's day, local times.
                   { "title", "date": "THU 13 MAY", "rows": [ { "t": "11:15",
                   "where": "dep" or "arr", "label", "who" } ] }, 6 to 10
                   rows. Use { "link": "off", "label", "who" } and
                   { "link": "on", "label", "who" } for the off and on blocks
                   rows: FEATHER NET fills those times in as the sector runs.
                   Add "moves": true to rows that move with the flight (cars
                   at the FBO, check-in). "day": 1 marks a row after local
                   midnight. Show-day rows (soundcheck, doors, stage,
                   curfew) must match showDays in the brief.
    cues           the four crew calls, each { "from", "ch", "at", "text" }:
                   "apu"     usually Priya on DECK at about "off-20".
                   "start"   usually Tomás on ICS at about "off-5", once the
                             door is closed: how many aboard, Goodwin, cabin
                             secure.
                   "taxi"    usually Priya on DECK at "off": after-start
                             checks done, the taxi clearance, ready to taxi.
                   "blocks"  usually Priya on DECK at "on": the stand or the
                             marshaller, call it when the brake is set.
                   One or two sentences that end in a plain ready call. Use
                   the brief: the runway in use, the FBO, the stand, the
                   weather, an open tech log item.
    beats          the scripted messages. 6 to 10 on a normal sector, 4 to 6
                   on a hop under 40 minutes, thinly spread on a long one.
                   { "id", "at", "ch", "from" (callsign or first name),
                   "text", "status" (optional: ESPRESSO's status after this
                   message: hotel, mobile, planeside, aboard, airborne,
                   landed, venue, hotel-arr) }. FEATHER NET moves her to
                   aboard at engine start, airborne at takeoff and landed at
                   touchdown on its own.
                   One or two short sentences each, the way people really
                   talk on a radio or an interphone. Use the brief's own
                   material: the sticky, the seat notes, the fan alert, the
                   open tech log items, the rider. Quiet is realistic. Don't
                   repeat what a cue says.
    touchdown      one cabin reaction per band, each { "from", "ch", "text" }:
                   smooth (under 150 fpm), normal (150 to 300), firm (300 to
                   600), hard (600 and over: about the cabin only, the
                   write-up happens on its own).
    events         sealed surprises, shown only when they fire. Write one only
                   when the dispatch note asks for a sealed event. Otherwise
                   an empty array.
                   { "id", "at", "ch", "from", "title", "text",
                   "hold" (true when nothing else should happen until the
                   captain answers: a held motorcade, a slot that moves, a
                   question that changes the departure. Usually before
                   departure; leave it false in flight),
                   "options": 2 or 3 of { "id", "label" (what the captain
                   says or does, under 40 characters), "reply" (the other
                   party's answer), "outcome" (one line for the log),
                   "delayMin" (optional: how far it moves the departure, or
                   after takeoff the arrival; + later, - earlier),
                   "score" (-2 to 2: how her people will feel about this
                   answer when they rate the sector. The answer that serves
                   her day scores 1 or 2. A sound refusal with a good reason
                   is 0, not negative), "ledger" (optional, see below),
                   "check" (optional, see below) },
                   "default": the option id used if the captain never
                   answers, "cat": the kind of story, from the list in
                   STORY DESK }.
                   ledger is one of { "tech": { "cat", "defect", "status" } },
                   { "thread": { "title", "text", "owner", "status" } } or
                   { "request": { "from", "text" } }. It is written into the
                   continuity ledger when the sector closes.
                   check turns the captain's actual timing into the outcome:
                   { "when": "off" or "on", "by": "13:10", "where": "dep" or
                   "arr", "pass": { "from", "ch", "text" },
                   "fail": { "from", "ch", "text" } }. FEATHER NET compares
                   the time he confirmed taxi (off) or on blocks (on) with
                   "by". Make "by" reachable if he takes the option and flies
                   the plan, and missable if he dawdles or adds a delay.
                   An event must fit the brief: its times, airports, the
                   people aboard and the open items. It must be something the
                   flight deck can answer. Before departure it is usually
                   about the schedule (the departure pushed back or brought
                   forward because of her day, the motorcade, a late case, a
                   slot); in flight it is a request or a change at the other
                   end; on the ground it is cars, fans, customs or a snag.
                   Never an emergency, never a medical problem for the
                   principal, never a threat to anyone.

  THE CREW RATING
    When the brake is set, ESPRESSO (through Elle), Neil, Tomás, Priya and Wes
    (whoever is aboard) rate the sector out of five. FEATHER NET works the
    stars out itself from the touchdown, the on-blocks time against the day
    sheet, how quickly the captain answered the crew's calls, any delays he
    asked for, and the scores on the decisions. That is why the scores have
    to be honest.
</script>

  // Confirmation points. A crew member calls each one and the sector holds there until the captain confirms it.
  const STEPS = [

  // Where the flight is, worked out from the clock and the confirmations.
  const STAGES = [
    { id: 'pre', short: 'PRE', label: 'Preflight' },
    { id: 'apu', short: 'APU', label: 'APU running' },
    { id: 'start', short: 'ENG', label: 'Engines running' },

  // Older companions timed messages by phase. This maps them onto the clock anchors.
  const OLD_PHASE_AT = { preflight: ['clock', 0], boarding: ['off', -15], taxi: ['off', 0], takeoff: ['to', 0], climb: ['to', 5], cruise: ['toc', 0], descent: ['tod', 0], approach: ['ldg', -8], landed: ['ldg', 0], blocks: ['on', 0], post: ['on', 10] };

  const STATUS = {
    hotel: 'At the hotel', mobile: 'Mobile to the airport', planeside: 'Planeside', aboard: 'Aboard',
    airborne: 'Airborne', landed: 'On the ground', 'hotel-arr': 'Mobile to the hotel',
