  // ════════════════════════════════════════════════════════════════
  // Flight engine. Everything runs on the sim clock. The crew calls APU start,
  // engine start and taxi, and the sector holds at each call until the captain
  // confirms it. From the taxi call, takeoff, climb, descent and landing follow
  // the plan. Priya calls the stand and the captain confirms on blocks.
  // ════════════════════════════════════════════════════════════════
  function simNow(f) { if (!f || !f.clock) return null; const c = f.clock; return c.running ? c.sim + (Date.now() - c.real) : c.sim; }
  function flightRunning() { const s = App.sector; const f = s && s.flight; return !!(f && f.clock && s.status !== 'flown'); }
  function cfOf(f) { return (f && f.cf) || {}; }
  function nextStep(f) { const cf = cfOf(f); return STEPS.find(p => cf[p.id] == null) || null; }
  function channelFor(p, stage, b) {
    if (!p) return 'ICS';
    if (p.id === 'OPS') return 'OPS';
    if (p.id === 'SIC') return 'DECK';
    if (p.id === 'CAB' || p.id === '9') return 'ICS';
    if (b && !aboardList(b).includes(Number(p.id))) return 'OPS';
    // handhelds only work with the door open: before engine start and on blocks
    const ground = ['pre', 'apu', 'blocks'].includes(stage || 'pre');
    return ground ? 'NET' : 'ICS';
  }
  function pendingEventFor(sector, p) {
    const f = sector.flight || {};
    const evs = (sector.companion && sector.companion.events) || [];
    return evs.find(e => (f.delivered || []).includes('e:' + e.id) && !(f.decisions || {})[e.id] && (!p || person(e.from) === p)) || null;
  }

  // Planned and estimated times for the sector, in sim milliseconds.
  function timeline(s) {
    const b = s.brief, f = s.flight || {};
    const T = briefTimes(b);
    const cf = cfOf(f);
    const dl = (f.delays || []).slice().sort((a, c) => num(a.sim) - num(c.sim));
    const sum = seg => dl.filter(d => d.seg === seg).reduce((a, d) => a + num(d.min), 0);
    const air = Math.max(10, T.airMin || 0);
    const ground = Math.max(6, (T.blockMin || 0) - air);
    const taxiOut = Math.max(4, Math.round(ground * 0.6));
    const taxiIn = Math.max(3, ground - taxiOut);
    const climb = clampN(Math.round(air * 0.3), 5, 22);
    const desc = clampN(Math.round(air * 0.35), 8, 26);
    const clock = f.clockStart != null ? f.clockStart : (T.clockT != null ? T.clockT : Date.now());
    const base = T.off != null ? T.off : clock + 30 * MIN;
    const offPlan = base + sum('dep') * MIN;
    const off = cf.taxi != null ? cf.taxi : offPlan;
    const act = f.act || {};
    const live = Link.liveFor(s);
    const to = act.to != null ? act.to : off + Math.max(2, taxiOut + sum('taxi')) * MIN;
    const eta = live && act.to != null && act.ldg == null && Link.eta && Link.etaFor === s.ref ? Link.eta : null;
    const ldg = act.ldg != null ? act.ldg : eta != null ? eta : to + Math.max(10, air + sum('air')) * MIN;
    // a delay asked for in the cruise moves the top of descent; one asked for in the descent is a hold
    let tod;
    if (act.tod != null) tod = act.tod;
    else if (eta != null) tod = Math.max(to + 3 * MIN, ldg - desc * MIN);
    else {
      tod = to + (air - desc) * MIN;
      dl.filter(d => d.seg === 'air').forEach(d => { if (num(d.sim) < tod) tod += num(d.min) * MIN; });
      tod = Math.max(to + 3 * MIN, Math.min(tod, ldg - 3 * MIN));
    }
    const toc = act.toc != null ? act.toc : Math.min(to + climb * MIN, tod);
    const app = act.app != null ? act.app : Math.max(tod, ldg - 8 * MIN);
    // the seatbelt sign going off; live, it waits for the real switch (or the cruise)
    const belt = act.belt != null ? act.belt : live ? (act.toc != null ? act.toc + 5 * MIN : null) : to + 8 * MIN;
    const onEst = ldg + Math.max(2, taxiIn + sum('in')) * MIN;
    const on = cf.blocks != null ? cf.blocks : onEst;
    return { T, cf, act, live, clock, offPlan, off, to, belt, toc, tod, app, ldg, onEst, on, taxiOut, taxiIn };
  }
  function stageOf(s, now, tl) {
    const f = s.flight || {}, cf = cfOf(f);
    if (cf.blocks != null) return 'blocks';
    if (cf.apu == null) return 'pre';
    if (cf.start == null) return 'apu';
    if (cf.taxi == null) return 'start';
    tl = tl || timeline(s);
    if (now == null) now = simNow(f);
    // with X-Plane live only real moments move the flight on; otherwise the clock does
    const act = tl.act || {};
    const passed = k => act[k] != null || (!tl.live && now >= tl[k]);
    if (passed('ldg')) return 'landed';
    if (passed('app')) return 'approach';
    if (passed('tod')) return 'descent';
    if (passed('toc')) return 'cruise';
    if (passed('to')) return 'climb';
    return 'taxi';
  }
  // ESPRESSO's status: what the net last said, moved on by the flight itself.
  function curStatus(s, now, tl) {
    const f = s.flight || {}, b = s.brief;
    const stored = f.status || (principalAboard(b) ? 'hotel' : 'not-aboard');
    if (!principalAboard(b) || !f.clock) return stored;
    const cf = cfOf(f);
    if (s.companion && s.companion.ground) {
      tl = tl || timeline(s);
      if (now == null) now = simNow(f);
      const plan = groundPlan(s, tl);
      const w = whereIs(s, '1', now, tl, plan, stageOf(s, now, tl));
      const act = tl.act || {};
      const air = act.to != null || (!tl.live && cf.taxi != null && now >= tl.to);
      const down = act.ldg != null || (!tl.live && cf.taxi != null && now >= tl.ldg) || cf.blocks != null;
      const map = { hotel: 'hotel', car: 'mobile', fbo: 'planeside', aircraft: down ? 'landed' : air ? 'airborne' : 'aboard', 'arr-fbo': 'landed', 'arr-car': plan.arrTo === 'venue' ? 'mobile-venue' : 'hotel-arr', 'arr-hotel': 'hotel', venue: 'venue' };
      if (map[w.key]) return map[w.key];
    }
    let auto = null;
    if (cf.start != null) auto = 'aboard';
    if (cf.taxi != null) {
      tl = tl || timeline(s);
      if (now == null) now = simNow(f);
      const act = tl.act || {};
      if (act.to != null || (!tl.live && now >= tl.to)) auto = 'airborne';
      if (act.ldg != null || (!tl.live && now >= tl.ldg) || cf.blocks != null) auto = 'landed';
    }
    return STATUS_ORDER.indexOf(auto) > STATUS_ORDER.indexOf(stored) ? auto : stored;
  }
  function segNow(s, now, tl) {
    const cf = cfOf(s.flight);
    if (cf.blocks != null) return null;
    if (cf.taxi == null) return 'dep';
    if (now < tl.to) return 'taxi';
    if (now < tl.ldg) return 'air';
    return 'in';
  }

  function cueOf(s, id) { const c = s.companion && s.companion.cues && s.companion.cues[id]; return c || cueDefaults(s.brief)[id]; }
  // When the crew makes a call: its time on the plan, never sooner than a couple of minutes after the step before it.
  function cueDue(s, tl, id) {
    const cf = cfOf(s.flight);
    const p = parseAt(cueOf(s, id).at) || parseAt(CUE_AT[id]);
    let t;
    if (id === 'blocks') {
      // live, Priya only calls the stand once X-Plane has seen the landing
      if (tl.live && (tl.act || {}).ldg == null) return Infinity;
      t = Math.max((p.a === 'ldg' ? tl.ldg : tl.onEst) + p.n * MIN, tl.ldg + MIN);
    }
    else t = (p.a === 'clock' ? tl.clock : tl.offPlan) + p.n * MIN;
    const i = STEP_IDX[id];
    if (i > 0 && cf[STEPS[i - 1].id] != null) t = Math.max(t, cf[STEPS[i - 1].id] + STEPS[i].gapMin * MIN);
    return t;
  }
  // When a scheduled message is due. Null means it can't be placed yet: it waits for taxi or for on blocks.
  function dueAt(p, tl, cf) {
    switch (p.a) {
      case 'clock': return tl.clock + p.n * MIN;
      case 'off': return p.n <= 0 ? tl.offPlan + p.n * MIN : (cf.taxi != null ? cf.taxi + p.n * MIN : null);
      case 'to': case 'toc': case 'tod': case 'ldg':
        if (cf.taxi == null) return null;
        // live, anything after a moment waits for X-Plane to report it; lead-ins use the estimate
        if (tl.live && p.n >= 0 && (tl.act || {})[p.a] == null) return null;
        return tl[p.a] + p.n * MIN;
      case 'belt': return cf.taxi != null && tl.belt != null ? tl.belt + p.n * MIN : null;
      case 'on': return p.n < 0 ? (cf.taxi != null ? tl.onEst + p.n * MIN : null) : (cf.blocks != null ? cf.blocks + p.n * MIN : null);
      default: return null;
    }
  }
  // A ground call that never played before the brakes came off, or an airborne one before the brake was set, is dropped.
  function stale(p, due, cf) {
    if (cf.blocks != null) return !((p.a === 'on' && p.n >= 0) || (p.a === 'clock' && due >= cf.blocks));
    if (cf.taxi != null) return (p.a === 'off' && p.n <= 0) || (p.a === 'clock' && due < cf.taxi);
    return false;
  }
  // What can play now, and how much is waiting on the captain.
  function scan(s) {
    const f = s.flight;
    const tl = timeline(s);
    if (!f || !f.clock) return { ready: [], held: 0, tl, now: null, nx: null, holdBy: null };
    const now = simNow(f);
    const cf = cfOf(f);
    const c = s.companion || {};
    const done = new Set(f.delivered || []);
    const sent = f.sentAt || {};
    const nx = nextStep(f);
    // a call the captain hasn't confirmed holds everything scheduled after it
    const stepGate = nx && nx.id !== 'blocks' ? cueDue(s, tl, nx.id) : Infinity;
    // so does an unanswered question that holds the flight
    let eventGate = Infinity, holdBy = null;
    (c.events || []).forEach(e => {
      const at = sent['e:' + e.id];
      if (!e.hold || at == null || (f.decisions || {})[e.id]) return;
      // everything scheduled after the question waits, even if the question itself played late
      const p = parseAt(e.at), d = p ? dueAt(p, tl, cf) : null;
      const g = d != null ? Math.min(d, at) : at;
      if (g < eventGate) { eventGate = g; holdBy = e; }
    });
    const gate = Math.min(stepGate, eventGate);
    const ready = [];
    let held = 0;
    const consider = (key, it) => {
      if (done.has(key)) return;
      const p = parseAt(it.at); if (!p) return;
      const due = dueAt(p, tl, cf);
      if (due == null || due > now || stale(p, due, cf)) return;
      if (due > gate) { held++; return; }
      ready.push(Object.assign({ key, due, ord: 0 }, it));
    };
    (c.beats || []).forEach(b => consider('b:' + b.id, Object.assign({ kind: 'beat' }, b)));
    (c.events || []).forEach(e => consider('e:' + e.id, Object.assign({ kind: 'event', eventId: e.id }, e)));
    if (nx && !done.has('q:' + nx.id)) {
      const due = cueDue(s, tl, nx.id);
      if (due <= now) { if (due <= eventGate) ready.push(Object.assign({ key: 'q:' + nx.id, due, ord: 1, kind: 'cue', step: nx.id }, cueOf(s, nx.id))); else held++; }
    }
    (f.queue || []).forEach(q => { if (!done.has(q.key) && num(q.due) <= now) ready.push(Object.assign({ ord: 0 }, q)); });
    ready.sort((a, b) => a.due - b.due || a.ord - b.ord);
    return { ready, held, tl, now, nx, holdBy: eventGate < Infinity && eventGate <= stepGate ? holdBy : null };
  }

  function startFlight(atLocal) {
    const s = App.sector; if (!s) return;
    const T = briefTimes(s.brief);
    let start = T.clockT != null ? T.clockT : Date.now();
    if (atLocal && /^\d{1,2}:\d{2}$/.test(atLocal) && T.off != null) {
      const p = atLocal.split(':').map(Number);
      start = localMidnight(T.off, T.fo) + (p[0] * 60 + p[1]) * MIN;
      if (start > T.off + 6 * 3600000) start -= 86400000;
    } else if (Link.state === 'live' && Link.snap && Link.snap.sim && typeof Link.snap.sim.zuluSec === 'number' && T.off != null) {
      const simT = dayResolve(Link.snap.sim.zuluSec, T.off);
      if (Math.abs(simT - T.off) < 8 * 3600000) start = simT;
    }
    Sound.ensure(); Voice.unlock(); keepAwake(true);
    App.undo = null; App.ui.early = null; App.ui.forms.debrief = null; App.ui.sig = null;
    saveSector(x => {
      x.status = 'flying';
      x.flight = { v: 2, clock: { sim: start, real: Date.now(), running: true }, clockStart: start, cf: {}, act: {}, sentAt: {}, delivered: [], feed: [], decisions: {}, checks: [], effects: [], queue: [], delays: [], status: (x.companion && x.companion.initialStatus) || (principalAboard(x.brief) ? 'hotel' : 'not-aboard'), startedAt: Date.now(), simOn: true };
    });
    App.lastDelivery = 0;
  }

  // The captain confirms a crew call once it's done in the sim.
  function confirmStep(id, opts = {}) {
    const s = App.sector; if (!s || !s.flight || s.status === 'flown') return;
    const nx = nextStep(s.flight); if (!nx || nx.id !== id) return;
    Sound.ensure(); Voice.unlock();
    App.ui.early = null;
    const cue = cueOf(s, id);
    const bySim = opts.by === 'sim';
    saveSector(x => {
      const g = x.flight; const now = simNow(g);
      const at = opts.at != null && isFinite(opts.at) ? Math.min(opts.at, now) : now;
      g.cf = g.cf || {};
      if (g.cf[id] != null) return;
      g.cf[id] = at;
      g.cfBy = Object.assign({}, g.cfBy || {}, { [id]: bySim ? 'sim' : 'you' });
      g.feed.unshift(bySim ? { id: 'cf:' + id, kind: 'beat', src: 'sim', ch: 'DECK', from: 'Priya', text: opts.text || SIM_SAID[id], sim: at, step: id } : { id: 'cf:' + id, kind: 'pilot', ch: cue.ch, from: 'FEATHER 1', text: opts.text || nx.said, sim: at, step: id });
      if (g.feed.length > 160) g.feed.length = 160;
      const when = id === 'taxi' ? 'off' : id === 'blocks' ? 'on' : null;
      if (when) (g.checks || []).filter(c => c.when === when && !c.done).forEach(c => evalCheck(x, c, at));
      if (id === 'blocks' && opts.ended) g.ended = at;
      if (id === 'blocks' && opts.fuel != null && isFinite(opts.fuel)) g.simFuel = Math.round(opts.fuel);
    });
    if (!bySim) {
      App.undo = { at: Date.now(), step: id };
      clearTimeout(confirmStep.t);
      confirmStep.t = setTimeout(() => { if (App.undo && Date.now() - App.undo.at >= 19500) { App.undo = null; renderKey(); } }, 20000);
    }
    if (bySim) Sound.play('DECK');
    if (id === 'blocks') { Voice.stop(); maybeRate(); }
  }
  function undoStep() {
    const s = App.sector; if (!s || !s.flight || !App.undo || Date.now() - App.undo.at > 20000) return;
    const id = App.undo.step;
    saveSector(x => {
      const g = x.flight; const cf = cfOf(g);
      const last = STEPS.slice().reverse().find(p => cf[p.id] != null);
      if (!last || last.id !== id) return;
      delete g.cf[id];
      g.feed = (g.feed || []).filter(e => e.id !== 'cf:' + id);
      const when = id === 'taxi' ? 'off' : id === 'blocks' ? 'on' : null;
      if (when) (g.checks || []).forEach(c => { if (c.when === when && c.done) { c.done = false; delete c.ok; g.queue = (g.queue || []).filter(q => q.key !== 'c:' + c.eventId || (g.delivered || []).includes(q.key)); } });
      if (id === 'blocks') { delete g.rating; delete g.ended; }
    });
    App.undo = null;
    renderKey();
  }

  // Holding or running late: before taxi it moves the departure, after it the arrival.
  function requestDelay(min, opts = {}) {
    const s = App.sector; if (!s || !s.flight || s.status === 'flown') return;
    min = Math.round(num(min)); if (!min) return;
    const tl0 = timeline(s), now0 = simNow(s.flight);
    const seg = segNow(s, now0, tl0); if (!seg) return;
    const stage = stageOf(s, now0, tl0);
    const ab = aboardList(s.brief);
    const T = tl0.T;
    const words = Math.abs(min) + ' minute' + (Math.abs(min) === 1 ? '' : 's');
    saveSector(x => {
      const g = x.flight; const now = simNow(g);
      g.delays = g.delays || [];
      g.delays.push({ min, seg, by: opts.by || 'captain', sim: now, why: String(opts.why || '') });
      if (opts.quiet) return;
      const doorOpen = seg === 'dep' && (stage === 'pre' || stage === 'apu');
      g.feed.unshift({ id: 'me:' + Date.now(), kind: 'pilot', ch: doorOpen ? 'NET' : 'ICS', from: 'FEATHER 1', text: seg === 'dep' ? 'We need another ' + words + ' before we go.' : 'We’re running about ' + words + ' late.', sim: now });
      const tl = timeline(x);
      let ack;
      if (doorOpen) ack = ab.includes(2) ? { from: 'HOUSE TOUR', ch: 'NET', text: 'HOUSE TOUR copies. Off blocks now ' + hhmm(tl.offPlan, T.fo) + '. I’ll let the party know.' } : { from: 'OPS VNY', ch: 'OPS', text: 'COPY. REVISED OFF BLOCKS ' + hhmm(tl.offPlan, T.fo).replace(':', '') + 'L. RGDS OKAFOR' };
      else if (seg === 'dep') ack = { from: 'Tomás', ch: 'ICS', text: 'Copy, another ' + words + '. I’ll tell the cabin.' };
      else ack = { from: 'Tomás', ch: 'ICS', text: 'Copy, ' + words + ' late. I’ll let ' + (ab.includes(2) ? 'Neil' : 'the cabin') + ' know. On blocks about ' + hhmm(tl.onEst, T.too) + ' now.' };
      g.queue = g.queue || [];
      g.queue.push({ key: 'ack:' + Date.now().toString(36), kind: 'beat', ch: ack.ch, from: ack.from, text: ack.text, due: now + 5000 });
    });
    if (!opts.quiet) toast((seg === 'dep' ? 'Departure held ' : 'Arrival moved back ') + words + '.');
  }

  function restartFlight() {
    const s = App.sector; if (!s || s.status === 'flown') return;
    Voice.stop(); keepAwake(false);
    App.undo = null; App.ui.early = null; App.ui.forms.debrief = null; App.ui.sig = null; App.ui.clockSet = false;
    saveSector(x => { delete x.flight; x.status = 'released'; });
    toast(s.ref + ' is back at the start. Set up the sim and start the clock again.');
  }
  function endFlight() {
    const s = App.sector; if (!s || !s.flight) return;
    const cf = cfOf(s.flight);
    if (cf.blocks != null) return;
    if (cf.taxi == null) {
      App.ui.modal = { kind: 'confirm', title: s.ref + ' hasn’t left the stand', text: 'There’s no flight to end yet. Restart the sector instead? The clock, the calls and any decisions are wiped. The ledger isn’t touched.', yes: 'Restart ' + s.ref, danger: true, run: restartFlight };
    } else {
      const T = briefTimes(s.brief);
      App.ui.modal = { kind: 'confirm', title: 'End ' + s.ref + ' here?', text: 'FEATHER NET puts you on blocks at ' + hhmm(simNow(s.flight), T.too) + ' and goes straight to the crew rating and the debrief. Use it if the sim crashed or you’re stopping early.', yes: 'End the flight', danger: true, run: () => confirmStep('blocks', { ended: true, text: 'Ending the flight here.' }) };
    }
    render();
  }

  // A check turns the captain's actual timing into the outcome of a decision.
  function evalCheck(x, c, at) {
    const g = x.flight;
    c.done = true;
    const T = briefTimes(x.brief);
    const base = c.where === 'dep' ? localMidnight(T.off, T.fo) : localMidnight(T.on, T.too);
    const pp = String(c.by).split(':').map(Number);
    const by = base + ((pp[0] || 0) * 60 + (pp[1] || 0)) * MIN + num(c.day) * 86400000;
    const ok = at < by + MIN;
    c.ok = ok; c.evalAt = at;
    const m = ok ? c.pass : c.fail;
    g.queue = g.queue || [];
    if (m && m.text) g.queue.push({ key: 'c:' + c.eventId, kind: 'check', ch: chOf(m.ch), from: String(m.from || ''), relay: m.relay, text: String(m.text), due: at + 20000, pass: ok });
  }

  function deliver(it) {
    const p = person(it.from);
    saveSector(x => {
      const g = x.flight;
      if (g.delivered.includes(it.key)) return;
      const now = simNow(g);
      g.delivered.push(it.key);
      g.sentAt = g.sentAt || {};
      g.sentAt[it.key] = now;
      g.feed.unshift({ id: it.key, kind: it.kind, ch: it.ch, from: it.from, relay: it.relay || undefined, title: it.title || '', text: it.text, sim: now, eventId: it.eventId || null, step: it.step || null, pass: it.pass });
      if (g.feed.length > 160) g.feed.length = 160;
      if (it.status) g.status = it.status;
    }, { bg: true });
    App.lastDelivery = Date.now();
    Sound.play(it.kind === 'event' ? 'ALERT' : it.kind === 'cue' && it.ch !== 'ICS' ? 'CUE' : it.ch);
    setTimeout(() => Voice.say(it.text, p, it.ch), it.kind === 'event' ? 650 : it.ch === 'ICS' ? 1150 : 320);
  }

  function choose(eventId, optId, custom) {
    const s = App.sector; if (!s || !s.flight) return;
    const ev = ((s.companion && s.companion.events) || []).find(e => e.id === eventId); if (!ev) return;
    const opt = custom || ev.options.find(o => o.id === optId); if (!opt) return;
    const p = person(ev.from);
    saveSector(x => {
      const g = x.flight;
      if (g.decisions[eventId]) return;
      const now = simNow(g);
      g.decisions[eventId] = { opt: custom ? 'custom' : opt.id, label: opt.label, outcome: opt.outcome || '', title: ev.title, sim: now, score: num(opt.score), from: ev.from };
      g.feed.unshift({ id: 'pilot:' + eventId, kind: 'pilot', ch: ev.ch, from: 'FEATHER 1', text: opt.label, sim: now });
      if (opt.reply) g.feed.unshift({ id: 'reply:' + eventId, kind: 'reply', ch: ev.ch, from: ev.from, relay: ev.relay || undefined, text: opt.reply, sim: now + 1000, eventId });
      const d = Math.round(num(opt.delayMin));
      if (d) { const seg = segNow(x, now, timeline(x)); if (seg) { g.delays = g.delays || []; g.delays.push({ min: d, seg, by: 'event', sim: now, why: ev.title }); } }
      if (opt.ledger) g.effects.push({ from: eventId, ledger: opt.ledger });
      if (opt.check) {
        const c = Object.assign({ eventId }, clone(opt.check));
        g.checks.push(c);
        const at = cfOf(g)[c.when === 'off' ? 'taxi' : 'blocks'];
        if (at != null) evalCheck(x, c, at);
      }
    });
    if (opt.reply) { Sound.play(ev.ch); setTimeout(() => Voice.say(opt.reply, p, ev.ch), 500); }
  }

  async function sendChat() {
    const s = App.sector; if (!s || !s.flight) return;
    const text = (App.ui.composer.text || '').trim(); if (!text) return;
    const p = personById(App.ui.composer.to) || personById('CAB');
    const ch = channelFor(p, stageOf(s), s.brief);
    App.ui.composer.text = '';
    App.ui.composer.busy = true;
    saveSector(x => { x.flight.feed.unshift({ id: 'me:' + Date.now(), kind: 'pilot', ch, from: 'FEATHER 1', text: (ch === 'NET' ? p.call + ', FEATHER 1. ' : '') + text, sim: simNow(x.flight) }); });
    const pending = pendingEventFor(App.sector, p);
    try {
      const r = await AI.json(chatPrompt(p, text, App.sector), { modelTier: 'quick', cache: false });
      const reply = r && typeof r.text === 'string' ? r.text.trim() : '';
      if (reply) {
        saveSector(x => { x.flight.feed.unshift({ id: 'ai:' + Date.now(), kind: 'reply', ch, from: ch === 'NET' ? p.call : p.first, text: reply, sim: simNow(x.flight) }); });
        Sound.play(ch); setTimeout(() => Voice.say(reply, p, ch), 400);
      }
      const dm = clampN(Math.round(num(r && r.delayMin)), -30, 60);
      if (pending && r && r.resolve) {
        const opt = pending.options.find(o => o.id === r.resolve);
        if (opt) choose(pending.id, opt.id);
        else choose(pending.id, null, { label: text, reply: '', outcome: String(r.outcome || 'Captain’s call: ' + text), delayMin: dm, score: 0 });
      } else if (dm) requestDelay(dm, { quiet: true, why: text });
    } catch (e) {
      if (e && e.code !== 'cancelled') toast(AI.err(e));
    } finally { App.ui.composer.busy = false; render(); }
  }

  function submitTouchdown(v, opts = {}) {
    const fpm = Math.round(Math.abs(num(v, NaN)));
    if (!isFinite(fpm) || fpm <= 0 || fpm > 3000) { toast('Enter the touchdown rate in feet per minute, for example 140.'); return; }
    const s = App.sector; if (!s || !s.flight) return;
    const bd = band(fpm);
    const r = (s.companion && s.companion.touchdown && s.companion.touchdown[bd]) || { from: 'Tomás', ch: 'ICS', text: 'Nice one.' };
    const wes = aboardList(s.brief).includes(9);
    saveSector(x => {
      const g = x.flight; const now = opts.at != null && isFinite(opts.at) ? opts.at : simNow(g);
      const prev = g.touchdown ? g.touchdown.band : null;
      g.touchdown = { fpm, band: bd, sim: now, g: opts.g != null ? num(opts.g) : null, by: opts.by === 'sim' ? 'sim' : 'you' };
      delete g.tdSkip;
      const stamp = Date.now().toString(36);
      g.queue = (g.queue || []).filter(q => !/^td/.test(q.key) || (g.delivered || []).includes(q.key));
      if (prev !== bd) g.queue.push({ key: 'td:' + stamp, kind: 'beat', ch: r.ch, from: r.from, relay: r.relay, text: r.text, due: now + 25000 });
      g.effects = (g.effects || []).filter(e => e.from !== 'hard-landing');
      if (bd === 'hard') {
        g.effects.push({ from: 'hard-landing', ledger: { tech: { cat: 'AIRFRAME', defect: 'Hard landing reported at ' + x.brief.to.icao + ', ' + fpm + ' fpm.', status: 'OPEN', aog: true, limit: 'AOG. Hard landing inspection (AMM 05-51) required before further flight.' } } });
        if (prev !== 'hard') g.queue.push({ key: 'tdops:' + stamp, kind: 'beat', ch: wes ? 'ICS' : 'OPS', from: wes ? 'Wes' : 'OPS VNY', text: wes ? 'That’s one for the book, Cap. Nobody goes anywhere until I’ve looked at the gear.' : 'HARD LANDING NOTED ' + fpm + ' FPM. TECH LOG ENTRY REQUIRED. INSPECTION BEFORE NEXT FLIGHT. RGDS OKAFOR', due: now + 70000 });
      }
      delete g.rating;
    });
    toast((opts.by === 'sim' ? 'Touchdown from X-Plane: ' + fpm + ' fpm' + (opts.g ? ', ' + num(opts.g).toFixed(2) + ' g' : '') + '. ' : fpm + ' fpm logged. ') + ({ smooth: 'Smooth.', normal: 'Normal.', firm: 'Firm, added to the landing trend.', hard: 'Hard landing. A tech log entry will be raised at debrief.' })[bd]);
    maybeRate();
  }
  function skipTouchdown() {
    if (!App.sector || !App.sector.flight) return;
    saveSector(x => { x.flight.tdSkip = true; });
    maybeRate();
  }

  function clockCmd(cmd, arg) {
    const s0 = App.sector;
    const air = s0 && s0.flight ? STAGE_IDX[stageOf(s0)] >= STAGE_IDX.climb : false;
    if (cmd === 'pause') Voice.stop();
    saveSector(x => {
      const g = x.flight; if (!g || !g.clock) return;
      const now = simNow(g);
      if (cmd === 'pause') g.clock = { sim: now, real: Date.now(), running: false };
      else if (cmd === 'run') g.clock = { sim: g.clock.sim, real: Date.now(), running: true };
      else if (cmd === 'nudge') g.clock = { sim: now + num(arg) * MIN, real: Date.now(), running: g.clock.running };
      else if (cmd === 'set' && /^\d{1,2}:\d{2}$/.test(arg)) {
        const T = briefTimes(x.brief);
        const off = air ? T.too : T.fo;
        const mid = localMidnight(now, off);
        const p = arg.split(':').map(Number);
        let t = mid + (p[0] * 60 + p[1]) * MIN;
        if (t - now > 12 * 3600000) t -= 86400000; else if (now - t > 12 * 3600000) t += 86400000;
        g.clock = { sim: t, real: Date.now(), running: g.clock.running };
      }
    });
  }

  // ════════════════════════════════════════════════════════════════
  // Crew rating, worked out in the page so the stars are earned
  // ════════════════════════════════════════════════════════════════
  const RATERS = [
    { id: 'espresso', name: 'ESPRESSO', p: '1' },
    { id: 'neil', name: 'Neil', p: '2' },
    { id: 'tomas', name: 'Tomás', p: 'CAB' },
    { id: 'priya', name: 'Priya', p: 'SIC' },
    { id: 'wes', name: 'Wes', p: '9' }
  ];
  const RATE_LINES = {
    espresso: ['She was asleep before the gear came up and still asleep on the stand. That’s a five from the back.', 'Happy enough back there. A quiet ride and nothing she’ll remember, which is the point.', 'She noticed that one. Not cross, just noticed.', 'She’s fine, but it wasn’t the day she wanted. Let’s make the next one boring.'],
    neil: ['Right on the day sheet. That’s how I like it.', 'Close enough to the plan. The cars waited and nobody minded.', 'We lost some time on that one. I’ve had to shuffle the afternoon.', 'That’s put the whole afternoon out. We need to talk about timings.'],
    tomas: ['Not a drop spilled. Cabin’s happy, Cap.', 'Good ride. The galley’s still in one piece.', 'Bit of a mess in the galley, nothing I can’t fix.', 'Cups everywhere. Everyone’s fine, but I’ll be cleaning for a while.'],
    priya: ['Tidy from start to shutdown. Nice flying, Hunter.', 'Solid sector. A couple of things to talk about over coffee.', 'We got there. Let’s debrief that one properly.', 'That needs a proper debrief before we fly again.'],

  function templateLine(r) { const i = r.stars >= 4.5 ? 0 : r.stars >= 3.5 ? 1 : r.stars >= 2.5 ? 2 : 3; return RATE_LINES[r.id][i]; }
  function raterOf(from) { const p = person(from); const r = p ? RATERS.find(x => x.p === p.id) : null; return r ? r.id : null; }
  function computeRating(s) {
    const b = s.brief, f = s.flight || {}, cf = cfOf(f);
    const tl = timeline(s), T = tl.T;
    const ab = aboardList(b);
    const list = RATERS.filter(r => r.p === 'CAB' || r.p === 'SIC' || ab.includes(Number(r.p)));
    const sc = {};
    list.forEach(r => { sc[r.id] = 4.5; });
    const add = (id, v) => { if (sc[id] != null && v) sc[id] += v; };
    const facts = [];
    // the touchdown
    const td = f.touchdown;
    if (td) {
      const k = { smooth: 0.5, normal: 0.1, firm: -0.8, hard: -2.2 }[td.band] || 0;
      facts.push({ t: td.band.charAt(0).toUpperCase() + td.band.slice(1) + ' touchdown, ' + td.fpm + ' fpm', v: k });
      add('espresso', k); add('neil', k * 0.5); add('tomas', k * 1.2); add('priya', k * 0.8);
      add('wes', { smooth: 0.2, normal: 0.2, firm: -0.5, hard: -2.5 }[td.band]);
    } else facts.push({ t: 'No touchdown rate logged', v: 0 });
    // timing against the day sheet; the party's own changes don't count against the crew
    const partyShift = (f.delays || []).filter(d => d.by === 'event').reduce((a, d) => a + num(d.min), 0);
    const mine = (f.delays || []).filter(d => d.by !== 'event');
    const endedEarly = f.ended != null && f.ended < tl.ldg;
    if (T.on != null && cf.blocks != null && !endedEarly) {
      const late = Math.round((cf.blocks - (T.on + partyShift * MIN)) / MIN);
      const when = 'On blocks ' + hhmm(cf.blocks, T.too);
      if (late >= -5 && late <= 5) { add('neil', 0.3); add('espresso', 0.1); facts.push({ t: when + ', on time', v: 0.3 }); }
      else if (late < -5) { add('neil', 0.2); facts.push({ t: when + ', ' + (-late) + ' min early', v: 0.2 }); }
      else {
        const pen = Math.min(1.5, 0.3 * Math.ceil((late - 5) / 5));
        add('neil', -pen); add('espresso', -0.6 * pen);

        facts.push({ t: when + ', ' + late + ' min late', v: -pen });
      }
    }
    if (endedEarly) facts.push({ t: 'Flight ended early', v: 0 });
    if (mine.length) {
      const tot = mine.reduce((a, d) => a + num(d.min), 0);
      add('neil', -Math.min(0.6, 0.2 * mine.length));
      if (tot) facts.push({ t: 'You asked for ' + tot + ' min of delay', v: -0.2 });
    }
    // how quickly the captain answered the crew's calls
    const sent = f.sentAt || {};
    const lag = id => cf[id] == null ? null : (sent['q:' + id] != null ? Math.max(0, (cf[id] - sent['q:' + id]) / MIN) : 0);
    const lags = ['apu', 'start', 'taxi'].map(lag).filter(x => x != null);
    if (lags.length) {
      const worst = Math.max.apply(null, lags), avg = lags.reduce((a, x) => a + x, 0) / lags.length;
      if (worst > 5) { add('priya', -0.4); facts.push({ t: 'Kept the crew waiting ' + Math.round(worst) + ' min on a call', v: -0.4 }); }
      else if (avg <= 1.5) { add('priya', 0.3); facts.push({ t: 'Sharp on the crew’s calls', v: 0.3 }); }
      if ((lag('start') || 0) > 5) add('tomas', -0.2);

    // decisions, and how they played out
    const evs = (s.companion && s.companion.events) || [];
    evs.forEach(ev => {
      const d = (f.decisions || {})[ev.id];

        const v = num(d.score);
        add('espresso', 0.5 * v); add('neil', 0.3 * v);

  function ratingPrompt(s, r) {
    const b = s.brief;

    }).join('\n');

      'You write the end-of-sector crew ratings in FEATHER NET, the crew companion for a realistic private-jet flight simulator campaign. N511GW is an Embraer Legacy 650 on the Man’s Best Friend World Tour 2027. The captain is Capt Hunter Ferraro.',
      'Sector ' + b.ref + ', ' + b.from.icao + ' (' + b.from.name + ') to ' + b.to.icao + ' (' + b.to.name + ')' + (b.nickname ? ', "' + b.nickname + '"' : '') + '.',

  async function maybeRate() {

  // Day sheet

  function dayRows(s) {
    const b = s.brief, f = s.flight || {}, c = s.companion || {};
    const T = briefTimes(b); if (T.off == null) return [];
    const tl = timeline(s);
    const cf = cfOf(f);
    const offT = tl.off, onT = tl.on;
    const dOff = offT - T.off, dOn = onT - T.on;
    const depMid = localMidnight(T.off, T.fo), arrMid = localMidnight(T.on, T.too);
    const rows = ((c.daySheet && c.daySheet.rows) || []).map((r, i) => {
      if (r.link === 'off') return { i, t: offT, off: T.fo, label: r.label, who: r.who, flight: true, revised: cf.taxi == null && Math.abs(dOff) >= MIN, actual: cf.taxi != null };
      if (r.link === 'on') return { i, t: onT, off: T.too, label: r.label, who: r.who, flight: true, revised: cf.blocks == null && Math.abs(dOn) >= 2 * MIN, actual: cf.blocks != null };
      const arr = r.where === 'arr';
      const p = String(r.t).split(':').map(Number);
      let t = (arr ? arrMid : depMid) + ((p[0] || 0) * 60 + (p[1] || 0)) * MIN + num(r.day) * 86400000;
      let revised = false;
      if (r.moves) { const d = arr ? dOn : dOff; if (Math.abs(d) >= 2 * MIN) { t += d; revised = true; } }
      return { i, t, off: arr ? T.too : T.fo, label: r.label, who: r.who, revised };
    });
    return rows.sort((a, b2) => a.t - b2.t || a.i - b2.i);
  }

    const fpm = form.fpm !== '' && form.fpm != null ? Math.round(Math.abs(num(form.fpm))) : (f.touchdown ? f.touchdown.fpm : null);

    const snags = String(form.snags || '').split('\n').map(x => x.trim()).filter(Boolean);
    const rating = f.rating ? { overall: f.rating.overall, stars: Object.fromEntries(f.rating.raters.map(r => [r.id, r.stars])), espresso: f.rating.lines && f.rating.lines.espresso ? f.rating.lines.espresso : '', via: f.rating.via } : null;

    const year = yy(T.on);

    const decisions = clone(f.decisions || {});
    const effects = clone(f.effects || []);
    ((s.companion && s.companion.events) || []).forEach(ev => {
      if ((f.delivered || []).includes('e:' + ev.id) && !decisions[ev.id]) {
        const o = ev.options.find(x => x.id === ev.def) || ev.options[0];
        decisions[ev.id] = { opt: o.id, label: o.label, outcome: o.outcome + ' (no answer from the flight deck)', title: ev.title, auto: true };

    if (Lnow && (Lnow.log || []).some(x => x.ref === obj.ref)) { toast(obj.ref + ' is already in the log as flown.'); return null; }
    const brief = clone(obj);
    const companion = brief.companion; delete brief.companion;
    const ups = Array.isArray(brief.ledgerUpdates) ? brief.ledgerUpdates : []; delete brief.ledgerUpdates;
    const story = brief.story && typeof brief.story === 'object' ? { opsReason: String(brief.story.opsReason || ''), detail: String(brief.story.detail || ''), kind: String(brief.story.kind || '').toLowerCase().slice(0, 16) } : null;
    const L = App.state || emptyLedger();
    const T = briefTimes(brief);
    const ctx = { ref: brief.ref, date: T.off != null ? ddmmmyy(T.off, T.fo) : '', stn: brief.from.icao, year: meta.year || yy(T.off), prevRef: ((L.log || []).slice(-1)[0] || {}).ref };
    const applied = applyUpdates(L, ups, ctx);
    const cont = enforceContinuity(brief, applied.L, Object.assign({}, ctx, { renumber: applied.renumber }));
    const draft = { ref: brief.ref, status: 'draft', brief: cont.brief, story, ledgerUpdates: ups, updateNotes: applied.notes, fixes: cont.fixes, dice: meta.dice || null, source: meta.source, companion: companion ? normCompanion(companion, cont.brief) : null, createdAt: Date.now() };
    App.draft = putDraft(draft);
    return App.draft;
  }

  async function writeCompanion(draft, dice, signal) {
    const d = dice || draft.dice || rollDice(App.state || emptyLedger(), '');
    const g = App.ui.gen || (App.ui.gen = { stage: 'companion', chars: 0, tail: '' });
    g.stage = 'companion'; render();
    const pending = applyUpdates(App.state || emptyLedger(), draft.ledgerUpdates || [], { ref: draft.ref, date: '', stn: draft.brief.from.icao, year: yy(briefTimes(draft.brief).off) }).L;
    const b = Object.assign({}, draft.brief, { story: draft.story || undefined });
    const res = await AI.json(companionPrompt(b, pending, d), { modelTier: 'default', cache: false, signal, onText: ({ text }) => { g.chars = text.length; g.tail = text.slice(-420); updateGen(); } });
    const comp = normCompanion(res, draft.brief);
    if (!comp.beats.length) throw { code: 'invalid_json', message: 'no beats' };
    const next = Object.assign({}, App.draft && App.draft.ref === draft.ref ? App.draft : draft, { companion: comp, dice: d });
    App.draft = putDraft(next);
    return App.draft;
  }

  function parseLoose(t) {
    const s = String(t || '').trim();
    const a = s.indexOf('{'), z = s.lastIndexOf('}');
    if (a < 0 || z <= a) return null;
    try { return JSON.parse(s.slice(a, z + 1)); } catch (e) { return null; }
  }

  function release() {
    const d0 = App.draft; if (!d0) return;
    const d = clone(d0);
    if (!d.companion) d.companion = plainCompanion(d.brief);
    const L0 = App.state || emptyLedger();
    if (L0.active && L0.active !== d.ref && App.sector && App.sector.status !== 'flown') { toast('Close ' + L0.active + ' first. Log it as flown on this tab if you flew it without FEATHER NET.'); return; }
    const T = briefTimes(d.brief);
    const ctx = { ref: d.ref, date: T.off != null ? ddmmmyy(T.off, T.fo) : '', stn: d.brief.from.icao, year: yy(T.off) };
    const applied = applyUpdates(L0, d.ledgerUpdates || [], ctx);
    const aog = openItems(applied.L).filter(i => i.aog);
    if (aog.length && !App.ui.aogOk) { App.ui.modal = { kind: 'aog', items: aog }; render(); return; }
    App.ui.aogOk = false;
    const rel = Object.assign({}, d, { status: 'released', companion: d.companion, releasedAt: Date.now() });
    delete rel._rev; delete rel._by; delete rel._at;
    putSector(rel);
    App.draft = null; App.ui.gen = null;
    Store.del('drafts/current').catch(() => {});
    App.prefs.tab = 'flight'; savePrefs();
    const fresh = !(L0.log || []).length && !(L0.items || []).length && !num(L0.aircraft && L0.aircraft.hours);
    saveState(L => {
      Object.assign(L, applied.L);
      if (fresh) bootstrapFromBrief(L, d.brief);
      L.aircraft = L.aircraft || {};
      if (!L.aircraft.at) { L.aircraft.at = d.brief.from.icao; L.aircraft.atName = d.brief.from.name || ''; L.aircraft.parked = d.brief.from.parking || ''; }
      if (d.brief.techLog && d.brief.techLog.lastInsp) L.aircraft.lastInsp = d.brief.techLog.lastInsp;
      L.active = d.ref;
      L.next = d.brief.next ? Object.assign({}, d.brief.next) : L.next;
      L.recent = (L.recent || []).filter(r => r.ref !== d.ref).concat([{ ref: d.ref, kind: (d.story && d.story.kind) || '', spotlight: (d.dice && d.dice.spotlight) || '' }]).slice(-8);
    });
    if (App.sectorRef !== d.ref) watchSector(d.ref);
    toast(d.ref + ' released for flight.');
    render();
  }

  // ════════════════════════════════════════════════════════════════
  // Brief frame (Crew PDF)
  // ════════════════════════════════════════════════════════════════
  // The brief lives in one iframe that is created once and never moved, so it never reloads.
  const Frame = {
    el: null, ready: false, shown: null,
    ensure(host) {
      if (!this.el) {
        this.el = document.createElement('iframe');
        this.el.title = 'Crew trip brief';
        window.addEventListener('message', e => {
          if (!this.el || e.source !== this.el.contentWindow) return;
          if (e.data && e.data.feather === 'ready') { this.ready = true; this.shown = null; this.push(); const l = $('#pdfwrap .loading'); if (l) l.remove(); }
        });
        this.el.src = 'brief/brief.html#embed';
        host.appendChild(this.el);
      }
      this.fit(host);
    },
    target() {
      if (App.ui.pdfSector) return App.ui.pdfSector;
      if (App.ui.pdfDraft && App.draft) return App.draft;
      return App.sector || App.draft || App.lastFlown;
    },
    push() {
      const s = this.target();
      if (!this.ready || !s || !s.brief) return;
      const key = s.ref + ':' + (s.brief.rev || '') + ':' + (s.brief.issuedZ || '') + ':' + JSON.stringify(s.brief).length;
      if (this.shown === key) return;
      this.shown = key;
      try { this.el.contentWindow.postMessage({ feather: 'load', sector: s.brief }, /^https?:\/\//.test(window.origin || '') ? window.origin : '*'); } catch (e) { console.error(e); }
    },
    fit(host) {
      if (!host || !this.el) return;
      const top = host.getBoundingClientRect().top;
      const reserve = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tabbar')) || 0;
      const H = Math.max(360, window.innerHeight - top - reserve - 16);
      host.style.height = H + 'px';
      const W = host.clientWidth;
      const nat = 880;
      const k = Math.min(1, W / nat);
      this.el.style.width = (k < 1 ? nat : W) + 'px';
      this.el.style.height = (H / k) + 'px';
      this.el.style.transform = k < 1 ? 'scale(' + k + ')' : 'none';
    }
  };
  window.addEventListener('resize', () => { const host = $('#pdfwrap'); if (host) Frame.fit(host); });

  async function downloadBrief(s) {
    if (!s || !s.brief) return;
    const dl = await downloadsCap();
    if (!dl) { toast('Downloads aren’t available here. Use Copy JSON and load it into the template instead.'); return; }
    try {
      const txt = await (await fetch('brief/brief.html')).text();
      const pre = '<script>window.FEATHER_PRELOAD = ' + JSON.stringify(s.brief).replace(/</g, '\\u003c') + ';</' + 'script>';
      const i = txt.indexOf('<body>');
      const out = i >= 0 ? txt.slice(0, i + 6) + '\n' + pre + txt.slice(i + 6) : txt;
      await dl.save({ filename: s.ref + ' ' + s.brief.from.icao + '-' + s.brief.to.icao + ' Crew Brief.html', data: new Blob([out], { type: 'text/html' }) });
      toast('Saved. Open it in your browser and print to PDF from there.');
    } catch (e) {
      if (e && e.code === 'declined') return;
      toast('Couldn’t save the brief (' + ((e && e.code) || 'error') + ').');
    }
  }

  async function importCampaign(text) {

  // ════════════════════════════════════════════════════════════════
  // FEATHER LINK: X-Plane and map data, built into the desktop app (see host-shim.js).
  // ════════════════════════════════════════════════════════════════
  // the desktop app names the server from its display name, FEATHER LINK -> FEATHER_LINK
  const LINK_SERVERS = ['host:FEATHER_LINK'];
  const Link = {
    mcp: null, perms: null, server: null, state: 'pending', msg: '', snap: null, at: 0, since: 0, session: null,
    timer: null, inflight: false, eta: null, etaFor: null, failN: 0, clockOff: null, parkSince: 0,
    async init() {
      const use = n => (window.claude && typeof window.claude.use === 'function' ? window.claude.use(n) : Promise.resolve(null));
      try { this.mcp = await use('mcp'); } catch (e) { this.mcp = null; }
      try { this.perms = await use('permissions'); } catch (e) { this.perms = null; }
      if (!this.mcp) { this.state = 'unavailable'; scheduleRender(); return; }
      let st = 'prompt';
      if (this.perms) { try { st = await this.perms.state('mcp:' + LINK_SERVERS[0]); } catch (e) { st = 'prompt'; } }
      this.state = 'idle';
      if (st === 'granted' || App.prefs.linkOn) this.connect();
      scheduleRender();
    },
    get usable() { return !!this.server && (this.state === 'live' || this.state === 'waiting'); },
    async call(tool, input, ms) {
      const opts = { cache: false };
      if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') opts.signal = AbortSignal.timeout(ms || 12000);
      const r = await this.mcp.callTool(this.server, tool, input || {}, opts);
      return r && r.payload !== undefined ? r.payload : r;
    },
    async connect() {
      if (!this.mcp || this.inflight) return;
      clearTimeout(this.timer);
      this.state = 'checking'; this.msg = ''; scheduleRender();
      let last = null;
      for (const name of (this.server ? [this.server] : LINK_SERVERS)) {
        this.server = name; this.inflight = true;
        try {
          const p = await this.call('sim_state', { since: 0 }, 20000);
          this.inflight = false;
          App.prefs.linkOn = true; savePrefs();
          this.failN = 0;
          this.apply(p);
          this.loop();
          return;
        } catch (e) {
          this.inflight = false; last = e;
          if (!(e && (e.code === 'server_not_connected' || e.code === 'server_not_found'))) break;
        }
      }
      this.server = null;
      this.fail(last);
    },
    loop() {
      clearTimeout(this.timer);
      if (!this.server) return;
      const s = App.sector;
      const flying = !!(s && s.flight && s.flight.clock && s.status !== 'flown');
      this.timer = setTimeout(() => this.poll(), document.hidden ? 8000 : flying ? 1500 : 4000);
    },
    async poll() {
      if (!this.server || this.inflight) { this.loop(); return; }
      this.inflight = true;
      let keep = true;
      try { const p = await this.call('sim_state', { since: this.since }, 8000); this.failN = 0; this.apply(p); }
      catch (e) { keep = this.fail(e); }
      finally { this.inflight = false; if (keep) this.loop(); }
    },
    // returns whether to keep polling
    fail(e) {
      const c = e && e.code;
      const was = this.state;
      if (c === 'server_not_connected' || c === 'server_not_found') { this.state = 'no-host'; this.server = this.server || null; }
      else if (c === 'not_in_manifest' || c === 'cancelled' || c === 'approval_required' || c === 'blocked_by_policy' || c === 'consent_required') this.state = 'denied';
      else if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') this.state = 'unavailable';
      else if (c === 'tool_error') { this.failN++; this.msg = e.message || 'FEATHER LINK reported a problem.'; if (this.failN >= 2) this.state = 'error'; }
      else { this.failN++; this.msg = (e && e.message) || 'No answer from FEATHER LINK.'; if (this.failN >= 3) this.state = 'error'; }
      if (was !== this.state) scheduleRender();
      return this.state === 'error' || this.state === 'live' || this.state === 'waiting' || this.state === 'checking';
    },
    apply(p) {
      if (!p || typeof p !== 'object') return;
      if (p.session && p.session !== this.session) { this.session = p.session; this.since = 0; }
      this.snap = p; this.at = Date.now();
      const evs = Array.isArray(p.events) ? p.events : [];
      if (typeof p.lastSeq === 'number') this.since = p.lastSeq;
      const was = this.state;
      this.state = p.xplane && p.xplane.connected ? 'live' : 'waiting';
      if (was !== this.state) scheduleRender();
      try { simSync(p, evs); } catch (e) { console.error('sim sync', e); }
      updateSimBits();
      mapData();
    },
    liveFor(s) {
      return this.state === 'live' && !!s && !!s.flight && !!s.flight.clock && s.flight.simOn !== false && !!App.sector && s.ref === App.sector.ref && s.status !== 'flown';
    },
    statusText() {
      return ({
        pending: 'Checking for FEATHER LINK…', unavailable: 'Sim link isn’t available in this view.', idle: 'Not connected', checking: 'Connecting…',
        'no-host': 'FEATHER LINK isn’t running', denied: 'FEATHER LINK isn’t allowed', waiting: 'Waiting for X-Plane', live: 'X-Plane live', error: 'FEATHER LINK isn’t answering'
      })[this.state] || '';
    }
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Link.server) Link.loop(); });

  // X-Plane gives the time of day in UTC; pick the date that puts it nearest the reference.
  function dayResolve(sec, ref) {
    const d = new Date(ref);
    const base = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) + sec * 1000;
    return [base - 86400000, base, base + 86400000].reduce((a, b) => (Math.abs(b - ref) < Math.abs(a - ref) ? b : a));
  }
  function gcNm(a, b) {
    const R = 3440.065, toR = Math.PI / 180;
    const dLat = (b.lat - a.lat) * toR, dLon = (b.lon - a.lon) * toR;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
  }

  const SIM_SAID = { apu: 'APU’s up.', start: 'Both engines are stable.', taxi: 'Brakes off, we’re rolling.', blocks: 'Brake’s set. On blocks.' };
  const SIM_REACT = {
    belt_off: { from: 'Tomás', ch: 'ICS', text: 'Sign’s off. I’ll get the service going.' },
    belt_on: { from: 'Tomás', ch: 'ICS', text: 'Sign’s back on. Getting everyone seated and the hot drinks away.' },
    turbulence: { from: 'Tomás', ch: 'ICS', text: 'Bit bumpy back here. Holding the hot drinks till it settles.' },
    steep_bank: { from: 'Tomás', ch: 'ICS', text: 'Easy on the turns, Cap. The coffee’s on the move.' }
  };

  // What X-Plane says happened, applied to the sector.
  function simSync(p, evs) {
    const s = App.sector;
    if (!s || !s.flight || !s.flight.clock || s.status === 'flown' || s.flight.simOn === false) return;
    const f = s.flight;
    const T = briefTimes(s.brief);
    const now0 = simNow(f);
    let clockChange = null, follow = false, simT = null;
    if (p.sim && typeof p.sim.zuluSec === 'number') {
      simT = dayResolve(p.sim.zuluSec, now0 != null ? now0 : (T.off != null ? T.off : Date.now()));
      follow = T.off == null || Math.abs(simT - T.off) < 8 * 3600000;
      Link.clockOff = follow ? null : simT;
      if (follow) {
        const paused = !!p.sim.paused;
        if (Math.abs(simT - now0) > 15000 || paused === !!f.clock.running) clockChange = { sim: simT, real: Date.now(), running: !paused };
      }
    }
    const nowSim = clockChange ? clockChange.sim : now0;
    const evTime = e => (follow && typeof e.simSec === 'number' ? dayResolve(e.simSec, nowSim) : nowSim - Math.max(0, Date.now() - num(e.real, Date.now())));
    const S0 = f.sim || {};
    const sameSession = S0.session === Link.session;
    const lastSeq = sameSession ? num(S0.seq) : 0;
    const fresh = evs.filter(e => e && e.seq > lastSeq && (sameSession || num(e.real) >= num(f.startedAt) - 60000));
    const firstT = type => { const e = fresh.find(x => x.type === type); return e ? evTime(e) : null; };
    const ac = p.ac;

    if (clockChange) saveSector(x => { x.flight.clock = clockChange; }, { bg: true });

    // steps the sim has already done, in order
    if (ac) {
      const moved = !ac.onGround || fresh.some(e => e.type === 'taxi' || e.type === 'takeoff') || (ac.gsKt > 5 && !ac.parkBrake);
      let nx = nextStep(App.sector.flight);
      if (nx && nx.id === 'apu' && (ac.apu || ac.engines > 0 || moved)) { confirmStep('apu', { by: 'sim', at: firstT('apu_on') || nowSim }); nx = nextStep(App.sector.flight); }
      if (nx && nx.id === 'start' && (ac.engines >= 2 || moved)) { confirmStep('start', { by: 'sim', at: firstT('engines_running') || firstT('engine_start') || nowSim }); nx = nextStep(App.sector.flight); }
      if (nx && nx.id === 'taxi' && moved) { confirmStep('taxi', { by: 'sim', at: firstT('taxi') || nowSim }); }
    }
    // the moments of the flight itself
    const g0 = App.sector.flight;
    const act = Object.assign({}, g0.act || {});
    const reacted = Object.assign({}, g0.reacted || {});
    let dirty = false, td = null, parked = null;
    const react = [];
    fresh.forEach(e => {
      const t = evTime(e);
      switch (e.type) {
        case 'takeoff': if (act.to == null) { act.to = t; dirty = true; } break;
        case 'toc': if (act.toc == null && act.to != null) { act.toc = t; dirty = true; } break;
        case 'tod': if (act.tod == null && act.to != null) { act.tod = t; if (act.toc == null) act.toc = t; dirty = true; } break;
        case 'below_10k': if (act.app == null && act.tod != null) { act.app = t; dirty = true; } break;
        case 'belt_off': if (act.to != null && act.ldg == null && act.belt == null) { act.belt = t; dirty = true; react.push('belt_off'); } break;
        case 'belt_on': if (act.toc != null && act.tod == null) react.push('belt_on'); break;
        case 'turbulence': if (act.to != null && act.ldg == null) react.push('turbulence'); break;
        case 'steep_bank': if (act.to != null && act.ldg == null) react.push('steep_bank'); break;
        case 'touchdown': if (act.ldg == null && act.to != null) { act.ldg = t; dirty = true; td = e.data || {}; } break;
        case 'parked': if (act.ldg != null || td) parked = { t, fuel: num((e.data || {}).fuelLb, NaN) }; break;
        default: break;
      }
    });
    // joined in the air: the takeoff happened before the link saw it
    if (ac && !ac.onGround && act.to == null && cfOf(g0).taxi != null) { act.to = timeline(App.sector).to; dirty = true; }
    // a live ETA from where the aeroplane actually is
    const P = sectorPlaces(s);
    if (ac && !ac.onGround && P.arr.airport && act.to != null) {
      const remain = gcNm(ac, P.arr.airport) / Math.max(ac.gsKt || 0, 150) * 60 + (act.tod != null ? 2.5 : 5);
      const eta = nowSim + remain * MIN;
      Link.eta = Link.etaFor === s.ref && Link.eta ? Link.eta * 0.7 + eta * 0.3 : eta;
      Link.etaFor = s.ref;
    }
    const maxSeq = fresh.reduce((m, e) => Math.max(m, e.seq), lastSeq);
    const hasBeltBeat = ((s.companion && s.companion.beats) || []).some(b => /^belt/.test(String(b.at)));
    const todo = react.filter(k => !reacted[k] && !(k === 'belt_off' && hasBeltBeat));
    if (dirty || todo.length || maxSeq !== lastSeq || !sameSession) {
      saveSector(x => {
        const g = x.flight;
        g.act = Object.assign({}, g.act || {}, act);
        g.sim = { session: Link.session, seq: maxSeq };
        g.reacted = Object.assign({}, g.reacted || {});
        g.queue = g.queue || [];
        todo.forEach(k => { g.reacted[k] = true; const r = SIM_REACT[k]; g.queue.push({ key: 'sim:' + k, kind: 'beat', ch: r.ch, from: r.from, text: r.text, due: simNow(g) + 6000 }); });
      }, { bg: true });
    }
    if (td && td.fpm) submitTouchdown(td.fpm, { by: 'sim', g: td.g, at: act.ldg });
    // parked after landing: the event, or stopped with the brake set for a few seconds
    let nx2 = nextStep(App.sector.flight);
    if (nx2 && nx2.id === 'blocks' && (App.sector.flight.act || {}).ldg != null) {
      if (!parked && ac && ac.onGround && ac.gsKt < 1 && ac.parkBrake) { if (!Link.parkSince) Link.parkSince = Date.now(); if (Date.now() - Link.parkSince > 6000) parked = { t: nowSim, fuel: ac.fuelLb }; }
      else if (!parked) Link.parkSince = 0;
      if (parked) { Link.parkSince = 0; confirmStep('blocks', { by: 'sim', at: parked.t, fuel: isFinite(parked.fuel) ? parked.fuel : (ac ? ac.fuelLb : null) }); }
    }
  }

  // ════════════════════════════════════════════════════════════════
  // The party: where everyone is and what they're doing. Most of them never
  // talk to the flight deck; you see them here instead.
  // ════════════════════════════════════════════════════════════════
  const SEAT_LINES = {
    '1': ['On the divan, lights down', 'On the divan with Goodwin', 'Aft cabin, door closed'],
    '2': ['Laptop open, tomorrow’s schedule', 'On the production call sheet', 'Going through the advance for the next city'],

  // Where the aeroplane is: live from X-Plane, or worked out from the timeline.

      const w = whereIs(s, r.id, now, tl, plan, stage);
      const ov = doingOverride(s, r.id, now, tl);

        // an override only holds while the person is still where it was written for
        const t0 = (((s.companion || {}).doing || {})[r.id] || []).map(d => dueAt(parseAt(d.at), tl, cfOf(f))).filter(t => t != null && t <= now).sort((a, b) => b - a)[0];
